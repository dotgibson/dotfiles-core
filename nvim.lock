#   make sync-nvim                     # follow nvim_branch's tip
#   scripts/sync-nvim.sh --ref vX.Y.Z  # pin an exact release (the normal bump)
#
# THE DIRECTION IS THE POINT. core.lock is written BY this repo INTO each OS repo; this
# lock is written INTO this repo by a source it does not control. dotfiles-nvim is a repo
# Core vendors FROM, never one Core fans out TO — so it is deliberately absent from
