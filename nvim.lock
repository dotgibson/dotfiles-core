# the way Core's is.
#
# WHEN THE PIN MOVES: with a Core release, never on every nvim release
# (NVIM-SPLIT-PROPOSAL.md §7(3)). Adopting each editor release as it lands would reimport
# through the lock exactly the churn the extraction removed. scripts/check-nvim-freshness.sh
# reports how many releases behind this pin is, so "at Core's pace" cannot decay into
# "never".
# ──────────────────────────────────────────────────────────────────────────────
