# scripts/modern-baseline.yml
# ──────────────────────────────────────────────────────────────────────────────
# THE MODERN FLOOR for the fleet's CI. This is the declarative source of truth for
# what "modern" means; scripts/check-modern.sh enforces every rule here, and
# audit-core.sh runs it as a gate (section 8c) so a workflow can never regress below
# the floor. It generalizes the SHA-pinning discipline the fleet already follows into
# ONE contract — and closes G8 (mutable container tags were the one break in it).
#
# Raise the floor DELIBERATELY (the future /modernize routine proposes bumps); never
# lower it. The format is intentionally FLAT and greppable — top-level `key:` scalars
# and `key:` + `  - item` lists only — so check-modern.sh parses it with awk, not a
# YAML library (the same "no dependency" discipline as tool-versions.env).
# ──────────────────────────────────────────────────────────────────────────────
schema: 1

# 1) Deprecated GitHub Actions workflow-command patterns that must never appear.
#    The stdout `set-output`/`save-state`/`set-env`/`add-path` commands were removed;
#    use the $GITHUB_OUTPUT / $GITHUB_ENV / $GITHUB_PATH files instead.
banned_patterns:
  - "::set-output"
  - "::save-state"
  - "::set-env"
  - "::add-path"
  # Old JS action runtimes: Node 24 is the default runner runtime since 2026-06-16;
  # node20 is removed from the runners on 2026-09-23 (the 2025-09-19 deprecation
  # changelog; its editor's note of 2026-08-25 fixed the date); node16 is long gone.
  # Guards first-party action.yml `using:` declarations from browning out (third-party
  # runtimes live in SHA-pinned upstreams and are a freshness-triage concern, not a
  # floor one — and every external action in the tree already resolves to node24 at
  # its pinned SHA).
  - "using: node16"
  - "using: node20"
  # The per-step opt-out that forces a node20 action to keep running on node20. It
  # stops working entirely once node20 leaves the runners (2026-09-23), so reaching
  # for it buys a few months and then browns out — ban the dead end rather than let
  # a future bump-dodge land on it.
  - "ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION"
  # The checkout input that restores fork-PR checkout under pull_request_target /
  # workflow_run. actions/checkout v7 (2026-06-18) began refusing a `repository:`, `ref:`
  # or head SHA that resolves to the fork — the "pwn request" shape, where untrusted fork
  # code runs with the base repo's token; enforcement was backported 2026-07-20 to
  # v3.7.0/v4.4.0/v5.1.0/v6.1.0/v7.0.1. GitHub named the opt-out to be greppable in code
  # review, so grep for it. A job that genuinely needs fork code should use the
  # untrusted-input pattern (build in `pull_request`, consume the artifact from a
  # privileged `workflow_run`) rather than re-enable the unsafe fetch.
  - "allow-unsafe-pr-checkout"

# 2) End-of-life runner labels that must not be used — pick a supported image.
banned_runners:
  - ubuntu-18.04
  - ubuntu-20.04
  - macos-11
  - macos-12
  # Full-line comments only — check-modern.sh's list parser does NOT strip an inline
  # `# …`, so a trailing comment would become part of the banned string and the ban
  # would silently never match. Rationale for the four below: macos-13 retired
  # 2025-12-04; windows-2019 unsupported since 2025-06-30; ubuntu-22.04 deprecation opens
  # 2026-09-17, brownouts 2027-03-23/03-30/04-06/04-13, fully unsupported 2027-04-17
  # (pre-emptive — the fleet rides ubuntu-latest, so it's free to ban);
  # macos-14 deprecation opened 2026-07-06, fully unsupported 2026-11-02 (pre-emptive —
  # the fleet rides macos-latest, so it's free to ban).
  - macos-13
  - windows-2019
  - ubuntu-22.04
  - macos-14

# 3) Every EXTERNAL action `uses:` must pin a full 40-hex commit SHA (a tag or branch
#    is mutable and a supply-chain risk). Local `./…` refs are exempt, and so are the
#    fleet's own reusable workflows — but ONLY in the exact shape the @vN moving-major
#    policy in RELEASE-STRATEGY.md describes:
#
#        <owner>/<repo>/.github/workflows/<name>.yml@v<N>
#
#    The exemption used to be a bare owner match, which let `uses: dotgibson/anything@main`
#    through the gate outright — a strictly wider grant than the policy it was named for,
#    and one nothing else asserted. Anything from this owner that is not a @vN reusable
#    workflow now falls back to the 40-hex requirement, which is the correct default for a
#    ref whose contract is not governed by the release process.
require_action_sha_pin: true
sha_pin_exempt_owner: dotgibson

# 4) Every container image must pin an @sha256: digest — a tag like `alpine:3.21` or
#    `archlinux:latest` moves under you. Covers every surface an image reaches CI by: an
#    `image:` value, the `container: <img>` shorthand, a `uses: docker://<img>` action, a
#    `docker|podman run|build|pull|create <image>` command, a Containerfile `FROM` written
#    into a heredoc, and a REGISTRY-QUALIFIED image bound to a shell variable (the shorthand
#    + docker:// forms slip rule 3's owner/repo sha-pin check, so rule 4 has to catch them).
#
#    The command scan is ENGINE-AGNOSTIC and joins `\` continuations, because the rule used
#    to name `docker` and read one physical line at a time — and a workflow that reached for
#    podman, a heredoc Containerfile and a line continuation therefore ran three unpinned
#    external images, one of them `:latest` under --privileged, while this gate stayed green
#    (#1055). An image built in the same job (`localhost/…`, a `localhost:5000/…` push) is
#    exempt in check-modern.sh: no digest can exist for it.
#
#    The ASSIGNMENT surface closes the same lesson one level up (#1099): keying on a command
#    is as brittle as keying on a tool, because `img='nixos/nix:latest'` fed through a matrix
#    and run as `"$IMAGE"` never reaches a command line at all. It is deliberately narrower
#    than the command scan — the value must be registry- or namespace-qualified, since an
#    assignment carries no context to say an argument is an image.
require_container_digest_pin: true

# 5) Every WORKFLOW must declare a top-level `permissions:` block. Without one a job
#    inherits the repo-wide default token scope; naming it forces the least-privilege
#    grant to be a deliberate, reviewable line. Workflows only — `permissions:` is not
#    a valid key in a composite action.yml, so check-modern.sh scopes this rule to
#    .github/workflows/ and skips .github/actions/.
require_workflow_permissions: true

# 5b) A `permissions:` block must not be a BLANKET grant. `write-all` hands the job token
#     every scope there is — it satisfies rule 5 (a block is present and named) while being
#     strictly worse than no block at all, which is the one hole in "naming the grant makes
#     it reviewable". check-modern.sh reads the VALUE at any indent, so the job-level form
#     is caught too (a job grant that widens to everything narrows nothing), quoted or bare,
#     and with a trailing `# comment` tolerated — a rationale beside the grant must not be
#     the way past the gate.
#
#     `read-all` is deliberately NOT here: it is not a token-abuse vector, and banning it
#     buys noise. And this is its own dimension rather than a `banned_patterns` entry
#     because that list is a blind `grep -F` — the word could then never appear in a
#     workflow comment at all, not even to explain why a grant is narrow.
#
#     Like rule 8, not deprecation-driven, and worth saying so plainly: it is free while the
#     fleet is at 0 occurrences, and Core owns the *-call.yml@vN reusable workflows the OS
#     repos actually execute. Full-line comments only, per the parser note under
#     banned_runners above.
banned_permission_values:
  - write-all

# 6) Every `actions/checkout` step must state `persist-credentials:` explicitly. Left
#    unset it defaults to TRUE, writing the job's token into .git/config where any later
#    step — a third-party linter, a scripted tool, an LLM routine reading the tree — can
#    read it back out. Nearly every checkout here only reads code and wants `false`.
#
#    Requiring the KEY rather than hard-requiring the VALUE `false` is deliberate: it is
#    the exemption path. The few steps that genuinely push (auto-tag's tag push, the
#    freshness bot's branch push) carry `persist-credentials: true` plus a comment saying
#    why, right at the call site — so the exemption is reviewed in the diff that needs it
#    instead of living in a list here that silently drifts out of sync with the workflows.
require_explicit_persist_credentials: true

# 7) No attacker-controlled expression may be spliced into a `run:` body. A `${{ }}`
#    expression is substituted by the RUNNER, textually, before the shell ever sees the
#    script — so a PR title or a branch name is not data at that point, it is source code.
#    Route it through `env:` and read `$VAR`, which the shell treats as a value.
#
#    The fleet already follows this by written convention (auto-tag-call.yml and
#    notify-web-call.yml both spell out the reasoning at the call site) — but a comment is
#    not a gate, and `actionlint`, which the audit already runs, has no equivalent rule.
#    Template injection is the live exploitation path, not a theoretical one.
#
#    `github.ref_name` is the branch or tag name on a `push` — the same attacker-chosen
#    string `github.head_ref` carries on a pull_request, arriving by another trigger. Git
#    refnames forbid spaces and `~^:?*[\` but allow `$ ; & | ( ) { }`, so the injection shape
#    is real. `github.base_ref` is weaker (a PR author can only pick a branch that already
#    exists) and is listed for uniformity at zero cost: both were env-routed already
#    (release.yml's TAG, ci.yml's BASE_REF) when they joined the list.
#
#    `inputs.` is NOT in this list — it is in the workflow-only list below. The list here
#    applies to every gated file, composite actions included, and setup-core-tools/action.yml
#    interpolates `${{ inputs.bindir }}` inline in ~8 run: steps: a first-party composite
#    input, where banning it is a fix-first migration for no gain.
#
#    Full-line comments only, per the parser note under banned_runners above.
banned_run_interpolation_contexts:
  - github.event.
  - github.head_ref
  - github.ref_name
  - github.base_ref
  - github.actor
  - github.triggering_actor

# 7b) The same ban, applied only to files under .github/workflows/. The composite-action
#     exemption above was being applied GLOBALLY, which left the bare `inputs.*` context
#     ungated in the workflows — and there it is `workflow_dispatch` free text, or a
#     `workflow_call` value one of the sibling repos feeds a Core *-call.yml@vN workflow
#     (lint-call's extra_ls_files_excludes, notify-failure-call's title/details,
#     claude-routines-call's distro). `github.event.inputs.*` was already caught by the
#     `github.event.` entry; the bare form was not.
#
#     Free when it joined: every `inputs.` interpolation in the workflows was already
#     `KEY: ${{ inputs.x }}` under an `env:` block — a convention the fleet followed without
#     a gate. Full-line comments only, per the parser note under banned_runners above.
banned_run_interpolation_contexts_workflow_only:
  - inputs.

# 8) Every job that runs on a runner must declare `timeout-minutes:`. Left unset, GitHub's
#    default is 360 minutes — six hours of a held runner and a live GITHUB_TOKEN for a job
#    that hung on a prompt, a network stall, or a step that was tampered with. All 58 runner
#    jobs here already set one; this keeps that true as the *-call.yml@vN reusable workflows
#    fan out to the fleet.
#
#    Keyed on `runs-on:`, NOT on "every job": a job that calls a reusable workflow (`uses:`
#    at job level — there are 11, every one a notify-failure-call/notify-web-call) cannot
#    legally carry timeout-minutes, so requiring it there would be a guaranteed false fire.
#
#    Unlike the rest of this file, this rule is NOT driven by a dated upstream deprecation,
#    and it is worth saying so plainly rather than dressing it up: it is the standard
#    supply-chain-hardening recommendation, and the reason to encode it now is structural.
#    Core owns all six *-call.yml@vN reusable workflows the fleet consumes, so the jobs the
#    OS repos actually execute are defined here. Cheap while the fleet is at 58/58; expensive
#    once someone lands job 59 without it.
require_job_timeout: true

# 9) A caller must not pass `secrets: inherit` to a reusable workflow. It hands the callee
#    EVERY secret the caller repo holds, and the callee may read them whether or not its
#    `on.workflow_call.secrets` declares them (GitHub's docs say so outright), so the
#    declaration buys nothing. Map each secret by name instead:
#
#        secrets:
#          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
#    It compounds with rule 3's @vN exemption: the fleet calls Core's *-call.yml workflows
#    at a MOVING major tag, so the code receiving an inherited secret set can change under
#    the caller without a diff in the caller. This is the `write-all` hole of rule 5b one
#    level over, in secret space, and it is its own dimension for the same reason: the value
#    is read anchored to the key, bare or quoted, with a trailing `# comment` tolerated, so
#    the word in prose (a comment explaining why a caller maps its secrets) never fires.
#
#    Like rules 5b and 8, not deprecation-driven. Free when it joined: no workflow in the
#    fleet passed it. The one occurrence was Core's own caller example in
#    claude-routines-call.yml, a comment the seven live callers had already outgrown.
#    Workflows only, since a composite action cannot call a reusable workflow. Full-line
#    comments only, per the parser note under banned_runners above.
banned_call_secrets:
  - inherit
