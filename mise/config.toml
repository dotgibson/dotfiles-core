# core/mise/config.toml  → COPIED to ~/.config/mise/config.toml (NOT symlinked)
# ──────────────────────────────────────────────────────────────────────────────
# Global runtime versions, managed by mise (https://mise.jdx.dev). Portable —
# identical on every machine. Per-project versions live in a project-local
# mise.toml / legacy .nvmrc/.python-version and override these automatically.
#
#   mise install              # install everything declared here
#   mise use -g node@22       # change a global (REWRITES ~/.config/mise/config.toml)
#   mise ls                   # show installed + active versions
#
# COPIED, NOT SYMLINKED — and the `mise use -g` line above is exactly why. This file
# used to be symlinked to ~/.config/mise/config.toml, which made that documented command
# a WRITE PATH INTO THE VENDORED core/ TREE: it rewrote vendored Core in place, stripped
# the trailing comments below (mise rewrites the file, it does not edit the line), left
# the tree TAMPERED per core-integrity, and made sync-core.sh skip that repo on the next
# fan-out with an error naming nothing about mise. bootstrap now ADOPTS this file
# (core/lib/bootstrap-lib.sh → blib_adopt): the copy at ~/.config/mise/config.toml is
# yours, `mise use -g` writes there, and core/ is never touched.
#
# THE TRADE: your copy no longer tracks this file. Editing a pin HERE does not reach an
# already-provisioned box — re-run bootstrap, which reports drift rather than clobbering
# what you have. Changing a pin fleet-wide therefore means: edit here, release, sync,
# re-bootstrap. Your local copy always wins; that is the point.
# ──────────────────────────────────────────────────────────────────────────────

[tools]
node   = "lts"
pnpm   = "latest"     # faster than npm/yarn, less disk; npm/npx still ship with node
python = "3.14"       # many pentest tools (impacket, bloodhound-python) want a real Python
# Python ownership split (deliberate): the line above is the GLOBAL mise-managed interpreter —
# a user-scoped runtime exposed through mise's shims/activation (NOT the OS /usr/bin/python), and
# the one those global tools run on. uv owns PER-PROJECT envs (.venv) and tool running: inside a
# project use `uv run` / `uv sync` (aliased uvr/uvs in zsh/20-aliases.zsh), which resolve the
# project's venv with no manual activation. Project deps belong in that project's pyproject.toml.
ruby   = "4.0"        # evil-winrm, some Metasploit modules, web tooling
go     = "latest"     # lots of security tooling is `go install`-able; enables gopls
rust   = "stable"     # see distro note below
java   = "temurin-21" # Burp Suite, BloodHound legacy — recent LTS
lua    = "5.5"        # handy when hacking on the Neovim config
# NOT the interpreter luacheck runs on, and do not "harmonize" the two. luacheck 1.2.0
# (its last release) cannot even LOAD under 5.5 — 5.5 made some locals const, which trips
# "attempt to assign to const variable" inside luacheck's own source. Both places that
# install it therefore pin an explicit 5.4 of their own and are unaffected by this line:
# .github/workflows/ci.yml (brew lua@5.4) and .claude/hooks/session-start.sh (distro
# lua5.4 + liblua5.4-dev). If you install luacheck against THIS lua, the audit's luacheck
# leg breaks with an error that names neither mise nor this file.

# Toolchains that back Neovim's conform formatters (plugins/conform.lua declares these fleet-wide,
# so :checkhealth flags them as "unavailable" on any box that lacks the binary). Declared here so
# `mise install` supplies them everywhere Core lands, rather than as a per-OS package entry.
zig       = "latest" # `zig fmt` (conform: zigfmt) + zls; also a real compiler
terraform = "latest" # `terraform fmt` (conform: terraform_fmt) + terraform-ls
foundry   = "latest" # provides forge/cast/anvil/chisel — `forge fmt` (conform: forge_fmt) for Solidity
# Distro note: mise pulls foundry as a prebuilt (ubi:foundry-rs/foundry) that is glibc-linked, so it
# won't run on Alpine's musl. Omitting it from a local config does NOT drop it — mise MERGES the
# global + local [tools], so the inherited `foundry` still installs. Exclude it explicitly instead:
# `disable_tools = ["foundry"]` under [settings] in a machine-local mise config, or export
# MISE_DISABLE_TOOLS=foundry from local shell config (the ENV-var idiom already used for
# MISE_TRUSTED_CONFIG_PATHS below). zig and terraform ship self-contained binaries and run everywhere.

# Distro note: on boxes where bootstrap installs `cargo` via the package manager
# (e.g. Fedora, for building yazi/dust), mise's `rust` here will take PATH
# precedence — which is fine (mise's toolchain is newer). If you'd rather the
# distro own Rust on a given machine, drop the `rust` line in a local override.

[settings]
auto_install = false        # explicit installs only; don't fetch on directory entry
legacy_version_file = true  # honor .nvmrc/.ruby-version/.python-version so repos "just work"
experimental = true         # native shims (faster than the shell wrapper)
quiet = false
# B3 — hermetic tool resolution. The [tools] versions above are deliberately FLOATING
# (lts/latest/stable) so the declarations stay readable, but that means two boxes
# provisioned a month apart can land on different runtimes. lockfile=true makes mise
# record the EXACT resolved versions + checksums in a committed mise.lock (next to this
# config), so `mise install` reproduces the same toolchain everywhere — the same idea as
# Cargo.lock / package-lock.json. Generate/refresh it on a real box: `mise install`
# (or `mise lock`) writes mise.lock; commit it. Until it's committed mise resolves
# floating as before, so this is a safe no-op until the lock lands.
#
# READ THIS BEFORE RELYING ON THE PARAGRAPH ABOVE: `lockfile` is PROJECT-SCOPED. mise does
# not lock a GLOBAL config's tools — and on a provisioned box this file IS the global config
# (~/.config/mise/config.toml). Measured on mise 2026.5.16, with this exact file as the
# global config and all 11 tools declared:
#
#     $ mise lock
#     ! No tools configured to lock            # …and no mise.lock written
#
# The identical content as a project mise.toml locks all 7 platforms normally. The fleet
# corroborates it: `lockfile = true` has been set for some time, real installs have gone
# through it (ruby 4.0.6, lua 5.5.1 are installed), and there is no mise.lock anywhere in
# any of the ten repos. So "reproduces the same toolchain everywhere" does NOT hold for the
# global use today — the floating lts/latest/stable pins above are what a box actually
# resolves, and two boxes provisioned a month apart can still differ. Here, this is inert.
#
# Where it DOES bite: this repo keeps the file at mise/config.toml, a path mise treats as a
# PROJECT config — so entering dotfiles-core loads it a second time as a project config (the
# same double-load the global-only-settings note below describes), and `mise install` /
# `mise lock` run from in here will write mise/mise.lock. That file is deliberately
# trackable and NOT gitignored (#729). Keeping this setting is therefore correct; believing
# it makes the FLEET hermetic is not. That would need a different mechanism, not this flag.
lockfile = true

# NB: mise's GLOBAL-ONLY settings (paranoid, trusted_config_paths, …) are intentionally
# NOT set here. This file is symlinked to ~/.config/mise/config.toml (global), but mise
# ALSO auto-loads it as a PROJECT config whenever you're inside a dotfiles repo (it treats
# mise/config.toml as a project path) — and a global-only setting in a non-global config is
# ignored with a WARN on every `cd`. (`paranoid` was just mise's default of false anyway.)
# To trust extra config dirs, set the ENV var in your machine-local shell config — mise
# reads it globally and it raises no warning:
#   ~/.config/zsh/99-local.zsh →  export MISE_TRUSTED_CONFIG_PATHS="$HOME/code"
# (or run `mise trust` inside a given project).

[alias]
# Custom shorthand plugin sources, e.g.:
# node-alpha = "node@nightly"
