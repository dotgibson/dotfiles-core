# core/atuin/config.toml
# ──────────────────────────────────────────────────────────────────────────────
# atuin — the shell-history engine. Core-owned and symlinked to the DEFAULT path
# (~/.config/atuin/config.toml), exactly like starship/lazygit/jujutsu, so no
# ATUIN_CONFIG_DIR is needed. `atuin init zsh` is run (cached) from zsh/00-tools.zsh;
# ATUIN_NOBIND=true is exported there so atuin binds NOTHING itself — zsh/40-bindings.zsh
# owns Ctrl+E (the atuin TUI) and Ctrl+R stays on the fzf history widget (zsh/35-fzf.zsh).
# The whole file is inert on a box without the atuin binary.
#
# PER-MACHINE SETTINGS DO NOT BELONG HERE. Core is authored once and vendored into
# every OS repo, so this file must be identical everywhere. atuin reads env overrides
# with the prefix `ATUIN_` and `__` as the nesting separator, which is the supported
# way for an OS layer (os/<os>.zsh — fragment 80) or a host layer (99-local) to differ:
#
#     export ATUIN_DAEMON__ENABLED=true    # [daemon] enabled — left unset below, so this works
#     export ATUIN_SYNC_ADDRESS=https://…  # sync_address — absent from this file, so this works
#
# AN OVERRIDE ONLY REACHES ATUIN FOR A KEY THIS FILE DOES NOT SET, and that is the whole
# reason the [daemon] block below writes no values. atuin adds the config file as a source
# AFTER the environment one, so the file wins on every key it mentions. A per-machine key
# therefore has to be left unset here — asserting even its own default disables the override.
#
# So the settings below are NOT overridable, by design: search_mode, filter_mode, style,
# inline_height, show_preview, enter_accept, keymap_mode, secrets_filter, history_filter and
# update_check are fleet-wide decisions, asserted on purpose. Wanting one of them to differ
# per machine means DELETING it here, not exporting against it — an `ATUIN_SEARCH_MODE`
# export is silently ignored while `search_mode` is written below (verified against atuin
# 18.19.0: the value stays `fuzzy`).
#
# Account/sync settings ([sync], sync_address, auto_sync) are deliberately ABSENT:
# they are per-account state, not fleet config, and atuin's defaults already no-op
# on a box that never ran `atuin login`. Being absent, they ARE env-overridable.
# ──────────────────────────────────────────────────────────────────────────────

# ── search + TUI ──────────────────────────────────────────────────────────────
# Values match what Core already asserts for the flat zsh history, so the two
# history surfaces behave the same way rather than drifting apart.
search_mode = "fuzzy"  # upstream default; the fzf-shaped matching the rest of the stack uses
filter_mode = "global" # search everything by default (Ctrl+R inside the TUI cycles scopes)
style = "compact"      # inline, not full-screen — the TUI is a lookup, not a destination
inline_height = 25     # rows the compact TUI may take (upstream default: 40)
show_preview = true    # full command text for the highlighted row (long pipelines get truncated)

# enter_accept = false is a SAFETY choice, not a cosmetic one: Enter returns the
# selected command to the prompt for review instead of executing it — the same
# contract as HIST_VERIFY in zsh/15-history.zsh, which expands `!!` for review
# rather than running it blind. (Upstream default is also false; set explicitly so
# a future upstream flip can't silently start running commands on eight machines.)
enter_accept = false

# The fleet runs zsh-vi-mode (zsh/45-plugins.zsh + the zvm_after_init bindings in
# zsh/40-bindings.zsh), so let the TUI follow the shell's active keymap instead of
# pinning atuin to emacs (its default) and fighting muscle memory.
keymap_mode = "auto"

# ── history hygiene ───────────────────────────────────────────────────────────
# secrets_filter is atuin's own "don't record obvious credentials" pass. It is on by
# default upstream; pinned here because it is a security property, not a preference.
secrets_filter = true

# The atuin-side mirror of HISTORY_IGNORE in zsh/15-history.zsh — that file's comment
# already promises "atuin has its own richer filtering (history_filter in config.toml)",
# and until now that promise had nowhere to live. These are Rust regexes (not zsh globs)
# matched against the command line, and they mirror that pattern ENTRY FOR ENTRY, including
# its case sensitivity: the last group is bare (an `API_KEY` or `SECRET` anywhere in the
# line is enough), while PASSWORD/TOKEN/ACCESS_KEY are the assignment forms only — a
# case-insensitive bare `secret` would swallow ordinary work like `kubectl get secret`.
# If you change one list, change the other. Operator habit still beats both: prefix
# anything spicy with a space (HIST_IGNORE_SPACE) and it lands in neither history.
history_filter = [
  "^pass (show|read|insert) ",
  "^op read",
  "--(password|token|api-key)[ =]",
  "(PASSWORD|TOKEN|ACCESS_KEY)=",
  "(API_KEY|APIKEY|SECRET)",
]

# Core owns update nudges (`up` + the once/day check in zsh/60-update.zsh), and this
# one costs a network call on the shell's hot path. One updater, not two.
update_check = false

# ── daemon (OPT-IN — ships OFF) ───────────────────────────────────────────────
# atuin's daemon owns the SQLite writes; shells talk to it over a unix socket instead
# of every shell and every tmux pane contending for the DB lock. That is the contention
# this adopts away — but a shell that starts a background daemon as a side effect of
# being opened is a behaviour change, so it is off here and stays off until a machine
# asks for it.
#
# WHAT IS ACTUALLY MEASURED, AND WHAT IS STILL BORROWED. That rationale came from
# upstream and went unmeasured here. scripts/bench-atuin-daemon.sh now puts numbers on
# the part that can be measured without special hardware: a container reproducing the
# TOPOLOGY of the Alpine path (no systemd, XDG_RUNTIME_DIR unset, so the socket falls
# back to the data dir). 8 concurrent writers, one 20k-row DB, 1600 samples per arm,
# timing `history start` + `history end` TOGETHER:
#
#     p50    ~43 ms -> ~31 ms       ~1.4x faster      (steady across runs)
#     p95    ~57 ms -> ~46 ms       1.2-1.3x faster   (steady across runs)
#     p99    ~65 ms -> 57-106 ms    FLIPS SIGN run to run — unresolved
#     max    ~77 ms -> 140-180 ms   consistently WORSE with the daemon
#
# WHICH METRIC THOSE ARE, because it decides what they can be quoted for. Timing the two
# calls together measures TOTAL WRITE WORK, not prompt latency: atuin's `_atuin_precmd`
# fires `history end` into a detached background subshell — `(atuin history end ... &)` —
# so only `history start`, taken in a command substitution by `_atuin_preexec`, is on the
# path a human waits on. The numbers above are real load; they are not what a command
# costs the user.
#
# THE TAIL QUESTION IS THEREFORE OPEN, not settled. The median and p95 win is solid and
# holds on every host tried. But the far-tail reading — that the daemon trades frequent
# small waits for rarer, larger stalls — comes entirely from pair-timed runs, and the one
# measurement that timed ONLY the blocking call (real Fedora hardware, systemd unit) found
# the opposite: p99 improving 49-69%, with spread collapsing from 2.86x to 1.28x at 16
# writers. `end` is exactly where the two would diverge — with the daemon off it is the
# slower call (the UPDATE costs more than the INSERT) and with it on they equalise. So do
# not repeat either the "removes tail latency" pitch or its rebuttal as established.
# bench-atuin-daemon.sh now reports the two metrics separately; the re-measurement it
# enables is what should settle this. On the autostart path the FIRST command of a fresh
# shell additionally pays ~+41 ms for the daemon spawn (p50, steady across runs).
#
# MUSL, measured since — in an Alpine 3.21 CONTAINER (real Alpine userland, real musl,
# no systemd), against a glibc control on the SAME host, atuin 18.19.0, two runs each.
# Compare the RATIOS, not the milliseconds: absolute figures move with the host, and
# these were taken on different hardware from the block above.
#
#                     musl (2 runs)              glibc control (2 runs)
#     p50     1.43x / 1.46x faster        1.46x / 1.42x faster
#     p95     1.13x / 1.24x faster        1.32x / 1.32x faster
#     p99     1.23x / 1.70x SLOWER        1.31x / 1.07x faster  (magnitude unstable)
#     max     consistently WORSE          flips run to run
#
# So the p50 win is the one result that has held on every host tried so far. The far tail
# is where musl and glibc appear to DIVERGE: on musl the p99 was worse with the daemon on
# BOTH runs — a stable sign, not the coin-flip glibc gives. Note the same caveat as above,
# though: these are pair-timed too, so the divergence is in total write work, and whether
# it survives on the blocking call alone is untested. Do not cite it as a latency result.
# The autostart spawn cost reproduced at ~+45 ms (p50).
#
# Still unmeasured, still needing machines nobody has to hand: musl on REAL HARDWARE (the
# above is a container, so it does not settle scheduling or storage behaviour on a real
# Alpine box), the systemd-unit path, and a network home — which is where the contention
# claim is strongest and least tested. `scripts/bench-atuin-daemon.sh --systemd` and its
# CORE_ATBENCH_BASE knob now exist for the latter two, but --systemd has itself never run
# against a real systemd user bus. This narrows the gap; it does not close it.
#
# HOW A MACHINE OPTS IN (the launcher is OS-native, so it lives in the OS repo, not here):
#   systemd distros — install the user unit (examples/atuin-daemon.service),
#                     `systemctl --user enable --now atuin-daemon`, then export
#                     ATUIN_DAEMON__ENABLED=true from os/<os>.zsh.
#   Alpine / macOS  — no systemd: export ATUIN_DAEMON__ENABLED=true together with
#                     ATUIN_DAEMON__AUTOSTART=true and let atuin supervise its own
#                     daemon (autostart is NOT compatible with systemd_socket).
#   Windows         — out of scope; dotfiles-Windows vendors no core/.
#
# Safety net: zsh/00-tools.zsh probes the socket before the first prompt AND, throttled to at
# most one connect a minute, for the life of the shell — because with the daemon enabled and
# the socket absent or stale atuin does not fail, it DISCARDS. The first failed connect forces
# the daemon OFF for that shell, permanently, so atuin writes SQLite directly; a daemon that
# dies mid-session also prints one warning, since that shell's history plumbing changed under
# a session still open (dotgibson/dotfiles-core#366). CORE_ATUIN_PROBE_INTERVAL tunes the
# window. It cannot detect an ACCEPT-BUT-SILENT
# socket, which is the shape of the indefinite freeze in atuinsh/atuin#3382 — so prefer the
# plain always-running unit over systemd SOCKET ACTIVATION: activation keeps the socket
# accepting while the daemon behind it is dead, which is precisely the undetectable state.
[daemon]
# enabled AND autostart ARE DELIBERATELY LEFT UNSET — writing them here, even as `false`,
# is what BREAKS the per-machine opt-in. atuin builds its config as
# defaults → Environment → config FILE (settings.rs: the file source is added *after* the
# Environment one, and in the `config` crate the later source wins), so any key present in
# this file SHADOWS its ATUIN_* override. With `enabled = false` written out, an OS layer
# exporting ATUIN_DAEMON__ENABLED=true was silently ignored: verified against atuin 18.19.0
# by stracing the client, which made ZERO connect() calls to the socket with the key
# present and one with it absent.
#
# Leaving them unset costs nothing: atuin's own defaults are already
# `daemon.enabled = false` / `daemon.autostart = false` (settings.rs:1515-1516), so Core
# still ships the daemon OFF — it is just off by DEFAULT rather than off by ASSERTION, and
# the env override can now actually reach it. scripts/test-core.sh pins this.
#
# The same trap applies to any future per-machine key: if a machine is meant to override it
# via ATUIN_*, it must not be written here. Fleet-wide settings (the UX block above) are the
# opposite case — those are asserted here on purpose.
# sync_frequency = 300  # seconds between daemon-driven syncs (upstream default)
# systemd_socket = false  # take the socket from systemd socket activation instead of socket_path
# socket_path = "…/atuin.sock"  # LEFT UNSET on purpose: the default is $XDG_RUNTIME_DIR/atuin.sock
                                # (falling back to the data dir where that is unset, e.g. macOS), and
                                # an absolute path here would be an OS-specific value in a Core file.
