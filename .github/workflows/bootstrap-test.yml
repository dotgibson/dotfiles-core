# .github/workflows/bootstrap-test.yml
# ──────────────────────────────────────────────────────────────────────────────
# REUSABLE bootstrap integration test — authored once here, called by a thin stub
# in each OS repo (workflow_call) so the OS repos get CI WITHOUT each carrying a
# duplicated copy of this logic (the same fan-out the Core layer exists to kill).
#
# ROLE repos call it too. dotfiles-Offense and dotfiles-Defense wire Core plus a band-85
# role stage and NO band-80 OS layer, so the 80-os.zsh assertion below arms itself on
# whether the caller actually ships an os/*.zsh rather than assuming every caller does.
#
# Four jobs, the last two opt-in:
#   1. lint           — shellcheck -x + bash -n + --help, on the runner (deterministic,
#                       no container). Catches the syntax/guard class of bug directly.
#   2. links-only     — run `bootstrap.sh --links-only` inside the target distro container
#                       and assert the symlink graph + the generated ~/.zshrc. --links-only
#                       skips provision() (no package installs, no Gentoo source builds);
#                       the tpm dir is pre-seeded so its first-run clone is skipped (offline
#                       + deterministic). The actual zsh module LOAD is already covered
#                       hermetically by dotfiles-core test-core.sh, so this asserts the part
#                       bootstrap.sh OWNS: the wiring it produces — Core links, the OS
#                       overlay (tmux/os.conf, git/os.gitconfig, ssh/config.d/50-os.conf),
#                       the tools group, and the ssh directory modes.
#   3. provision-stub — OPT-IN (`provision_stub: true`). Runs provision() with the package
#                       managers stubbed. See the long note on that job for its real limits.
#   4. packages-check — OPT-IN (`packages_check: "<resolve command>"`). Resolves every name
#                       in the package list against the distro repos without downloading
#                       anything, using the same parser bootstrap.sh reads the list with.
#
# WHAT THIS DOES NOT COVER — read this before trusting a green run.
#
# `--links-only` returns before provision() is entered, so THE JOB BELOW NEVER REACHES IT.
# Package installation, retries, upstream installers, repo/key setup and every failure path
# around them are not exercised by that job. A green `bootstrap` check means the WIRING is
# sound. It says nothing about whether the box can be provisioned.
#
# WHAT DOES RUN provision(), so this section stops overclaiming (#606). This block used to
# say "NO GATE IN THE FLEET RUNS provision() AT ALL". That was true when it was written and
# is now false in two directions, and because this header is the most-read description of
# fleet coverage — and is vendored into every repo — the stale absolute went on generating
# issues filed in good faith against it (dotgibson/dotfiles-MacBook#178):
#
#   1. THIS FILE gained one. The opt-in `provision-stub` job below (v4.14.2, #575) executes
#      provision() with the package managers shimmed, for container-based callers.
#   2. A REPO GATES IT OUTSIDE THIS WORKFLOW. dotfiles-MacBook runs provision() on its
#      `macos smoke` leg via `make test-repo`, through a BOOTSTRAP_BREW seam, marked with
#      REPO_TESTS_GATE_PROVISION=1 — which its test-repo.sh section G2 reads and FAILS on if
#      the provision sections all self-skipped, so that gate cannot quietly stop gating. It
#      is not a caller of this workflow and cannot become one — see the constraint below.
#
# NO MACOS PATH HERE, DELIBERATELY — so the absence reads as a decision, not a gap. This
# workflow is Linux-container-only: three `runs-on: ubuntu-latest` jobs, two shelling out to
# `docker run "$IMAGE"`, `image` a required input, no runner input and no `container:` key.
# dotfiles-MacBook's provision() hard-exits without the Command Line Tools, so a Linux
# container could only ever reach that one branch. A `runs-on` input plus a non-container
# code path, in a workflow serving nine repos, is a lot of shared complexity for a single
# caller whose seam (BOOTSTRAP_BREW) is Homebrew-specific anyway. A repo whose provision()
# cannot run in a Linux container gates it in its own CI instead.
#
# THE TWO ARE COMPLEMENTARY, NOT REDUNDANT, and this is the non-obvious part: the shims
# below ALWAYS SUCCEED, so failure branches stay unexercised. MacBook's stub ALWAYS FAILS,
# so it covers exactly the failure branches this job cannot.
#
# That is a deliberate trade (provisioning is slow, network-bound, and mostly asserts other
# people's package archives), but the cost has been paid for real and is worth naming. A
# `trap … RETURN` leaked from verified_install into provision()'s frame and aborted every
# fresh-box run AFTER installing everything but BEFORE wire_links — a box carrying the whole
# stack and not one symlink. It stayed green through review in two repos, because the broken
# line is valid bash and because this job never reached the function it was in
# (dotgibson/dotfiles-Debian#2; the analysis is in the closed #461 and #512).
#
# One shape of that bug is now blocked statically — see _core_return_trap_hits, wired into
# lint-call.yml and audit-core.sh §5e. That is a guard for ONE shape, not coverage of the
# path. Anything else living only in provision() is still invisible to CI: if you are
# changing that half of a bootstrap, the gate below will not tell you whether it works.
#
# TWO OPT-IN JOBS NARROW THAT GAP, and neither closes it. `provision_stub` executes
# provision() with the package managers replaced by no-ops, so it covers the CONTROL FLOW
# (a leaked trap, a bare refresh under set -e) and is blind to any real I/O — a wrong
# package name is invisible to it, because nothing is ever installed. `packages_check`
# covers exactly that blind spot from the other side: it resolves every name in the list
# against the real distro repos without downloading anything, which is worth having on its
# own schedule because a rename upstream breaks a file nobody edited. Between them the
# package list and provision()s control flow are gated; the REAL installation still is not
# — no package is ever fetched by any gate here — and still needs a periodic real bootstrap
# on a real box (#589).
#
# A caller stub (in an OS repo) looks like — pinned to the moving MAJOR tag @vN per the
# `@vN` policy in RELEASE-STRATEGY.md, NOT @main: a caller's contract then changes only via
# a Core release, and a MAJOR bump is the one intentional, reviewed caller edit — so a repo
# pinned @vN keeps that major's assertions until it deliberately moves to @vN+1 as part of the
# fan-out (re-vendoring the new major's Core + updating its bootstrap together). The fleet is
# on @v5 today:
#   jobs:
#     test:
#       uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v5
#       with:
#         image: alpine:3.20
#         prep:  apk add --no-cache bash zsh
#         offensive: false        # true only for dotfiles-Offense
#         # optional, and worth a `schedule:` trigger in the caller as well as pull_request.
#         # The probe is NOT free to choose — see "CHOOSING packages_check's PROBE" below;
#         # `apk info` is Alpine's verified answer, not a template for other distros.
#         packages_check: apk info
#         # Both of these are for the WEEKLY real-bootstrap.yml sweep, not for the jobs in
#         # this file — read statically out of this block. bootstrap_timeout is the ceiling a
#         # genuinely unstubbed run needs on this image; bootstrap_postcheck asserts, on the
#         # far side of that run, that the packages actually arrived. Absent means nothing
#         # runs, so a leg without one passes on exit code and wiring alone (#750).
#         bootstrap_timeout: 45
#         bootstrap_postcheck: ./scripts/assert-provisioned.sh
#
# A role repo passes the same inputs; nothing extra. Band 80 is skipped automatically
# because it has no os/*.zsh — see the note above.
#
# CHOOSING packages_check's PROBE — read this before wiring a new repo. The obvious
# command is wrong on most distros, and BOTH ways it is wrong produce a gate that looks
# healthy. Two rules, each learned by getting it wrong first:
#
#   1. THE PROBE MUST RESOLVE CAPABILITIES, not just package names. bootstrap.sh installs
#      these names with the package manager's INSTALL verb, which honours Provides/provides,
#      so the probe has to ask the same question. A name-exact query reds a package that
#      installs perfectly well — a false accusation against whatever PR happens to be open.
#      Real examples, all confirmed in CI:
#        · Fedora retired `wget` for `wget2`; `wget2-wget` carries `Provides: wget`. So
#          `dnf install wget` works and `dnf info wget` FAILS.
#        · On Arch `sh` is not a package, it is a `provides` of bash. `pacman -S sh` works
#          and `pacman -Si sh` FAILS.
#        · On openSUSE `python3-pip` is satisfied by a versioned python3XX-pip, so
#          `zypper install` works and `search --match-exact` FAILS.
#      A list can pass today and still be wrong: none of Arch's ~45 names sat behind a
#      `provides` when this was wired, so the name-exact probe was green — it would have
#      gone red later, on a PR that changed nothing to do with it.
#
#   2. THE PROBE MUST BE VERIFIED TO *REJECT*, not merely to accept. A green run proves
#      nothing on its own: several of these commands exit 0 for a name that exists NOWHERE,
#      which is a gate that can never fail and is indistinguishable from real coverage.
#        · `apk policy <bogus>`  exits 0.  · `zypper info <bogus>`  exits 0.
#      Verify by pointing packages_file at a scratch list holding one real name, one
#      name that exists only as a `provides`, and one deliberately bogus name. The run
#      MUST go red naming only the bogus one — that establishes all three properties at
#      once. Delete the scratch list before merging.
#
# Probes verified against both rules (bogus name rejected AND a provides-only name resolved):
#
#   distro     packages_check                                provides-only name proved
#   ────────── ───────────────────────────────────────────── ─────────────────────────
#   Alpine     apk info                                      openssh-client -> -default
#   Arch       pacman -Sp --noconfirm                        sh -> bash
#   Fedora     dnf -q info          NO — use: dnf -q provides   wget -> wget2-wget
#   openSUSE   zypper --non-interactive install --dry-run    python3-pip -> python3XX-pip
#
# Also check the caller's own `on:` block: a path-filtered bootstrap workflow that omits
# `install/**` gives you a package-list gate that cannot fire when the package list changes
# (dotfiles-Arch had exactly this). And prep must leave the package index READABLE — on
# Alpine `apk add --no-cache` deliberately leaves none, so prep needs `&& apk update`;
# put that network fetch in prep, which this workflow RETRIES 5x, not in the per-name loop.
# ──────────────────────────────────────────────────────────────────────────────
name: bootstrap-test

on:
  workflow_call:
    inputs:
      image:
        description: Container image for the target distro (matching /etc/os-release).
        type: string
        required: true
      prep:
        description: >-
          Shell run INSIDE the container to bring the image up to what THIS repo's bootstrap.sh
          demands before it will start. Not merely "at least bash" — that wording is what let
          dotfiles-Debian ship two callers installing only `bash zsh` for the entire life of the
          repo while its own preflight had required `curl` since the first commit
          (dotgibson/dotfiles-Debian#28).

          SATISFY YOUR OWN PREFLIGHT. A repo whose bootstrap.sh has a preflight_cmds-style hard
          requirement list (dotfiles-Debian: apt-get dpkg curl sed awk tar; dotfiles-Fedora:
          dnf rpm curl sed awk) must install every entry here that the base image does not
          already carry. The check exits 1 long before provision(), so a shortfall is not a
          degraded run — it is no run at all.

          NEITHER JOB BELOW CAN CATCH A SHORTFALL, which is why this text has to. The
          links-only job passes --links-only, and a links-only run is exempt from the
          requirement list by design (wiring is pure shell plus coreutils). The provision-stub
          job PREPENDS A CURL SHIM to PATH, so a missing curl resolves to the stub and the
          preflight is satisfied by the very thing that makes the leg fake. Only the weekly
          unstubbed real-bootstrap.yml sweep reaches the branch, and it reads this `prep:`
          statically out of your caller (scripts/fleet-bootstrap-matrix.py) — so the fix for a
          red leg there belongs HERE, in the caller, not in the sweep.
        type: string
        required: true
      offensive:
        description: Assert the offensive role layer (offensive symlinks + loader stage).
        type: boolean
        default: false
      provision_stub:
        description: >-
          Also run a FULL bootstrap with package managers and downloaders replaced by logging
          no-ops, to execute provision() without installing anything (#575). OPT-IN: a repo
          enables it once its provision() tolerates a stub that returns 0 and writes no file.
        type: boolean
        default: false
      packages_check:
        description: >-
          The distro RESOLVE-ONLY command to run against every name in the package list, e.g.
          "pacman -Si", "dnf list", "apk info", "zypper --non-interactive info". Empty (the
          default) disables the job. A STRING rather than a boolean on purpose: Core does not
          want to own a distro-to-command table that would need editing here every time a
          repo joins the fleet or a package manager changes its flags.
        type: string
        default: ""
      packages_file:
        description: >-
          Path to the package list packages_check reads. Default install/packages.txt.
          A repo whose list carries per-distro annotations (dotfiles-Debian filters through
          its own scripts/pkg-filter.sh) should point this at a pre-filtered file instead.
        type: string
        default: install/packages.txt
      bootstrap_timeout:
        description: >-
          Minutes a GENUINELY UNSTUBBED bootstrap needs on this image. Declared here, next
          to image and prep, because this block is the one place a repo describes its
          bootstrap CI — but it is NOT consumed by the jobs below. It is read STATICALLY
          from this caller by scripts/fleet-bootstrap-matrix.py, which feeds the weekly
          real-bootstrap.yml sweep; that is the only job that installs anything, so it is
          the only one whose runtime this describes.

          THE JOBS IN THIS FILE DELIBERATELY KEEP THEIR OWN TIGHT TIMEOUTS. They are
          stubbed and finish in seconds to minutes, so widening them would surrender
          check-modern rule 8's hang protection for no benefit. Do not "fix" the apparent
          unused input by wiring it into them.

          Default 45 matches what real-bootstrap.yml used for every leg before this
          existed, so a repo that declares nothing is unaffected. Raise it only for a
          bootstrap that genuinely cannot finish in 45m — dotfiles-Gentoo emerges from
          source and needs hours (dotgibson/dotfiles-core#742). GitHub's per-job ceiling
          is 360.
        type: number
        default: 45
      bootstrap_postcheck:
        description: >-
          A command run INSIDE the container on the far side of a GENUINELY UNSTUBBED
          ./bootstrap.sh, to assert the box actually got its packages. Empty (the default)
          runs nothing, which is exactly the behaviour before this existed — so a repo that
          declares none is unaffected. Like bootstrap_timeout above it is NOT consumed by the
          jobs in this file: it is read STATICALLY from this caller by
          scripts/fleet-bootstrap-matrix.py, which feeds the weekly real-bootstrap.yml sweep.
          That sweep is the only job in the fleet that installs anything, so it is the only
          one that could ever assert this. Do not "fix" the apparent unused input by wiring
          it into the jobs below; they are stubbed and install nothing.

          WHAT GAP THIS FILLS. The sweep asserts two things after bootstrap.sh: that it
          returned 0, and that the wiring survived. Both are necessary, neither can see
          whether the packages arrived. A Gentoo leg that emerged 131 packages over 75
          minutes went GREEN while the bootstrap printed a two-line ledger naming atoms that
          did not install (dotgibson/dotfiles-core#750). This input is the missing check.

          WHY NOT --strict. The obvious lever is to make each bootstrap exit non-zero on its
          own end-of-run ledger. It is the wrong instrument, and the fleet has declined it
          twice: that ledger deliberately mixes a GENUINE PROVISIONING GAP (an atom that will
          never install) with an INFRASTRUCTURE BLIP (a rate-limited mise.run, a GURU sync
          hiccup, a failed tpm clone). --strict cannot tell them apart, so it would red an
          advisory lane over somebody else's outage — which is how these lanes get switched
          off. Your script CAN tell them apart, because it knows which tools your own list
          promises. So the exit code stays an honest signal and the assertion lives here.

          THE STRING IS A COMMAND, not a path — run with `sh -c` from the repo root inside
          the container, so `./scripts/assert-provisioned.sh` and `sh scripts/x.sh` both work
          (the first needs the exec bit, the second does not). Non-zero fails the leg, which
          files an issue and blocks nothing. A STRING rather than a boolean for the same
          reason packages_check is one: Core does not own a per-distro tool table.

          WRITING ONE. dotfiles-Gentoo/scripts/assert-provisioned.sh is the reference shape:
          HARD-FAIL on every atom in install/packages.txt, with the binary name DERIVED from
          a `# bin:NAME` contract in that file rather than kept as a second list that drifts
          (the app-misc/gum lesson); WARN on the overlay/cargo/go/opt-in tools, which no run
          promises. Deriving the names is the point — a hand-kept second list is the frozen
          copy this whole workflow family exists to avoid.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHELLCHECK_OPTS must match lint-call.yml's, and scripts/test-core.sh asserts that it
      # does. Both gates lint the SAME bootstrap.sh, and until now only lint-call.yml set the
      # fleet's curated exclusions — so the four codes Core has explicitly decided are not
      # defects were still blocking, just in the other gate (#517). SC2088 is the one that
      # actually fires: "tildes in messages" is exactly what a bootstrap does, since every
      # user-facing string names ~/.zshrc, ~/.config/…, ~/.local/bin.
      #
      # The failure mode is nasty because the two gates run on different triggers — `lint` on
      # every push and PR, `bootstrap` only when bootstrap.sh/core/ change. A repo stays green
      # for weeks, then a bootstrap-touching PR reds with an error naming a rule the fleet
      # documented as excluded. The natural reading is "the exclusion list is wrong" and the
      # natural fix is to weaken the message — which is what happened in dotfiles-Gentoo
      # before anyone noticed the two gates simply disagreed.
      #
      # Three repos (Arch, Debian, Fedora) had independently worked around this with a
      # copy-pasted `disable=` line in their own .shellcheckrc — the N-way drift the reusable
      # workflows exist to end. Setting it here fixes all nine at once, including the six that
      # have no .shellcheckrc, or one without that line.
      - name: shellcheck + syntax + --help
        env:
          SHELLCHECK_OPTS: "-e SC1090 -e SC1091 -e SC2015 -e SC2088"
        run: |
          shellcheck -x bootstrap.sh
          bash -n bootstrap.sh
          bash bootstrap.sh --help >/dev/null

  links-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap --links-only (${{ inputs.image }})
        env:
          IMAGE: ${{ inputs.image }}
          PREP: ${{ inputs.prep }}
          OFFENSIVE: ${{ inputs.offensive }}
        run: |
          # BLIB_SU= : the container runs as root, so no privilege escalation is
          # needed. Without this, blib_set_login_shell defaults BLIB_SU=sudo and a
          # distro whose image HAS chsh but NOT sudo (Arch/openSUSE/Kali base images)
          # would run `sudo chsh` and abort. Empty = run chsh/tee directly as root.
          # (Alpine/Gentoo bootstraps already export their own BLIB_SU; this is a no-op
          # there and the correct default for the rest.)
          docker run --rm -e PREP -e OFFENSIVE -e BLIB_SU= -v "$PWD:/repo" -w /repo "$IMAGE" sh -euc '
            # Install bootstrap deps, WITH RETRY: some distro mirrors (notably openSUSE
            # Tumbleweed OSS) intermittently time out in CI (curl error 28), and a single
            # prep failure should not red every fan-out PR fleet-wide. The until-condition
            # is exempt from set -e so a failed attempt loops instead of aborting; an `if`
            # (not `&&`) guards the cap for the same reason. After 5 tries we exit 1 so a
            # genuinely broken prep still fails LOUD (no false green).
            n=0
            until eval "$PREP"; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then echo "prep failed after $n attempts" >&2; exit 1; fi
              echo "prep attempt $n failed (mirror timeout?), retrying in $((n*10))s..." >&2
              sleep $((n*10))
            done
            # Pre-seed the tpm dir so blib_link_core skips its network git clone — the
            # same "seed the plugin dir to skip the first-run clone" trick test-core.sh
            # uses to stay offline + deterministic.
            mkdir -p "$HOME/.config/tmux/plugins/tpm"

            ./bootstrap.sh --links-only

            echo "── asserting symlink graph + generated ~/.zshrc ──"
            for link in \
              "$HOME/.config/zsh/loader.zsh" \
              "$HOME/.config/starship.toml" \
              "$HOME/.config/lazygit/config.yml" \
              "$HOME/.config/nvim" \
              "$HOME/.vimrc" \
              "$HOME/.gitconfig"; do
              if [ ! -L "$link" ]; then echo "MISSING symlink: $link" >&2; exit 1; fi
            done
            # Band 80 is the OS-NATIVE layer, and only an OS repo has one. A ROLE repo
            # (dotfiles-Offense, dotfiles-Defense) ships no os/*.zsh, stacks on whatever
            # OS layer the box already runs, and correctly links nothing at 80 — so an
            # unconditional check here reds a repo doing exactly the right thing.
            # Self-arming on the caller tree, the same way the atuin check below is, rather
            # than a new input every role repo would have to remember to pass: the presence
            # of os/*.zsh IS the question being asked, so derive it instead of declaring it.
            if ls os/*.zsh >/dev/null 2>&1 && [ ! -L "$HOME/.config/zsh/80-os.zsh" ]; then
              echo "MISSING symlink: $HOME/.config/zsh/80-os.zsh" >&2; exit 1
            fi
            # The vendored loader must resolve to the repo copy (not a dangling link).
            if [ ! -e "$HOME/.config/zsh/loader.zsh" ]; then echo "loader.zsh symlink is dangling" >&2; exit 1; fi
            # sesh is SEEDED (copied, not symlinked) — assert the real file landed. Re-added now
            # that the lazygit/vim/sesh wiring is vendored fleet-wide (every adopter core.lock is
            # at a Core that includes it), so this @main test can assert it without false reds.
            # atuin config — asserted CONDITIONALLY, on whether this repo has vendored the
            # Core that carries it. An OS repo still on an older core/ has no such file, and
            # its bootstrap correctly skips the link, so an unconditional check would red a
            # repo doing nothing wrong (the false-red the sesh note below records). The
            # check arms itself the moment that repo syncs Core.
            if [ -f core/atuin/config.toml ] && [ ! -L "$HOME/.config/atuin/config.toml" ]; then
              echo "MISSING symlink: $HOME/.config/atuin/config.toml" >&2; exit 1
            fi
            if [ ! -f "$HOME/.config/sesh/sesh.toml" ]; then echo "sesh.toml not seeded" >&2; exit 1; fi
            if [ -L "$HOME/.config/sesh/sesh.toml" ]; then echo "sesh.toml should be a copy, not a symlink" >&2; exit 1; fi
            # NOTE: keep this block apostrophe-free — it lives inside the single-quoted sh -euc script.

            grep -q "dotfiles-managed v4" "$HOME/.zshrc" || { echo "~/.zshrc not managed" >&2; exit 1; }
            # v4: the .zshrc no longer lists modules — it just sources the vendored loader,
            # which globs the numbered fragments itself.
            grep -q "source .*loader.zsh" "$HOME/.zshrc" || { echo "~/.zshrc does not source the vendored loader" >&2; exit 1; }
            # It must NOT assign CORE_PROFILE (only mention it in a comment): the loader owns
            # resolution (env, else $ZSH_CFG/profile, else full), and a pre-set would disable
            # the profile file. Strip comment lines first, then reject any CORE_PROFILE= / :=.
            if grep -vE "^[[:space:]]*#" "$HOME/.zshrc" | grep -qE "CORE_PROFILE[[:space:]]*:?="; then
              echo "~/.zshrc must NOT assign CORE_PROFILE (v4 leaves resolution to the loader)" >&2; exit 1
            fi

            # ── the OS OVERLAY: the entire output of blib_link_os_layer ─────────────
            # None of this was asserted (#473), which is the gap that mattered most: the
            # overlay is exactly what an OS repo OWNS. A regression in os/<os>.conf or
            # os/<os>.gitconfig wiring was invisible to the one test whose stated purpose
            # is "the part bootstrap.sh OWNS: the wiring it produces."
            #
            # Every check below SELF-ARMS on the caller tree rather than taking a new
            # workflow input, following the os/*.zsh and atuin precedent above. Two
            # reasons: a role repo (Offense/Defense) ships no os/ overlay and correctly
            # links nothing, so an unconditional check would red a repo doing exactly the
            # right thing; and a repo still on an older vendored core/ has no
            # core/jujutsu or core/ssh to link. Presence of the source file IS the
            # question being asked, so derive it instead of declaring it — the check arms
            # itself the moment that repo syncs Core.
            if ls os/*.conf >/dev/null 2>&1 && [ ! -L "$HOME/.config/tmux/os.conf" ]; then
              echo "MISSING symlink: $HOME/.config/tmux/os.conf" >&2; exit 1
            fi
            if ls os/*.gitconfig >/dev/null 2>&1 && [ ! -L "$HOME/.config/git/os.gitconfig" ]; then
              echo "MISSING symlink: $HOME/.config/git/os.gitconfig" >&2; exit 1
            fi
            if [ -f ssh/os.conf ] && [ ! -L "$HOME/.ssh/config.d/50-os.conf" ]; then
              echo "MISSING symlink: $HOME/.ssh/config.d/50-os.conf" >&2; exit 1
            fi

            # ── the rest of the `tools` group ───────────────────────────────────────
            if [ -f core/jujutsu/config.toml ] && [ ! -L "$HOME/.config/jj/config.toml" ]; then
              echo "MISSING symlink: $HOME/.config/jj/config.toml" >&2; exit 1
            fi
            # mise is ADOPTED, not linked (v5.0.0): `mise use -g` rewrites this file, and a
            # symlink pointed that write into the vendored core/ tree. So the assertion is
            # inverted here — a SYMLINK is now the failure, and a real file is the contract.
            #
            # This assertion is why v5.0.0 turned the links-only job red across the fleet: the
            # changed in bootstrap-lib.sh and this file kept asserting the old one. It shipped
            # green because NOTHING IN CORE RUNS THIS WORKFLOW — it only ever executes in an OS
            # repo, so the audit in Core cannot see it. Same shape as the other false greens
            # this release fixed: a gate that never runs cannot report its own breakage.
            if [ -f core/mise/config.toml ]; then
              if [ -L "$HOME/.config/mise/config.toml" ]; then
                echo "STILL A SYMLINK: $HOME/.config/mise/config.toml — bootstrap must ADOPT it (blib_adopt), not link it" >&2; exit 1
              fi
              if [ ! -f "$HOME/.config/mise/config.toml" ]; then
                echo "MISSING file: $HOME/.config/mise/config.toml (expected an adopted real file)" >&2; exit 1
              fi
              # A fresh adopt must match Core byte-for-byte; drift only appears once a host
              # edits it. git hash-object, NOT cmp: Core keeps diffutils optional and the audit
              # gates on it (the #572 box had git but neither cmp nor diff).
              if [ "$(git hash-object -- core/mise/config.toml)" \
                 != "$(git hash-object -- "$HOME/.config/mise/config.toml")" ]; then
                echo "ADOPTED COPY DIFFERS from core/mise/config.toml on a fresh bootstrap" >&2; exit 1
              fi
            fi
            for b in clip clip-paste; do
              if [ -f "core/bin/$b" ] && [ ! -L "$HOME/.local/bin/$b" ]; then
                echo "MISSING symlink: $HOME/.local/bin/$b" >&2; exit 1
              fi
            done

            # ── ssh, including the permission side effects nothing checked ──────────
            # ssh silently ignores a config in a world- or group-writable directory, so
            # these modes are not cosmetic: a bootstrap that linked the file but left
            # ~/.ssh at 0755 produces a box where the config is present and INERT, which
            # is far harder to diagnose than a missing link.
            #
            # DELIBERATELY NOT ASSERTED: 0600 on ~/.ssh/config itself. Core does not chmod
            # that file and must not — it is a symlink into the VENDORED core/ tree of the
            # consumer, so a chmod would reach into a read-only tree in nine repos.
            # The reasoning is recorded at lib/bootstrap-lib.sh (see "NO chmod on the
            # config file itself"), and it ends with a plain instruction not to restore it.
            # Recorded here too so the next audit does not re-file the same request.
            if [ -f core/ssh/config ]; then
              if [ ! -L "$HOME/.ssh/config" ]; then
                echo "MISSING symlink: $HOME/.ssh/config" >&2; exit 1
              fi
              for d in "$HOME/.ssh" "$HOME/.ssh/sockets" "$HOME/.ssh/config.d"; do
                if [ ! -d "$d" ]; then echo "MISSING dir: $d" >&2; exit 1; fi
              done
              # The mode check DEGRADES rather than failing when stat is absent. GNU and
              # busybox both accept `stat -c %a`, but a minimal image may ship neither, and
              # a gate that reds because its measuring tool is missing teaches people the
              # gate is noise. Skip loudly instead: the directory assertions above already
              # ran, and CI images that do have stat still enforce the mode.
              if command -v stat >/dev/null 2>&1 && stat -c %a "$HOME/.ssh" >/dev/null 2>&1; then
                for d in "$HOME/.ssh" "$HOME/.ssh/sockets" "$HOME/.ssh/config.d"; do
                  mode=$(stat -c %a "$d")
                  if [ "$mode" != "700" ]; then
                    echo "WRONG MODE on $d: $mode (want 700 — ssh ignores a config under a loose dir)" >&2
                    exit 1
                  fi
                done
                echo "ssh dirs are 0700"
              else
                echo "NOTE: stat -c unavailable on this image — ssh dir modes not checked"
              fi
            fi

            if [ "$OFFENSIVE" = "true" ]; then
              # v4: the offensive role stage is the numbered fragment 85-offensive.zsh (band
              # 85-94); the loader picks it up by NN glob (no module-list entry to grep).
              for link in "$HOME/.config/zsh/85-offensive.zsh" "$HOME/hacktheplanet"; do
                if [ ! -L "$link" ]; then echo "MISSING offensive symlink: $link" >&2; exit 1; fi
              done
            fi

            echo "bootstrap --links-only OK"
          '

  # ── provision(), executed at last ─────────────────────────────────────────────
  # OPT-IN (`provision_stub: true`). The links-only job above returns before provision() is
  # entered, so package installation, retries, upstream installers, repo/key setup and every
  # failure path around them are executed by NO gate in the fleet — the gap in #575, and the
  # reason a leaked RETURN trap shipped green through review in two repos
  # (dotgibson/dotfiles-Debian#2).
  #
  # This runs the REAL bootstrap, no --links-only, with the package managers and downloaders
  # replaced by logging no-ops built inline in the job below. Most of that bug class is
  # control flow rather than I/O — a leaked trap, a bare refresh aborting under `set -e`, an
  # unchecked GPG import, a tool assumed present on a minimal image — and all of it executes
  # here without installing a package or touching the network.
  #
  # WHAT A GREEN RUN MEANS: provision() ran and returned, and wire_links still happened after
  # it. It does NOT mean provisioning works — no package is really installed, so a wrong
  # package name or a bad repo key is invisible. That still needs a periodic real bootstrap.
  # The stub also always succeeds, so failure branches stay unexercised. Read the honest
  # limits in the shim script before trusting this further than it goes.
  #
  # It is opt-in because a repo has to be shim-clean first: a step that downloads and then
  # unpacks will not find its asset (the stub writes no file) and must tolerate that. Enable
  # per repo, once.
  provision-stub:
    if: inputs.provision_stub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap with provisioning stubbed (${{ inputs.image }})
        env:
          IMAGE: ${{ inputs.image }}
          PREP: ${{ inputs.prep }}
        run: |
          docker run --rm -e PREP -e BLIB_SU= -v "$PWD:/repo" -w /repo "$IMAGE" sh -euc '
            n=0
            until eval "$PREP"; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then echo "prep failed after $n attempts" >&2; exit 1; fi
              echo "prep attempt $n failed (mirror timeout?), retrying in $((n*10))s..." >&2
              sleep $((n*10))
            done
            # Same tpm pre-seed as links-only: skip the first-run clone, stay offline.
            mkdir -p "$HOME/.config/tmux/plugins/tpm"

            # THE SHIM IS BUILT HERE, INLINE, AND THAT IS THE POINT. It was previously a
            # vendored script (core/scripts/) and then a second checkout of Core pinned at
            # github.job_workflow_sha. Both put the shim on a DIFFERENT distribution channel
            # from the workflow that uses it, and both went wrong: the vendored copy lagged a
            # release behind and hard-failed every repo, and the pinned checkout silently ran
            # an older revision of the script than the workflow reported using — five debug
            # rounds on dotgibson/dotfiles-Debian#11 between them. Inline, there is exactly one
            # artifact distributed at exactly one ref, and the class of bug is gone.
            SHIM=/tmp/provision-shim
            LOG=/tmp/provision-shim.log
            mkdir -p "$SHIM"; : >"$LOG"

            # curl/wget/gpg HONOUR -o and create the target. A stub that returns 0 while
            # writing nothing manufactures a state the real tool cannot produce, and fails a
            # correctly-guarded caller — dotfiles-Debian _add_vendor_repo guards its chmod
            # behind the curl|gpg pipeline exactly as it should, and still died on that lie.
            # The bytes are deliberately NOT a valid asset, so a checksum-verifying caller
            # still refuses them; faking a passing checksum would hide the refusal path.
            for c in curl wget gpg gpg2; do
              { echo "#!/bin/sh"
                echo "echo \"$c \$*\" >>$LOG"
                echo "out="
                echo "while [ \$# -gt 0 ]; do case \$1 in"
                echo "  -o|--output) out=\$2; shift 2 ;;"
                echo "  --output=*) out=\${1#--output=} ; shift ;;"
                echo "  *) shift ;;"
                echo "esac; done"
                echo "[ -n \"\$out\" ] && { mkdir -p \"\$(dirname \"\$out\")\" 2>/dev/null; printf shim > \"\$out\" 2>/dev/null; }"
                echo "exit 0"
              } >"$SHIM/$c"
              chmod +x "$SHIM/$c"
            done

            # Package managers and the rest: logged no-ops. git is deliberately absent —
            # bootstraps clone real things the caller pre-seeds, and stubbing it would mask
            # wiring bugs this job should still catch.
            for c in apt-get apt apt-key add-apt-repository dpkg debconf-set-selections \
                     dnf yum rpm pacman paru yay zypper apk emerge eselect layman brew \
                     snap flatpak gpgconf systemctl update-alternatives unattended-upgrade \
                     pipx go cargo npm; do
              { echo "#!/bin/sh"
                echo "echo \"$c \$*\" >>$LOG"
                echo "exit 0"
              } >"$SHIM/$c"
              chmod +x "$SHIM/$c"
            done

            # sudo/doas drop the escalation and re-exec, so the wrapped command still reaches
            # its stub and still gets logged. Swallowing them would skip the command under test.
            for c in sudo doas; do
              { echo "#!/bin/sh"
                echo "while [ \$# -gt 0 ]; do case \$1 in -n|-E|-H|-k) shift ;; -u) shift 2 ;; --) shift; break ;; *) break ;; esac; done"
                echo "[ \$# -eq 0 ] && exit 0"
                echo "exec \"\$@\""
              } >"$SHIM/$c"
              chmod +x "$SHIM/$c"
            done

            PROVISION_SHIM_LOG="$LOG"
            export PROVISION_SHIM_LOG
            PATH="$SHIM:$PATH"
            export PATH

            echo "── shim active at: $(command -v curl) ──"
            echo "── the curl stub the run will actually use ──"
            cat "$(command -v curl)"

            # A FUNCTION, not an inline trap body. This whole script is already inside a
            # single-quoted `sh -euc ...`, so a trap body containing its own single quotes
            # closes the outer quote and dash rejects it with "trap: echo: bad trap" — which
            # under `set -e` killed the run before bootstrap.sh even started. A function name
            # needs no quoting at all.
            #
            # Print the intercept log WHATEVER happens: a failed run is exactly when you need
            # to know which commands the shim actually saw, and without it a red job cannot be
            # told apart from a shim that never engaged.
            _shim_dump() {
              echo "── what provision() would have done (intercepted) ──"
              cat "$PROVISION_SHIM_LOG" 2>/dev/null || echo "(nothing intercepted — did the shim engage?)"
            }
            trap _shim_dump EXIT

            echo "── running the FULL bootstrap with provisioning stubbed ──"
            ./bootstrap.sh

            # provision() returning is necessary but not sufficient: the bug this job exists
            # for aborted AFTER provision did its work and BEFORE wire_links, so assert the
            # wiring still happened on the far side of it.
            for link in "$HOME/.config/zsh/loader.zsh" "$HOME/.gitconfig"; do
              if [ ! -L "$link" ]; then
                echo "MISSING symlink after a full run: $link — provision() may have aborted before wire_links" >&2
                exit 1
              fi
            done

            echo "bootstrap with stubbed provisioning OK"
          '

  # ── package-name resolution ──────────────────────────────────────────────────
  # OPT-IN (`packages_check: "<resolve command>"`). The links-only job runs
  # `--links-only`, which returns before provision() by design — so install/packages.txt,
  # the most VOLATILE file in every OS repo, was validated by no blocking gate anywhere in
  # the fleet (#474). Several of these distros are rolling releases, where a package is
  # renamed or dropped without anybody touching the repo: `doggo` moved AUR to extra on
  # Arch and broke a file nobody had edited.
  #
  # The provision-stub job above does NOT cover this and cannot: it replaces the package
  # managers with no-ops, so a wrong package name is exactly the class of bug it is blind
  # to (its own comment says so). /os-package-availability was the intended cover but is
  # inert without CLAUDE_CODE_OAUTH_TOKEN and runs weekly at best.
  #
  # THE SCHEDULED RUN MATTERS AS MUCH AS THE PR RUN, and that is the caller's job: a
  # rename upstream breaks a file nobody edited, so there is no PR to attach the failure
  # to. A caller should invoke this on a cron as well as on pull_request.
  #
  # RESOLUTION ONLY — `pacman -Si` / `dnf list` / `apk info` read the sync DB and download
  # nothing, so this is a fast job rather than a full provision.
  #
  # It reads the list with core/lib/bootstrap-lib.sh's blib_read_pkgs_into — the SAME
  # parser bootstrap.sh uses. A gate that parses the list differently from the thing it
  # gates is worse than no gate, and the _into form means an unreadable list fails loudly
  # instead of resolving zero packages green (#460) — which for THIS job would otherwise be
  # a permanent, silent false pass.
  #
  # dotfiles-Arch carries a repo-local packages.yml doing exactly this, with a
  # TODO(upstream) pointing here; it collapses to a caller once this lands.
  packages-check:
    if: inputs.packages_check != ''
    name: resolve package names (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve every package name (${{ inputs.image }})
        env:
          IMAGE: ${{ inputs.image }}
          PREP: ${{ inputs.prep }}
          RESOLVE: ${{ inputs.packages_check }}
          PKGFILE: ${{ inputs.packages_file }}
        # `docker run` rather than a job-level `container:`, matching the two jobs above.
        # Not style: scripts/check-modern.sh requires every `container:`/`image:` value to be
        # DIGEST-pinned, and this image arrives as a caller input (alpine:3.20, archlinux:latest)
        # that no caller can pin per-run. The other jobs already solved it this way.
        #
        # NOTE: keep the script below apostrophe-free — it lives inside the single-quoted
        # sh -euc argument, exactly like the links-only block.
        run: |
          docker run --rm -e PREP -e RESOLVE -e PKGFILE -v "$PWD:/repo" -w /repo "$IMAGE" sh -euc '
            # Same retrying prep as the jobs above: distro mirrors intermittently time out in
            # CI, and a prep blip should not red a PR that changed nothing. Five tries, then a
            # loud failure rather than a false green.
            n=0
            until eval "$PREP"; do
              n=$((n+1))
              if [ "$n" -ge 5 ]; then echo "prep failed after $n attempts" >&2; exit 1; fi
              echo "prep attempt $n failed (mirror timeout?), retrying in $((n*10))s..." >&2
              sleep $((n*10))
            done

            # The resolver is bash: it sources core/lib/bootstrap-lib.sh, which is bash
            # (arrays, [[ ]]). The outer shell here is sh because that is all a base image is
            # guaranteed to have before prep runs — prep is what installs bash.
            # The RESOLVER terminator below is deliberately FLUSH-LEFT once this block
            # scalar is dedented. A heredoc terminator must start at column 0; indented, it
            # never matches, the rest of the script is swallowed as heredoc data, and
            # `bash /tmp/resolve.sh` is never reached. `sh -n` only WARNS about that, so it
            # passes a syntax check and fails as a silent no-op gate. Do not re-indent it.
            cat >/tmp/resolve.sh <<"RESOLVER"
            set -uo pipefail
            [ -f core/lib/bootstrap-lib.sh ] || {
              echo "::error::core/lib/bootstrap-lib.sh missing — this job reads the list with the same parser bootstrap.sh uses"
              exit 1
            }
            # shellcheck disable=SC1091 # vendored in the caller at runtime; absent at lint time
            . core/lib/bootstrap-lib.sh
            command -v blib_read_pkgs_into >/dev/null || {
              echo "::error::this repo vendored core/ predates blib_read_pkgs_into — run make sync"
              exit 1
            }
            # The || is the whole point of the _into form: a missing or unreadable list is a
            # broken checkout, not an empty package set, and must not pass as "0 to resolve".
            blib_read_pkgs_into pkgs "$PKGFILE" || exit 1
            if [ "${#pkgs[@]}" -eq 0 ]; then
              echo "::error::$PKGFILE parsed to zero packages — that is a malformed list, not an empty one"
              exit 1
            fi
            echo ":: resolving ${#pkgs[@]} package names with: $RESOLVE (no download, no install)"
            # Collect EVERY unresolved name before failing, rather than exiting on the first.
            # A rolling-release rename usually arrives in batches, and a gate that reports one
            # name per CI round costs a round trip per package.
            unresolved=""
            for p in "${pkgs[@]}"; do
              if ! $RESOLVE "$p" >/dev/null 2>&1; then
                echo "  UNRESOLVED: $p"
                unresolved="$unresolved $p"
              fi
            done
            if [ -n "$unresolved" ]; then
              echo "::error::unresolved package name(s):$unresolved"
              echo "Renamed or dropped upstream — check the distro package search. Several of"
              echo "these distros are ROLLING, so this can go red with nobody having edited the repo."
              exit 1
            fi
            echo "all ${#pkgs[@]} package names resolve"
          RESOLVER
            bash /tmp/resolve.sh
          '
