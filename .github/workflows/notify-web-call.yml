# .github/workflows/notify-web-call.yml
# ──────────────────────────────────────────────────────────────────────────────
# REUSABLE showcase-refresh dispatch (G3). Every source repo carried a byte-identical
# 43-line notify-web.yml that pings dotfiles-web to rebuild. This is the single
# definition; each repo collapses to a caller that owns only its `on:` trigger:
#
#   jobs:
#     dispatch:
#       uses: dotgibson/dotfiles-core/.github/workflows/notify-web-call.yml@v6
#       secrets:
#         FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}   # App auth (G2)
#
# The owner guard and the dotfiles-web target are constant; the payload's event_type is the
# one thing that varies, and it DEFAULTS to "refresh" so every existing caller is untouched.
# "core-release" is the other side of the contract — it wakes dotfiles-web's fleet-sync (the
# bot that regenerates AND COMMITS generated.json) rather than deploy.yml's cache-purge
# rebuild. AUTH (G2, GITHUB-APP-AUTH.md): the fleet App — the FLEET_APP_ID variable set AND
# the caller passing the private key — mints a short-lived dotfiles-web-scoped installation
# token for the dispatch. That is the ONLY auth: the legacy WEBHOOK_SECRET PAT was deleted
# when G2 finished (#683), and the input below survives as a deprecated no-op purely so
# callers still passing it keep working. Two outcomes: a caller passing NO App key (or an
# unset FLEET_APP_ID) skips the mint and the dispatch warns and no-ops; a mint that IS
# attempted but cannot reach dotfiles-web fails in create-github-app-token, so the job
# goes red before the warning branch is reachable. First-party only
# (actions/create-github-app-token + curl; no marketplace action).
# ──────────────────────────────────────────────────────────────────────────────
name: notify-web (reusable)

on:
  workflow_call:
    inputs:
      event_type:
        description: "repository_dispatch event_type to POST: 'refresh' (deploy.yml — cache-purge rebuild) or 'core-release' (fleet-sync — regenerate + commit generated.json)."
        type: string
        required: false
        default: refresh
      best_effort:
        description: "Downgrade a failed dispatch from an error to a warning. For callers whose own run conclusion is load-bearing downstream (release.yml — sync-fanout gates on it). Default false: a caller that only notifies should still go red when it can't."
        type: boolean
        required: false
        default: false
    secrets:
      WEBHOOK_SECRET:
        description: "DEPRECATED AND IGNORED. Was the legacy fallback PAT; that credential was deleted when G2 finished (#683) and nothing reads this any more. The fleet callers have stopped passing it (#819), so what keeps this DECLARED is the published workflow_call contract: removing an accepted secret fails validation for any caller still passing it. It comes out on the next MAJOR, which is safe because a MAJOR mints vN+1 and leaves the outgoing alias FROZEN (RELEASE-RUNBOOK.md 1.1) — @v6 callers keep this contract and meet the removal only when they adopt @v7. Removing it on a PATCH/MINOR would be the harmful case. Do not pass it in new callers."
        required: false
      FLEET_APP_PRIVATE_KEY:
        description: "Fleet GitHub App private key (G2). With the FLEET_APP_ID variable set, mints the dotfiles-web-scoped token used for the dispatch. This is the SOLE active dispatch credential — the legacy PAT it once fell back to was deleted when G2 finished (#683)."
        required: false

permissions:
  contents: read

jobs:
  dispatch:
    # Any repo under the canonical owner may dispatch; forks under other owners are
    # excluded and lack the secrets anyway.
    if: github.repository_owner == 'dotgibson'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Presence flag for the App private key. Secrets can't be tested in a step `if:`, but
      # an env DERIVED from a secret comparison can — and it never exposes the key (the value
      # is just 'true'/'false'). This gates the mint so a caller that passes no key no-ops
      # below — even when FLEET_APP_ID is set org-wide — instead of the mint step failing
      # on an empty key.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Mint a dotfiles-web-scoped token IF the fleet App is configured AND the caller
      # passed its private key. No App / no key → SKIPPED, and the dispatch below no-ops
      # (GITHUB-APP-AUTH.md, G2). ~1h expiry.
      - name: Mint a scoped installation token (if the App is configured)
        id: app
        if: vars.FLEET_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dotfiles-web

      - name: Notify dotfiles-web to rebuild
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          # Via env, never interpolated into the script body — a caller-supplied string
          # must not be able to write shell. The allowlist below is the real gate.
          EVENT_TYPE: ${{ inputs.event_type }}
          BEST_EFFORT: ${{ inputs.best_effort }}
        run: |
          set -euo pipefail
          # An empty TOKEN can only mean the mint step above was SKIPPED — its `if:` found
          # no FLEET_APP_ID variable, or the CALLER passed no FLEET_APP_PRIVATE_KEY (a
          # reusable workflow sees only the secrets its caller hands it). A mint that is
          # ATTEMPTED and fails errors inside create-github-app-token, failing the job
          # before this step runs. Both causes are named below because nine repos execute
          # THIS file, and with no PAT fallback left this warning is their only signal that
          # a dispatch silently stopped happening.
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::fleet App auth unavailable (no FLEET_APP_ID variable, or this caller passed no FLEET_APP_PRIVATE_KEY) — skipping showcase refresh"
            exit 0
          fi
          # Only the two events dotfiles-web actually listens for. A typo'd event_type
          # would otherwise POST successfully (the API accepts any string) and silently
          # trigger nothing — the exact failure mode this dispatch path already suffered.
          # Deliberately NOT covered by best_effort: this is a config error in the caller,
          # checked against a literal, so it can only appear when someone edits a caller —
          # and it must go red then. best_effort is for the transient half (below).
          case "${EVENT_TYPE}" in
            refresh | core-release) ;;
            *)
              echo "::error::unknown event_type '${EVENT_TYPE}' — dotfiles-web listens for 'refresh' or 'core-release'"
              exit 1
              ;;
          esac
          if curl -fsS -X POST \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dotgibson/dotfiles-web/dispatches \
            -d "$(printf '{"event_type":"%s"}' "${EVENT_TYPE}")"; then
            echo "Dispatched ${EVENT_TYPE} to dotfiles-web"
            exit 0
          fi
          # curl already retried 3×, so this is a durable failure, not a blip.
          if [ "${BEST_EFFORT}" = "true" ]; then
            echo "::warning::could not dispatch ${EVENT_TYPE} to dotfiles-web — continuing" \
                 "(best-effort). dotfiles-web polls hourly for a Core release it missed, so" \
                 "the showcase self-heals within the hour."
            exit 0
          fi
          echo "::error::could not dispatch ${EVENT_TYPE} to dotfiles-web"
          exit 1
