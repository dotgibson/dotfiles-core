# Pings dotfiles-web when this repo changes. Two flavors, chosen by trigger:
#   • a plain push to main → event_type "refresh": a cache-purge rebuild of the
#     static showcase (received by dotfiles-web's deploy.yml).
#   • a published release   → event_type "core-release": pokes dotfiles-web's
#     fleet-sync, the bot that regenerates AND COMMITS src/data/generated.json, so the
#     site's baked Core version tracks the new tag at once instead of waiting for
#     fleet-sync's weekly cron (which left Monday's data-freshness guard red until Tue).
# Receiving side: dotfiles-web's deploy.yml (refresh) + fleet-sync.yml (core-release).
#
# THE RELEASE PATH HERE IS A BACKSTOP, NOT THE MAIN ROUTE — and it is worth knowing why,
# because it looked like the main route for months while sending nothing at all. Our
# releases are published by release.yml running `gh release create` under the built-in
# GITHUB_TOKEN, and an event raised by GITHUB_TOKEN never starts another workflow run
# (GitHub's recursion guard). So `release: published` is INERT for every release we cut:
# this workflow never ran on one, and dotfiles-web's `repository_dispatch:
# types: [core-release]` never received a single POST (dotgibson/dotfiles-web#109).
# release.yml now dispatches core-release itself, from inside the publishing job, which
# the guard cannot suppress. The trigger below still earns its place for a Release
# published by HAND from the GitHub UI — a human-raised event, which does fire — and
# release.yml does not run in that case (no tag push), so the two never double-send.
#
# AUTH (G2): the fleet GitHub App (the FLEET_APP_ID variable + FLEET_APP_PRIVATE_KEY
# secret — see dotfiles-core GITHUB-APP-AUTH.md) mints a short-lived dotfiles-web-scoped
# token for the dispatch. That is the ONLY auth: the legacy WEBHOOK_SECRET PAT was
# deleted when G2 finished (#683). Two different outcomes, deliberately: with NO App ID
# or key (a fork, or a repo the org secret doesn't reach) the mint is skipped and the
# dispatch no-ops with a warning; but if the mint is ATTEMPTED and the App cannot reach
# dotfiles-web, create-github-app-token fails the step and the job goes red — the warning
# branch never runs. A configured App that can't reach its target is a misconfiguration,
# not something to swallow.
name: Refresh showcase

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    # Any repo under the canonical owner may dispatch (every source repo does);
    # forks under other owners are excluded and lack the secret anyway.
    if: github.repository_owner == 'dotgibson'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Presence flag for the App key (value 'true'/'false', never the key): secrets can't be
      # tested in a step `if:`, but an env derived from a secret comparison can. Gates the mint
      # so a repo without the key no-ops below instead of failing on an empty key.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Mint a dotfiles-web-scoped token from the fleet App (dotfiles-core
      # GITHUB-APP-AUTH.md, G2); no App/key -> SKIPPED, and the dispatch below no-ops.
      - name: Mint a scoped installation token (if the App is configured)
        id: app
        if: vars.FLEET_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dotfiles-web
      - name: Notify dotfiles-web to rebuild
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          # A published release carries a new Core version → poke the committing
          # regenerator (fleet-sync) so generated.json is refreshed straight away.
          # Any other trigger (a plain push to main) is just a cache-purge rebuild.
          EVENT_TYPE: ${{ github.event_name == 'release' && 'core-release' || 'refresh' }}
        run: |
          set -euo pipefail
          # An empty TOKEN can only mean the mint step above was SKIPPED — its `if:` found
          # no FLEET_APP_ID variable or no FLEET_APP_PRIVATE_KEY secret. A mint that is
          # ATTEMPTED and fails errors inside create-github-app-token, failing the job
          # before this step runs, so it never reaches this branch. Name the missing
          # credentials rather than the App's behaviour: with no PAT fallback left, this
          # warning is the only signal that this repo has silently stopped refreshing.
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::fleet App auth not configured here (no FLEET_APP_ID variable or FLEET_APP_PRIVATE_KEY secret) — skipping showcase refresh"
            exit 0
          fi
          curl -fsS -X POST \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dotgibson/dotfiles-web/dispatches \
            -d "$(printf '{"event_type":"%s"}' "$EVENT_TYPE")"
          echo "Dispatched ${EVENT_TYPE} to dotfiles-web"
