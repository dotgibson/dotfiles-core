# .github/workflows/token-health.yml
# ──────────────────────────────────────────────────────────────────────────────
# TOKEN HEALTH PROBE (G2). The fleet's cross-repo automation rides two long-lived
# fine-grained PATs — FLEET_SYNC_TOKEN (contents+PRs on the OS repos, used by
# sync-fanout) and WEBHOOK_SECRET (contents on dotfiles-web, used by notify-web).
# When one silently expires, fan-out and showcase-refresh break with only a red run
# nobody watches (this compounds G1). This weekly probe makes an authenticated no-op
# with each token, reads the expiry GitHub returns for fine-grained PATs, and files a
# DEDUPLICATED issue if a token is invalid or expiring soon — so rotation happens
# BEFORE the break, not after.
#
# HARD vs SOFT: an invalid/revoked token (auth fails) also fails the run red; a token
# merely expiring within WARN_DAYS files the heads-up issue but stays green (so it
# isn't red for two weeks). Either way the deduped issue is the real signal.
#
# First-party only: plain curl to api.github.com + gh (both preinstalled); no secret
# is ever printed. INERT without the secrets — an unset token is skipped with a notice.
name: token-health

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC, after the morning sweeps (staggered, no clone contention)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: token-health
  cancel-in-progress: true

jobs:
  probe:
    # Owner-gate: forks lack the secrets anyway, and shouldn't burn minutes probing.
    if: github.repository_owner == 'dotgibson'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLEET_SYNC_TOKEN: ${{ secrets.FLEET_SYNC_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      WARN_DAYS: "14"
      ISSUE_TITLE: "token-health: a fleet PAT is invalid or expiring"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Probe each PAT for validity + expiry
        run: |
          set -euo pipefail
          problems="$RUNNER_TEMP/token-problems.md"
          : >"$problems"
          invalid=0

          probe() {
            name="$1"; token="$2"
            if [ -z "${token:-}" ]; then
              echo "::notice::$name not set — skipping (that path of automation is simply unused)"
              return 0
            fi
            hdrs="$RUNNER_TEMP/$name.hdr"
            # Capture curl's TRANSPORT exit status separately from the HTTP code: a
            # network/DNS/api.github.com blip (curl exit != 0) must NOT be misread as an
            # invalid token, or a transient outage would page for a needless rotation.
            # Only a SUCCESSFUL request that returns non-200 is a real auth failure.
            set +e
            code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$name — could not reach api.github.com (curl exit $rc); treating as a transient outage, not a token failure"
              return 0
            fi
            if [ "$code" != "200" ]; then
              printf -- '- **%s** — authentication FAILED (HTTP %s). The token is invalid, revoked, or expired. Rotate it now.\n' "$name" "$code" >>"$problems"
              invalid=1
              return 0
            fi
            # Fine-grained PATs advertise their expiry in this response header.
            exp="$(tr -d '\r' <"$hdrs" | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2; exit}')"
            if [ -z "$exp" ]; then
              echo "$name: valid; no expiry advertised (non-expiring token)"
              return 0
            fi
            exp_epoch="$(date -u -d "$exp" +%s 2>/dev/null || echo 0)"
            if [ "$exp_epoch" = 0 ]; then
              echo "::warning::$name valid but expiry '$exp' is unparseable — skipping the threshold check"
              return 0
            fi
            days=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
            if [ "$days" -le "$WARN_DAYS" ]; then
              printf -- '- **%s** — expires in **%s day(s)** (%s). Rotate it before fan-out / showcase-refresh breaks silently.\n' "$name" "$days" "$exp" >>"$problems"
            else
              echo "$name: valid; expires in $days days ($exp)"
            fi
          }

          probe FLEET_SYNC_TOKEN "${FLEET_SYNC_TOKEN:-}"
          probe WEBHOOK_SECRET "${WEBHOOK_SECRET:-}"

          if [ -s "$problems" ]; then
            echo "HAS_PROBLEMS=1" >>"$GITHUB_ENV"
            [ "$invalid" = 1 ] && echo "HAS_INVALID=1" >>"$GITHUB_ENV"
          else
            echo "all configured tokens are healthy"
          fi

      - name: File a deduplicated issue if any token is unhealthy
        if: env.HAS_PROBLEMS == '1'
        run: bash .github/workflows/file-routine-issue.sh "$ISSUE_TITLE" "$RUNNER_TEMP/token-problems.md"

      - name: Fail red only when a token is actually invalid (not merely expiring)
        if: env.HAS_INVALID == '1'
        run: |
          echo "A fleet PAT failed authentication — see the filed issue." >&2
          exit 1
