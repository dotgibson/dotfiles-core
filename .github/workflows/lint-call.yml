name: lint (reusable)

# ──────────────────────────────────────────────────────────────────────────────
# REUSABLE shell/workflow lint gate (G3). Every OS/role repo carried its own
# ~203-line copy of this (identical but for Offense's one extra exclude) — one fix had
# to be hand-propagated to 5+ repos. This is the single definition; each OS repo
# collapses to a 3-line caller:
#
#   jobs:
#     lint:
#       uses: dotgibson/dotfiles-core/.github/workflows/lint-call.yml@v4
#       # Offense only: with: { extra_ls_files_excludes: ":!:offensive/companion/**" }
#
# The ONLY per-repo variance is the extra `git ls-files` exclude (Offense excludes its
# vendored htpx `offensive/companion/` subtree); everything else — the pinned-tool
# bootstrap, SHELLCHECK_OPTS, the core/ exclude, shfmt-advisory — is constant.
#
# CHECKOUT IS INVERTED vs the old per-repo lint.yml: dotfiles-core@v4 is checked out
# at ROOT (so `./.github/actions/setup-core-tools` + `scripts/tool-versions.env`
# resolve here — the SAME major line callers pin this workflow to, mirroring
# auto-tag-call.yml), and the CALLER repo is checked out into `caller/` (the tree we
# actually lint). This lets the reusable workflow reuse Core's own composite action
# without depending on the caller's vendored `core/` copy, and keeps actionlint happy
# when it lints THIS file inside dotfiles-core (the action path exists here).
#
# Same scoping decisions as before: core/ is excluded (gated by its own CI), no Lua
# leg (all Lua lives under core/), shfmt is advisory. Tools are SHA-256-verified by
# the shared composite action against pinned checksums in scripts/tool-versions.env —
# EXCEPT markdownlint-cli2, which is npm rather than a release asset and is installed
# from the same pinned version, mirroring ci.yml's own markdown step.
#
# THREE JOBS: `shell` (shellcheck/bash -n/RETURN-trap/zsh -n/owned-block/shfmt),
# `actionlint` (the caller's workflows), and `markdown` (#452 — the file class the other
# two never inspect, and the one a non-maintainer is most likely to read).
#
# TWO legs need no pinned tool and are not linters — both are greps, and both encode a rule
# that lives in scripts/lib/common.sh so the fleet-facing copy cannot drift from the tested
# one:
#
#   * RETURN-trap discipline. Here rather than in SHELLCHECK_OPTS because shellcheck
#     genuinely cannot see the bug — the broken line is valid bash — and because
#     bootstrap-test.yml never runs provision(), so no gate in the fleet executes the code
#     where it detonates (#512, #461). BLOCKING, and verified against all nine fleet repos
#     plus Core before landing: every one was green, so nobody was red on arrival.
#   * Core-owned block duplication (#449). The mirror of audit-core.sh §5c: that gate catches
#     OS-specifics leaking INTO Core, and nothing caught portable logic stranded OUTSIDE it
#     — which is how the same direnv/gh/uv/ty block came to be hand-maintained in seven OS
#     repos, in three drifted variants. ADVISORY for one release cycle, because unlike the
#     leg above it is red-on-arrival by construction: callers pin the moving @v4 tag, so
#     they see this leg before they can possibly have vendored the Core that lets them
#     delete their copy. See the long note on that step.
#
# A THIRD leg is advisory for the same red-on-arrival reason, measured rather than assumed:
# markdown (#452). Seven of the nine fleet repos carry findings today (0 to 52 each), so
# landing it blocking would red most of the fleet before a maintainer could act. Numbers,
# and why the backlog is smaller than it looks, are on the `markdown` job below.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      extra_ls_files_excludes:
        description: >-
          Extra git-ls-files pathspec exclude(s), appended after ':!:core/**' in every
          file list. Each a RAW pathspec with NO surrounding quotes — the value is
          word-split into a bash array, so literal quotes would become part of the token
          and the exclude would silently not match. Space-separated for multiple. Only Offense
          sets it: :!:offensive/companion/**
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shell:
    name: shell lint (shellcheck · shfmt · syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXTRA_EXCLUDES: ${{ inputs.extra_ls_files_excludes }}
    steps:
      # 1) Core@v4 at ROOT — provides the composite action + pinned tool-versions.env.
      #    (v4 = the current major, matching the @v4 callers; keep in step on a major bump.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/dotfiles-core
          ref: v4
      # 2) The caller repo into caller/ — the tree we lint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller

      - name: Load pinned tool versions + checksums (Core single source)
        run: |
          f=scripts/tool-versions.env
          if [ ! -f "$f" ]; then echo "::error::$f missing from the dotfiles-core checkout"; exit 1; fi
          grep -E '^[A-Z0-9_]+=' "$f" >> "$GITHUB_ENV"

      - name: Install zsh (for zsh -n on the repo-owned zsh modules)
        # Drop GitHub's third-party apt repos (packages.microsoft.com / azure) before update:
        # they intermittently serve an unsigned InRelease and fail the WHOLE `apt-get update`
        # with exit 100 — a flaky unrelated to installing zsh from the base repos. Targeting
        # only *microsoft*/*azure* files is safe regardless of where the Ubuntu base lives
        # (sources.list vs the deb822 sources.list.d).
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete 2>/dev/null || true
          # `apt-get update`, BOUNDED — a wedged mirror otherwise hangs to the job
          # timeout. Full reasoning at ci.yml's "Install zsh (Linux)" step.
          apt_update=(sudo timeout -k 10 120 apt-get -o Acquire::Retries=3
                      -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update)
          # Best-effort, NOT the gate — see the install below. A second failure is a warning,
          # not a step failure: the job needs zsh, not a fresh index.
          if ! "${apt_update[@]}"; then
            echo "::warning::apt-get update failed or timed out — retrying once"
            "${apt_update[@]}" || echo "::warning::apt-get update failed twice — continuing on the image's cached lists; the install below is the real gate"
          fi
          sudo timeout -k 10 180 apt-get install -y --no-install-recommends zsh

      - name: Put core-tools bin on PATH
        run: |
          mkdir -p "$HOME/.local/core-tools/bin"
          echo "$HOME/.local/core-tools/bin" >> "$GITHUB_PATH"

      - name: Cache pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/core-tools
          key: core-tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}-shell
          restore-keys: |
            core-tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}-

      - name: Install pinned gate tools (verified)
        uses: ./.github/actions/setup-core-tools
        with:
          shellcheck: "true"
          shfmt: "true"

      - name: Assert gate tools resolve to the verified bindir
        run: |
          bindir="$HOME/.local/core-tools/bin"
          rc=0
          for t in shellcheck shfmt; do
            p="$(command -v "$t" || true)"
            echo "$t -> ${p:-<not found>}"
            [ "$p" = "$bindir/$t" ] || { echo "::error::$t is '${p:-<not found>}', not the verified $bindir/$t"; rc=1; }
          done
          exit $rc

      # ── BLOCKING: real bugs in repo-owned bash/sh. core/ excluded (gated upstream);
      # curated excludes mirror the fleet house style (SC1090/1091 runtime source,
      # SC2015 the cmd&&ok||warn idiom, SC2088 tildes in messages).
      - name: shellcheck (repo-owned bash/sh)
        working-directory: caller
        env:
          SHELLCHECK_OPTS: "-e SC1090 -e SC1091 -e SC2015 -e SC2088"
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206  # curated space-separated pathspecs; intentional split
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.sh' "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .sh"; exit 0; fi
          printf 'shellcheck %s\n' "${files[@]}"
          shellcheck "${files[@]}"

      - name: bash -n (syntax, repo-owned bash/sh)
        working-directory: caller
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.sh' "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .sh"; exit 0; fi
          rc=0
          for f in "${files[@]}"; do echo "bash -n $f"; bash -n "$f" || rc=1; done
          exit $rc

      # ── BLOCKING: a leaked RETURN trap. shellcheck and `bash -n` CANNOT see this one,
      # which is why it needs its own leg rather than another SHELLCHECK_OPTS entry.
      #
      # A bash RETURN trap is a GLOBAL slot, not a function-scoped one. Arm one inside a
      # function and it stays armed in the CALLER's frame, firing a SECOND time when the
      # caller returns — where the local it was cleaning up is out of scope and `set -u`
      # makes that fatal. That is dotgibson/dotfiles-Debian#2: every fresh-box run died the
      # instant provision() returned, AFTER installing everything but BEFORE wire_links —
      # a box carrying the whole stack and not one symlink. It shipped green because the
      # broken line is VALID BASH and because bootstrap-test.yml only ever runs
      # --links-only, so no gate in the fleet executes provision() at all (#512, #461).
      #
      # THE RULE ITSELF LIVES IN ONE PLACE: scripts/lib/common.sh :: _core_return_trap_hits,
      # in the dotfiles-core checkout this workflow already puts at the workspace root. It is
      # the SAME function audit-core.sh §5e runs over Core's own tree, and it is covered by
      # ten fixtures in scripts/test-core.sh — both the shapes it must catch and the ones it
      # must ignore. This leg shipped with the pattern inlined and #555 added the helper
      # separately, which left the rule written twice with only the Core-facing copy tested;
      # the fleet-facing one was the half that could silently drift. Calling the helper is
      # what makes "one definition" true. The reasoning behind the pattern — why `trap` is
      # matched as a word anywhere on the line, why the signal is a token, why comment lines
      # are filtered — is documented there, once, rather than restated here.
      - name: RETURN-trap discipline (repo-owned bash/sh)
        working-directory: caller
        env:
          CORE_ROOT: ${{ github.workspace }}
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.sh' "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .sh"; exit 0; fi
          # common.sh is a sourced library: idempotent, no shebang, and it resolves its own
          # ux.sh sibling via ${BASH_SOURCE}, so sourcing it from caller/ is safe.
          # shellcheck source=scripts/lib/common.sh
          . "$CORE_ROOT/scripts/lib/common.sh"
          # The helper returns line NUMBERS (same contract as _core_pipefail_hits, so
          # audit-core.sh can format them its own way). Re-read the line here: in a CI log
          # the offending text is what makes the finding actionable without a checkout.
          rc=0
          for f in "${files[@]}"; do
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              echo "    $f:$hit:$(sed -n "${hit}p" "$f")"
              rc=1
            done < <(_core_return_trap_hits "$f")
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::a RETURN trap is armed without disarming itself (see the lines above)"
            echo "A bash RETURN trap is a GLOBAL slot, not a function-scoped one: armed inside a"
            echo "function it survives into the CALLER frame and fires again on ITS return, where"
            echo "the local it cleans up is out of scope and set -u makes that fatal."
            echo "Disarm first, and keep the disarm first:"
            echo "    trap 'trap - RETURN; rm -rf \"\$tmp\"' RETURN"
            echo "Background: dotgibson/dotfiles-Debian#2, dotgibson/dotfiles-core#512."
            exit 1
          fi
          echo "${#files[@]} repo-owned .sh — every RETURN trap disarms itself"

      # The file list is '*.zsh' PLUS three names by hand, and that is not belt-and-braces
      # — it is the fix for #451. The ZDOTDIR entry files are symlinked to ~/.zshenv,
      # $ZDOTDIR/.zshrc and $ZDOTDIR/.zprofile, whose destinations have no extension, so
      # they were repeatedly WRITTEN without one: scripts/new-os-repo.sh emitted all three
      # extensionless from the day it was added, and dotfiles-MacBook hand-wrote the same
      # three. None matched '*.zsh', so none was ever syntax-checked in any repo.
      #
      # ~/.zshenv is the worst possible file to leave unchecked: it is sourced on EVERY zsh
      # invocation including non-interactive ones, and it carries the ZDOTDIR indirection,
      # so a syntax error there does not degrade the shell — it breaks login shells outright
      # on every box running that layer.
      #
      # The generator now emits *.zsh (#451), which fixes repos stamped from here on. These
      # three pathspecs cover the ones already written, WITHOUT requiring a rename in each
      # repo, and stop the next hand-written entry file slipping the same way. A pathspec
      # matching nothing is inert, so this is a no-op everywhere the names are unused.
      - name: zsh -n (syntax, repo-owned zsh modules)
        working-directory: caller
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.zsh' zsh/zshenv zsh/zshrc zsh/zprofile "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .zsh"; exit 0; fi
          rc=0
          for f in "${files[@]}"; do echo "zsh -n $f"; zsh -n "$f" || rc=1; done
          exit $rc

      # ── ADVISORY IN THIS RELEASE, BLOCKING IN THE NEXT: portable logic Core already owns,
      # re-implemented locally. Not a linter and needs no pinned tool — it is a grep.
      #
      # Seven OS repos each hand-maintained the same direnv/gh/uv/ty init block and six the
      # same WSL probe: entirely portable zsh, maintained N times, and already drifted into
      # three variants of one block by the time anyone counted — two repos carried only half
      # the tools, so whether your shell completed `uv` depended on which OS you booted.
      # Core took both over in dotgibson/dotfiles-core#449; this leg stops them growing back.
      # audit-core.sh §5c catches OS-specifics leaking INTO Core and cannot see this, the
      # other direction: portable logic stranded OUTSIDE it is invisible to every gate the
      # fleet has, and was found only by reading two layers side by side.
      #
      # THE RULE ITSELF LIVES IN ONE PLACE, as the RETURN-trap leg above: scripts/lib/common.sh
      # :: _core_owned_block_hits, in the dotfiles-core checkout already at the workspace
      # root, covered by fixtures in scripts/test-core.sh. UNLIKE that leg it has no
      # audit-core.sh counterpart, on purpose — Core's own tree contains every pattern it
      # scans for, which is the point — so the Core-side guard is the INVERSE assertion in
      # test-core.sh: if Core ever loses a block, the gate stops making nine repos delete a
      # feature nobody provides.
      #
      # WHY IT WARNS RATHER THAN FAILS, for now. The RETURN-trap leg could land blocking
      # because the fleet was verified clean first. This one CANNOT: callers pin @v4, a
      # moving major tag, so every OS repo sees this leg the moment auto-tag moves — and no
      # repo can delete its copy until it has vendored the Core that replaces it. It is
      # red-on-arrival by construction. So it warns for one release cycle, and the flip is a
      # three-line follow-up once fleet-drift shows all nine clean.
      - name: Core-owned block duplication (repo-owned zsh) — advisory
        working-directory: caller
        env:
          CORE_ROOT: ${{ github.workspace }}
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          # Same population as the zsh -n leg above, entry files included — see the long
          # note there. An OS layer's direnv/WSL block is exactly the kind of thing that
          # gets parked in a .zshenv, so scanning a narrower set here would reopen the
          # duplication blind spot in the one file class that was already invisible.
          mapfile -t files < <(git ls-files '*.zsh' zsh/zshenv zsh/zshrc zsh/zprofile "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .zsh"; exit 0; fi
          # shellcheck source=scripts/lib/common.sh
          . "$CORE_ROOT/scripts/lib/common.sh"
          # The helper returns "<line>:<rule-id>". Re-read the line here for the same reason
          # the RETURN-trap leg does: the offending text is what makes a CI finding
          # actionable without a checkout.
          hits=0
          for f in "${files[@]}"; do
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              ln="${hit%%:*}"
              rule="${hit#*:}"
              owner="$(_core_owned_block_owner "$rule" || echo 'the Core zsh layer')"
              echo "    $f:$ln: [$rule] Core owns this — $owner"
              echo "        $(sed -n "${ln}p" "$f")"
              hits=1
            done < <(_core_owned_block_hits "$f")
          done
          if [ "$hits" -ne 0 ]; then
            echo "::warning::this repo re-implements a block Core owns (see the lines above)"
            echo "These moved into Core in dotgibson/dotfiles-core#449 so they stop being"
            echo "maintained once per OS repo. Delete the local copy and use the vendored one:"
            echo "  direnv/gh/uv/ty hooks -> already run from core/zsh/00-tools.zsh (direnv)"
            echo "                           and core/zsh/45-plugins.zsh (the completions)"
            echo "  WSL detection         -> if _core_is_wsl; then ... fi"
            echo "Delete only AFTER this repo has vendored a Core that carries them"
            echo "(check core.lock), or the niceties gated on them go quiet."
            echo "This warning becomes a BLOCKING failure in the next Core release."
            exit 0
          fi
          echo "${#files[@]} repo-owned .zsh — none re-implements a Core-owned block"

      # ── ADVISORY: formatting vs a 2-space indent spec (matching core/.editorconfig).
      # The if/else swallows shfmt's drift exit so the step is non-blocking WITHOUT
      # continue-on-error (a genuine install failure still reds).
      - name: shfmt (format check — advisory)
        working-directory: caller
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.sh' "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .sh"; exit 0; fi
          if shfmt -i 2 -d "${files[@]}"; then
            echo "formatting matches the 2-space spec"
          else
            echo "::warning::shfmt reported formatting drift (advisory, not blocking). Fix with: shfmt -i 2 -w <file>"
          fi

  actionlint:
    name: actionlint (workflow self-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/dotfiles-core
          # Same major as the callers (`@v4`) — see the note on the shell-lint job above.
          ref: v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller

      - name: Load pinned tool versions + checksums (Core single source)
        run: |
          f=scripts/tool-versions.env
          if [ ! -f "$f" ]; then echo "::error::$f missing from the dotfiles-core checkout"; exit 1; fi
          grep -E '^[A-Z0-9_]+=' "$f" >> "$GITHUB_ENV"

      - name: Put core-tools bin on PATH
        run: |
          mkdir -p "$HOME/.local/core-tools/bin"
          echo "$HOME/.local/core-tools/bin" >> "$GITHUB_PATH"

      - name: Cache pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/core-tools
          key: core-tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}-actionlint
          restore-keys: |
            core-tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions.env') }}-

      - name: Install pinned gate tools (verified)
        uses: ./.github/actions/setup-core-tools
        with:
          actionlint: "true"

      - name: Assert gate tools resolve to the verified bindir
        run: |
          bindir="$HOME/.local/core-tools/bin"
          p="$(command -v actionlint || true)"
          echo "actionlint -> ${p:-<not found>}"
          [ "$p" = "$bindir/actionlint" ] || { echo "::error::actionlint is '${p:-<not found>}', not the verified $bindir/actionlint"; exit 1; }

      - name: actionlint (on the caller's workflows)
        working-directory: caller
        env:
          SHELLCHECK_OPTS: "-e SC1090 -e SC1091 -e SC2015 -e SC2088"
        run: actionlint -color

  # ── markdown. The file class shellcheck and `zsh -n` never inspect, and the one most
  # likely to be read by someone who is not the maintainer: each OS repo's README is the
  # public landing page for that layer, linked from the showcase site.
  #
  # Every caller already ships a .markdownlint.jsonc — they were mirrored from Core's and
  # are functionally identical (same MD013/MD041/MD024/MD033 decisions; only the comments
  # differ). Until now those configs were pure decoration: this workflow had no markdown
  # leg at all, so the rules only ever ran if an author ran them by hand. One of them says
  # so in its own header. Core lints its own markdown (audit-core.sh §7 + a pre-commit
  # hook), so the gap was in the REUSABLE gate specifically, not in Core's hygiene.
  #
  # ADVISORY IN THIS RELEASE, BLOCKING IN THE NEXT — and unlike the owned-block leg, this
  # one is not a judgement call. Measured across the fleet before landing, with each repo's
  # own config and excludes:
  #
  #   Debian 0 · Offense 0 · MacBook 1 · Gentoo 16 · Alpine 17 · Fedora 18 · openSUSE 20
  #   · Arch 26 · Defense 52
  #
  # Seven of nine repos would go red the moment auto-tag moves @v4, before a maintainer
  # could act — callers pin a moving major tag, so they see this leg before they can
  # possibly have fixed anything. So it warns first, exactly as the Core-owned-block leg
  # does, and the flip to blocking is a one-line follow-up once the fleet is clean.
  #
  # The backlog is smaller than 150 findings looks: 130 of them are MD060 (table pipe
  # alignment) and `markdownlint-cli2 --fix` clears most of it — measured at 17 findings
  # → 5 on the worst single file. Core's own 33 markdown files are already clean under
  # the same rule set, so this is drift in the callers, not an unreasonable house style.
  #
  # markdownlint-cli2 is npm, not a release asset, so setup-core-tools does not install it
  # and should not learn to — this mirrors ci.yml's own markdown step: node is preinstalled
  # on ubuntu-latest, and MARKDOWNLINT_VERSION comes from the same tool-versions.env pin
  # that audit-core.sh §9 already checks against the pre-commit hook rev.
  markdown:
    name: markdown lint (markdownlint — advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTRA_EXCLUDES: ${{ inputs.extra_ls_files_excludes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/dotfiles-core
          # Same major as the callers (`@v4`) — see the note on the shell-lint job above.
          ref: v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller

      - name: Load pinned tool versions + checksums (Core single source)
        run: |
          f=scripts/tool-versions.env
          if [ ! -f "$f" ]; then echo "::error::$f missing from the dotfiles-core checkout"; exit 1; fi
          grep -E '^[A-Z0-9_]+=' "$f" >> "$GITHUB_ENV"

      - name: Install markdownlint-cli2 (pinned)
        run: npm install -g "markdownlint-cli2@${MARKDOWNLINT_VERSION}"

      # Scoped exactly like every other leg: core/ is the vendored tree, gated by Core's
      # own CI — a finding there is fixed upstream, not here — plus the caller's own
      # extra excludes (Offense's vendored htpx companion, which is 187 of its 204
      # markdown files).
      #
      # `working-directory: caller` is load-bearing, not tidiness: markdownlint-cli2
      # discovers .markdownlint.jsonc by walking up from the working directory, so running
      # from the workspace root would silently apply CORE's config to the caller's files.
      # The two agree today; the point is that the caller owns its own rules.
      #
      # The if/else swallows the drift exit so the step is non-blocking WITHOUT
      # continue-on-error — same shape as the shfmt leg, so a genuine install failure
      # still reds the job rather than being reported as "advisory".
      - name: markdownlint (repo-owned markdown) — advisory
        working-directory: caller
        run: |
          excludes=(':!:core/**')
          # shellcheck disable=SC2206  # curated space-separated pathspecs; intentional split
          [ -n "$EXTRA_EXCLUDES" ] && excludes+=($EXTRA_EXCLUDES)
          mapfile -t files < <(git ls-files '*.md' "${excludes[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "no repo-owned .md"; exit 0; fi
          # HARD-FAIL if the linter is missing, BEFORE the advisory if/else below. Without
          # this the `if markdownlint-cli2 …` arm cannot tell "127, not installed" from
          # "1, found issues": a broken install would be reported as an ordinary advisory
          # warning and the leg would look like it ran for the rest of the release cycle.
          # An advisory gate that silently never runs is worse than no gate — it reads as
          # coverage. The install step above is the usual failure point and reds on its
          # own; this catches the case where it "succeeds" without putting the bin on PATH.
          command -v markdownlint-cli2 >/dev/null || {
            echo "::error::markdownlint-cli2 is not on PATH after the pinned install step"
            exit 1
          }
          echo "linting ${#files[@]} repo-owned markdown file(s) against this repo's .markdownlint.jsonc"
          if markdownlint-cli2 "${files[@]}"; then
            echo "markdown is clean"
          else
            echo "::warning::markdownlint reported issues (advisory, not blocking)"
            echo "Most of the fleet's backlog is MD060 (table pipe alignment), which is"
            echo "auto-fixable. From the repo root:"
            echo "    npx markdownlint-cli2 --fix \$(git ls-files '*.md' ':!:core/**')"
            echo "Rules live in this repo's own .markdownlint.jsonc — the vendored core/"
            echo "tree is excluded and is gated by dotfiles-core's CI instead."
            echo "This warning becomes a BLOCKING failure in the next Core release."
          fi
