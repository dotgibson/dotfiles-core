# .github/workflows/sync-fanout.yml
# ──────────────────────────────────────────────────────────────────────────────
# AUTOMATED CORE FAN-OUT — the maintain button, on a trigger.
#
# Core is authored once here and vendored into every OS repo's core/ via git
# subtree (scripts/sync-core.sh). That fan-out was a MANUAL `make sync` a human had
# to remember — and when they forgot, the whole fleet silently sat a major version
# behind (the exact drift fleet-drift.yml is built to catch). This workflow closes
# that last mile: when a vX.Y.Z release is published, it runs the same audit-gated
# sync-core.sh from CI and opens a `core.lock`-bump PR against every repo in
# scripts/os-repos.txt.
#
# IT OPENS PRs, IT NEVER MERGES. The three opt-in gates in RELEASE-STRATEGY.md stay
# intact — Core still never pushes to a live host. A human reviews and merges each
# PR, canary-first (dotfiles-MacBook), per the staged rollout. The bot only removes
# the typing, not the judgement.
#
# PINNED TO THE RELEASED COMMIT, NOT main: each PR vendors the exact commit the tag
# points at (CORE_BRANCH=<sha>), so core.lock records that commit and `git describe`
# stamps the named tag — "what Alpine runs" is a frozen version, per RELEASE-STRATEGY.
#
# AUTH: the built-in GITHUB_TOKEN is scoped to dotfiles-core only — it cannot push a
# branch or open a PR in another repo. This mints a short-lived, OS-repo-scoped GitHub
# App installation token at run time (contents + pull-requests + workflows write — the last
# because a sync branch can carry .github/workflows/* pin moves) when the fleet App
# is configured (the FLEET_APP_ID variable), and otherwise falls back to the legacy
# FLEET_SYNC_TOKEN PAT — see GITHUB-APP-AUTH.md. The preflight fails loudly if neither is
# available.
#
# NB: workflow_run + workflow_dispatch triggers only take effect once this file is on
# the default branch (GitHub reads both from main, never from a feature branch). After
# merge, dry-run it by hand via "Run workflow" with a past tag before the next release.
# ──────────────────────────────────────────────────────────────────────────────
name: sync-fanout

on:
  # Fires after release.yml publishes a tag. workflow_run is used (not `release:
  # published`) because a Release created by GITHUB_TOKEN does NOT emit a `release`
  # event — that recursion guard would make this never run. workflow_run has no such
  # block, and its head_branch is the tag name release.yml ran on.
  workflow_run:
    workflows: ["release"]
    types: [completed]
  # Manual re-run / backfill: fan out an arbitrary released tag, optionally to a
  # subset of repos (space-separated, e.g. "dotfiles-MacBook dotfiles-Arch").
  workflow_dispatch:
    inputs:
      tag:
        description: "Released Core tag to fan out (vX.Y.Z)"
        required: true
      repos:
        description: "Optional subset of OS repos (space-separated); blank = whole fleet"
        required: false
        default: ""

# Only the default token is requested (read access to check out Core). All cross-repo
# writes go through the minted App token (or the legacy PAT fallback), never the
# workflow token.
permissions:
  contents: read

# Never run two fan-outs at once (a second release mid-fan-out would race the clones
# and PRs); do NOT cancel an in-flight run — let a fan-out finish.
concurrency:
  group: sync-fanout
  cancel-in-progress: false

jobs:
  fanout:
    # First-party only, and on the workflow_run path only when the release actually
    # succeeded (a failed/cancelled release must not fan a half-baked tag out).
    if: >-
      github.repository_owner == 'dotgibson' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Presence flag for the App private key (value is 'true'/'false', never the key):
      # secrets can't be tested in a step `if:`, but an env derived from a secret comparison
      # can. Gates the mint on the key ACTUALLY being present, so a partial App setup (the
      # FLEET_APP_ID variable set org-wide but the key not scoped to this repo) falls back
      # cleanly to the PAT instead of failing the mint on an empty key.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # ── Resolve the tag to fan out, and bail cleanly on anything that isn't a clean
      # SemVer release tag (a prerelease, a branch build, a mis-trigger). ──
      - name: Resolve release tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then tag="${INPUT_TAG:-}"; else tag="${WR_BRANCH:-}"; fi
          ver="${tag#v}"
          if ! printf '%s' "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::'$tag' is not a clean vX.Y.Z release tag — nothing to fan out"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo ":: will fan out Core $tag"

      # ── Mint a short-lived installation token IF the fleet GitHub App is configured
      # (the FLEET_APP_ID variable is set). No App yet → this step is SKIPPED, and every
      # token reference below falls back to the legacy FLEET_SYNC_TOKEN PAT — so merging
      # this is a no-op until you set the org var/secret (GITHUB-APP-AUTH.md, G2). The
      # token expires in ~1h, replacing the broad, hand-rotated PAT. ──
      - name: Mint a scoped installation token (if the App is configured)
        id: app
        if: steps.resolve.outputs.skip != 'true' && vars.FLEET_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # No `repositories:` list on purpose: the token's scope is the App's
          # INSTALLATION (the fan-out's write targets, per GITHUB-APP-AUTH.md). Hardcoding
          # the fleet here would be a second copy of scripts/os-repos.txt that could drift
          # and 403 a newly-added repo — the install list is the ONE place scope lives.

      # ── Fail early and legibly if NO fleet write token is available (neither the App
      # nor the legacy PAT) — otherwise the first clone/push would fail with an opaque 403. ──
      - name: Preflight — a fleet write token is available
        if: steps.resolve.outputs.skip != 'true'
        env:
          FLEET_TOKEN: ${{ steps.app.outputs.token || secrets.FLEET_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLEET_TOKEN:-}" ]; then
            echo "::error::No fleet write token available."
            echo "::error::This workflow pushes sync branches and opens PRs in the OS repos,"
            echo "::error::which the built-in GITHUB_TOKEN cannot reach. Configure the fleet"
            echo "::error::GitHub App (set the FLEET_APP_ID variable + FLEET_APP_PRIVATE_KEY"
            echo "::error::secret — see GITHUB-APP-AUTH.md), or set the legacy FLEET_SYNC_TOKEN."
            exit 1
          fi

      # Core is checked out AT THE TAG into a sibling layout (fleet/dotfiles-core) so
      # sync-core.sh's default REPOS_ROOT (the parent of its own repo) resolves to
      # fleet/, beside the OS clones. Full history: git subtree needs it.
      - name: Check out Core at the released tag
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0
          path: fleet/dotfiles-core

      # The audit gate inside sync-core.sh runs scripts/audit-core.sh --quiet (NOT
      # --strict), so a missing linter SKIPs rather than fails. We install the cheap,
      # high-value subset (shellcheck + zsh for syntax/behavioral, PyYAML for the YAML
      # gate); luacheck/markdownlint/actionlint/nvim skip gracefully and were already
      # enforced on the tagged commit by ci.yml before the tag could exist.
      - name: Install the audit toolchain
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          # `apt-get update`, BOUNDED — a wedged mirror otherwise hangs to the job
          # timeout. Full reasoning at ci.yml's "Install zsh (Linux)" step.
          apt_update=(sudo timeout -k 10 120 apt-get -o Acquire::Retries=3
                      -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update)
          # Best-effort, NOT the gate — see the install below. A second failure is a warning,
          # not a step failure: the job needs zsh, not a fresh index.
          if ! "${apt_update[@]}"; then
            echo "::warning::apt-get update failed or timed out — retrying once"
            "${apt_update[@]}" || echo "::warning::apt-get update failed twice — continuing on the image's cached lists; the install below is the real gate"
          fi
          sudo timeout -k 10 180 apt-get install -y --no-install-recommends shellcheck zsh python3-yaml

      - name: Configure git + fleet auth
        if: steps.resolve.outputs.skip != 'true'
        env:
          # The minted App token when the App is configured, else the legacy PAT.
          FLEET_TOKEN: ${{ steps.app.outputs.token || secrets.FLEET_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "dotfiles-core sync bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Authenticate every github.com https fetch/clone/push with the fleet token.
          git config --global \
            url."https://x-access-token:${FLEET_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Fan out Core and open PRs
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.FLEET_SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPOS_INPUT: ${{ github.event.inputs.repos }}
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/fleet/dotfiles-core"
          root="$GITHUB_WORKSPACE/fleet"
          target_sha="$(git -C "$core" rev-parse HEAD)"
          short="${target_sha:0:12}"
          branch="sync/core-${TAG}"
          echo ":: fanning out Core $TAG ($short) on branch $branch"

          # Target fleet = scripts/os-repos.txt (the single source), or the dispatch subset.
          mapfile -t repos < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$core/scripts/os-repos.txt")
          if [ -n "${REPOS_INPUT:-}" ]; then read -r -a repos <<< "$REPOS_INPUT"; fi
          echo ":: targets: ${repos[*]}"

          # Clone each OS repo beside Core and start a sync branch from its default tip.
          for r in "${repos[@]}"; do
            echo "::group::clone $r"
            git clone "https://github.com/${OWNER}/${r}.git" "$root/$r"
            git -C "$root/$r" checkout -B "$branch"
            echo "::endgroup::"
          done

          # ONE audit-gated fan-out for the whole fleet (sync-core.sh refuses to vendor
          # a red tree and stamps core.lock per repo), pinned to the released commit so
          # each core.lock records that exact commit + its tag.
          CORE_BRANCH="$target_sha" "$core/scripts/sync-core.sh" "${repos[@]}"

          # Per repo: push the branch and open a PR only when the sync actually produced
          # a commit AND core.lock now pins the released commit (post-condition check).
          summary="$RUNNER_TEMP/summary.md"; : > "$summary"
          fail=0
          for r in "${repos[@]}"; do
            path="$root/$r"
            default="$(git -C "$path" symbolic-ref --short refs/remotes/origin/HEAD | sed 's#^origin/##')"
            locked="$(grep -E '^core_sha=' "$path/core.lock" 2>/dev/null | cut -d= -f2 || true)"
            ahead="$(git -C "$path" rev-list --count "origin/${default}..HEAD" 2>/dev/null || echo 0)"

            if [ "$ahead" -eq 0 ]; then
              if [ "$locked" = "$target_sha" ]; then
                echo "- ✅ \`$r\` already at \`${TAG}\` — no PR needed" >> "$summary"
              else
                echo "- ❌ \`$r\` did not sync (core.lock \`${locked:0:12}\` != target \`$short\`)" >> "$summary"
                fail=1
              fi
              continue
            fi
            if [ "$locked" != "$target_sha" ]; then
              echo "- ❌ \`$r\` core.lock \`${locked:0:12}\` != target \`$short\` — not opening a PR" >> "$summary"
              fail=1
              continue
            fi

            # THIRD post-condition: every Core workflow pin must name the target too (#484).
            #
            # The two checks above cannot see a failed pin rewrite. sync-core.sh fails such a
            # repo — err() prints a ✗ and flips it into the failed bucket — but that verdict
            # cannot reach here: sync-core.sh exits 0 by design (this step runs it under
            # `bash -e`, so a non-zero would abort the fan-out and deny PRs to the repos that
            # DID sync), and core.lock is deliberately still written and committed on a pin
            # failure (the subtree pull has already landed; withholding the lock would add a
            # self-blocking dirty tree on top of the drift). So a repo whose pins never moved
            # satisfies `ahead >= 1` AND `locked == target` — and gets a PR, carrying the exact
            # "vendors one Core, runs another" split #482 closed, with only a ✗ in the job log.
            #
            # Assert the artefact instead of trusting the producer: re-derive every
            # dotgibson/dotfiles-core 40-hex pin from the files on disk and require it to equal
            # the target. Offline, cheap, and independent of how the sync reported. `@vN` alias
            # callers match no 40-hex and are correctly invisible here — taking the alias is a
            # deliberate per-repo policy, not drift.
            stale_pins=""
            if [ -d "$path/.github/workflows" ]; then
              stale_pins="$(grep -rhoE 'dotgibson/dotfiles-core/\.github/workflows/[^@[:space:]]+@[0-9a-f]{40}' \
                "$path/.github/workflows" 2>/dev/null | sed 's/.*@//' | sort -u | grep -v "^${target_sha}$" || true)"
            fi
            if [ -n "$stale_pins" ]; then
              echo "- ❌ \`$r\` workflow pin(s) still name $(echo "$stale_pins" | cut -c1-12 | paste -sd' ' -) != target \`$short\` — not opening a PR" >> "$summary"
              echo "::error::$r: the workflow pin rewrite did not land — core.lock says $short but a .github/workflows/* pin does not. Fix the file and re-run; a PR here would vendor one Core and run another (#482/#484)."
              fail=1
              continue
            fi

            # FOURTH post-condition: the vendored TREE must match the lock (#556).
            #
            # The three checks above all compare the LOCK to the INTENT — core.lock says the
            # target, the pins say the target. None of them looks at what core/ actually
            # CONTAINS, which is the axis #556 broke: sync-core.sh used to re-resolve the
            # branch at materialize time, so a push to Core during the run could give core/ a
            # newer tree than the sha stamped beside it. Every check here would still pass,
            # the PR would open, and the mismatch would surface later as a scheduled
            # core-integrity sweep calling the merged repo TAMPERED.
            #
            # The sync now pins the fetch, and asserts this itself per repo — but that
            # verdict cannot reach here (sync-core.sh exits 0 by design; see the note above),
            # so the belt goes where the PR decision is actually made. Same comparison
            # core-integrity.sh makes: HEAD:core against <target>^{tree}.
            vend="$(git -C "$path" rev-parse --verify --quiet 'HEAD:core' || true)"
            exp="$(git -C "$core" rev-parse --verify --quiet "${target_sha}^{tree}" || true)"
            if [ -z "$vend" ] || [ "$vend" != "$exp" ]; then
              echo "- ❌ \`$r\` vendored core/ tree \`${vend:0:12}\` != Core@\`$short\` tree \`${exp:0:12}\` — not opening a PR" >> "$summary"
              echo "::error::$r: core/ and core.lock name different commits (#556). A PR here would land a tree that core-integrity reports as TAMPERED."
              fail=1
              continue
            fi

            # Push per repo, and NEVER let one repo's failure deny the others their PR.
            # This ran unguarded under `set -e`, so the first bad push aborted the whole
            # loop: on the v4.12.1 cut dotfiles-MacBook was refused and the remaining eight
            # repos — five of them already synced and ready — got no PR at all. A release
            # reached NONE of the fleet over one repo's permission problem. The loop
            # already treats every other per-repo error this way (fail=1 + continue); the
            # push was the one step that could still take the fleet down with it.
            if ! git -C "$path" push --force-with-lease origin "HEAD:${branch}" \
              >"$RUNNER_TEMP/push-$r.log" 2>&1; then
              # The failure worth naming precisely: since #482 the fan-out rewrites the
              # target's .github/workflows/* SHA pins, and a GitHub App token WITHOUT the
              # `workflows` permission is refused on exactly those files. GitHub's message
              # is opaque unless you already know that, so name the grant instead.
              #
              # Deliberately NOT retried with the workflow changes dropped. core.lock and
              # the pins name the same Core; landing the lock while silently keeping stale
              # pins is precisely the "vendors one Core, runs another" split that #482
              # closed — and it is invisible to core-integrity, which compares a tree
              # object and never reads a workflow. That is what made it survive. Failing
              # this repo loudly beats re-creating that.
              if grep -qi "without .workflows. permission" "$RUNNER_TEMP/push-$r.log"; then
                echo "- ❌ \`$r\` push refused: the fleet token lacks the \`workflows\` permission, and this repo SHA-pins a Core caller (#482)" >> "$summary"
                echo "::error::$r: grant the fleet GitHub App the 'workflows' permission (see GITHUB-APP-AUTH.md) — the fan-out must rewrite .github/workflows/* pins in repos that SHA-pin a Core caller"
              else
                echo "- ❌ \`$r\` push failed — see the run log" >> "$summary"
                echo "::error::$r: push failed"
              fi
              sed 's/^/    /' "$RUNNER_TEMP/push-$r.log" >&2 || true
              fail=1
              continue
            fi
            # The gh calls need the same isolation as the push. Under `set -e` a failing
            # command substitution exits the step, so a repo-specific API error here — a
            # rate limit, an outage, PR creation disabled on one repo — would strand every
            # LATER repo despite its branch already being pushed. That is the worse shape
            # of the two: the push succeeded, so the work is done and merely unannounced.
            if ! open="$(gh pr list --repo "${OWNER}/${r}" --head "$branch" --state open --json url --jq 'length' 2>"$RUNNER_TEMP/gh-$r.log")"; then
              # State UNKNOWN, not "no PR". The lookup is what failed, so an open PR could
              # be hidden by the very rate limit or outage that broke the query — telling
              # the operator to open one invites a duplicate.
              echo "- ⚠️ \`$r\` branch pushed, but its PR state could not be read — check \`$branch\` and open a PR only if none exists" >> "$summary"
              echo "::error::$r: gh pr list failed after a successful push — the sync branch is on the remote; whether a PR exists is UNKNOWN, check before opening one"
              sed 's/^/    /' "$RUNNER_TEMP/gh-$r.log" >&2 || true
              fail=1
              continue
            fi
            if [ "${open:-0}" != 0 ]; then
              url="$(gh pr list --repo "${OWNER}/${r}" --head "$branch" --state open --json url --jq '.[0].url' || echo '')"
              echo "- 🔁 \`$r\` PR already open — pushed update: ${url:-(url lookup failed)}" >> "$summary"
            else
              cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated Core fan-out from \`dotfiles-core\` **${TAG}** (\`${short}\`).

          Vendors the released Core into \`core/\` via \`git subtree pull --squash\` and
          bumps \`core.lock\` to pin the exact released commit. Generated by
          dotfiles-core's \`sync-fanout\` workflow.

          Merge per the staged rollout in \`RELEASE-STRATEGY.md\` — canary
          \`dotfiles-MacBook\` first, bake, then the rest. **Review the diff before merging.**
          EOF
              if ! url="$(gh pr create --repo "${OWNER}/${r}" --base "$default" --head "$branch" \
                --title "chore(core): sync Core → ${TAG}" \
                --body-file "$RUNNER_TEMP/pr-body.md" 2>"$RUNNER_TEMP/gh-$r.log")"; then
                # Same caution as the list case: a timeout can fail the client after the
                # PR was created server-side, so check rather than assume it is absent.
                echo "- ⚠️ \`$r\` branch pushed, but \`gh pr create\` failed — check \`$branch\` and open a PR only if none exists" >> "$summary"
                echo "::error::$r: gh pr create failed — the sync branch is on the remote; the PR may or may not have been created, check before retrying"
                sed 's/^/    /' "$RUNNER_TEMP/gh-$r.log" >&2 || true
                fail=1
                continue
              fi
              echo "- 🚀 \`$r\` PR opened: $url" >> "$summary"
            fi
          done

          { echo "### Core fan-out → ${TAG} (\`${short}\`)"; echo; cat "$summary"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more repos failed to sync — see the job summary"
            exit 1
          fi

  # Turn a failed fan-out into a deduplicated issue (G1). A release that can't reach the
  # fleet is exactly the silent break this closes — often a fleet-App auth problem (G2):
  # the App not installed on a target repo, or the FLEET_APP_ID / private key not in scope.
  notify-failure:
    needs: fanout
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure-call.yml
    with:
      workflow: sync-fanout
      title: "ci-failure: Core fan-out (sync-fanout) is red"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "The release fan-out failed — Core did not reach one or more OS repos. Common cause: the fleet GitHub App is misconfigured — not installed on a target OS repo, or the FLEET_APP_ID variable / FLEET_APP_PRIVATE_KEY secret isn't scoped to dotfiles-core (see GITHUB-APP-AUTH.md). The fleet may be sitting a version behind until this is resolved."
