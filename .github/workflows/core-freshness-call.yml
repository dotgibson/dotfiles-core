# .github/workflows/core-freshness-call.yml
# ──────────────────────────────────────────────────────────────────────────────
# REUSABLE consumer-side freshness watcher (G3, and folds in the drifted MacBook copy
# — G7). Every OS repo carried an identical watcher that checks whether its vendored
# core/ has fallen behind upstream. This is the single definition; each repo collapses
# to a caller that owns only its cron:
#
#   jobs:
#     vendored-core:
#       uses: dotgibson/dotfiles-core/.github/workflows/core-freshness-call.yml@v3
#
# It runs the CALLER's own test/check-core-freshness.sh (which lives per-repo), so this
# checks out the caller (not Core) and takes NO inputs — the one thing it DOES set is
# CORE_BRANCH (see the step below): the watcher compares against the released tag, not
# main, because the fan-out vendors releases. The script's exit contract is
# the interface: 0 = current/skip, 2 = behind (the nudge), 1 = hard failure. MacBook's
# migration onto this reusable definition (replacing its pre-core.lock variant) also
# adopts the standard `git subtree pull` remediation below, retiring the old
# `make sync-core` drift (G7).
# ──────────────────────────────────────────────────────────────────────────────
name: core-freshness (reusable)

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  vendored-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # core.lock is the fast path; keep full history so the subtree-split fallback still resolves
      - name: Check vendored core/ against upstream
        env:
          # Compare against the RELEASED tip, not main. The fan-out (sync-fanout.yml) vendors
          # the commit a release TAG points at — RELEASE-STRATEGY.md's "what a host runs is a
          # frozen version" — so comparing core.lock against refs/heads/main reported every
          # repo as "behind" the moment ANY commit landed on Core between releases. That is
          # not drift: the repo is on the newest release with nothing to pull. It made this
          # scheduled run red for most of its life (the fleet failed 6/29, 7/6, 7/20, 7/27 and
          # 8/3 identically), which is how a nudge stops being read.
          #
          # refs/tags/vN is the moving MAJOR alias — the same ref callers pin their `uses:` to,
          # force-advanced to each release by tag-release.sh. So this now asks the question the
          # watcher was always meant to ask: is there a NEWER RELEASE this repo has not taken?
          #
          # It must stay LIGHTWEIGHT: `ls-remote refs/tags/v4` returns a commit SHA for a
          # lightweight tag but the TAG OBJECT's SHA for an annotated one, and the script
          # compares SHAs verbatim — an annotated alias would report false drift forever.
          # tag-release.sh creates it as `git tag -f "$MAJOR" "$TAG^{commit}"` (lightweight,
          # peeled), and RELEASE-RUNBOOK.md §1.1 step 4 does the same by hand. Keep it that way.
          # This pin moves with the major: the copy of this file on the v5 tag will say v5.
          CORE_BRANCH: refs/tags/v4
        run: |
          # Capture output + exit code and branch on it: the script exits 0 for
          # current/skip, 2 for drift (the nudge), 1 for a hard failure (e.g. a malformed
          # core.lock). `|| rc=$?` keeps the step's set -e from aborting before we branch.
          rc=0
          out="$(./test/check-core-freshness.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0)
              {
                echo "### ✅ vendored core/ freshness"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "### ⚠️ vendored core/ is behind upstream dotfiles-core"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo "There is nothing to run by hand. A release opens a sync PR in every OS"
                echo "repo automatically (sync-fanout.yml), so this run means that PR is still"
                echo "open — merge it, then re-run ./bootstrap.sh on the host."
                echo ""
                echo "If no sync PR exists, re-dispatch the fan-out for this repo instead:"
                echo "dotfiles-core → Actions → sync-fanout → Run workflow, with the released"
                echo "tag and this repo name."
                echo ""
                echo "Deliberately NOT a raw 'git subtree pull' recipe: that updates core/ but"
                echo "not core.lock, which leaves this very check red (it reads core_sha) AND"
                echo "makes core-integrity.sh report the fresh subtree as TAMPERED, since it"
                echo "compares the vendored tree against the commit the lock pins. sync-core.sh"
                echo "commits both together; that is why the fan-out is the supported path."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              {
                echo "### ❌ core-freshness check failed (exit $rc)"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
