name: real-bootstrap

# A PERIODIC, GENUINELY UNSTUBBED BOOTSTRAP — the only route to the defects the per-PR
# gates cannot see (#589, follow-on from the closed #575).
#
# WHAT THE PER-PR GATES ALREADY COVER, so this one's scope is honest. bootstrap-test.yml's
# `--links-only` leg returns before provision() and asserts the WIRING. Its opt-in
# `provision-stub` leg executes provision() with the package managers and downloaders
# replaced by shims, covering the CONTROL FLOW — a leaked RETURN trap, a bare refresh
# aborting under `set -e`, an unchecked GPG import. Both are cheap and run on every PR.
#
# WHAT NEITHER CAN EVER SEE, because a stubbed run installs nothing:
#   * a WRONG PACKAGE NAME — nothing resolves it
#   * a BAD OR ROTATED REPO KEY — gpg is a stub
#   * FAILURE BRANCHES — the stubs always return 0, so no error path is exercised
#   * anything invoked by ABSOLUTE PATH — it bypasses the shim dir entirely
#
# And one hard limit the option-1 rollout exposed: a stubbed run installs nothing, so any
# bootstrap that verifies a tool is PRESENT afterwards can never pass. openSUSE's exits 2
# in exactly that case — an HONEST result its bootstrap.sh deliberately produces so a caller
# can tell the box is half-provisioned. Neither side should bend to close that gap: weakening
# the exit removes the one signal an operator needs, and teaching the job to tolerate exit 2
# masks a genuine abort. The only honest resolution is a run where the packages are really
# installed. That is this workflow.
#
# NAMING THE TOOL HERE IS A TRAP — DO NOT. This note used to cite yazi as the worked example.
# openSUSE later packaged yazi first-class and deleted the broken cargo path, so by the time
# the sweep first ran the claim was false: the real exit 2 was doggo and sesh, from an
# unrelated defect (a mise probe that missed its own off-PATH install). Because the `details:`
# string below is copied VERBATIM into every issue this job files, that dead example shipped
# as triage guidance and pointed the first investigation at the wrong tool (#742). State the
# MECHANISM; let the run report which tool.
#
# ADVISORY, AND IT FILES AN ISSUE RATHER THAN BLOCKING ANYTHING. It is weekly, not per-PR,
# and network-bound: it asserts other people's package archives as much as our own scripts.
# A hard gate on that reds unrelated PRs whenever an upstream mirror hiccups, which is
# exactly how these lanes get switched off. Same posture packages.yml's advisory lanes use.
#
# THE MATRIX IS DERIVED, NOT LISTED. scripts/fleet-bootstrap-matrix.py reads each repo's OWN
# bootstrap-test.yml caller for every per-leg knob — `image:`, `prep:`, `bootstrap_timeout:`,
# `bootstrap_postcheck:` — so this can never drift from what the per-PR gate actually runs.
# A repo bumping its image is followed with no edit here.
# (This repo has been burned by frozen counts before — one commit fixed eleven, #519.)
#
# EXIT 0 AND INTACT SYMLINKS ARE NOT PROOF THE BOX GOT ITS PACKAGES, and for a long time
# they were all this sweep asserted. A Gentoo leg that emerged 131 packages over 75 minutes
# went GREEN while the bootstrap printed a ledger naming two that did not install — one
# unreachable through its own dependency chain, one whose upstream build cannot succeed on
# that toolchain at all. This job is the only one in the fleet that installs anything, so it
# was the only one that could ever have caught them, and it reported success (#750). Both
# have since been fixed in the OS repo; the REPORTING gap was this repo's, and it outlives
# whichever two tools happened to expose it. `bootstrap_postcheck` is the fix:
# an opt-in, repo-declared assertion run below, on the far side of a real provision.
#
# AND NOT `--strict`, which is the obvious lever and the wrong one. It turns each bootstrap's
# end-of-run ledger into a non-zero exit, and that ledger deliberately mixes a GENUINE
# PROVISIONING GAP (an atom that will never install) with an INFRASTRUCTURE BLIP (a
# rate-limited mise.run, a GURU sync hiccup, a failed tpm clone). --strict cannot tell them
# apart, so it would red this lane over an outage that is not ours — see the posture note
# above for how that ends. dotfiles-Fedora's bootstrap-full.yml refused it in the same words
# and did a far-side presence assertion instead; this is that, made reusable. The bootstrap
# exit code stays an honest signal nobody weakens and nobody tolerates (#742).
#
# NOT COVERED HERE, deliberately, and both say so in their own .github/core-gates.txt:
# dotfiles-MacBook (macOS; provision() hard-exits without the Command Line Tools, and this
# job is Linux-container-only) and dotfiles-Defense (its own fresh-bootstrap.yml already
# boots a bare image and runs bootstrap.sh for real).

on:
  schedule:
    # Wednesdays 06:00 UTC. Staggered OFF the Monday 06:00/06:30/07:00/10:00 cluster and the
    # Tuesday Claude ladder (07:00-12:00) + atuin-guard-verify (13:00) — G1 de-confliction,
    # the same reasoning parity-check.yml's cron carries.
    - cron: "0 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: real-bootstrap
  cancel-in-progress: false

jobs:
  matrix:
    name: derive the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.derive.outputs.legs }}
      count: ${{ steps.derive.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First-party, anonymous, shallow — the same clone shape fleet-drift.yml uses. No
      # third-party action to trust, and no token: every fleet repo is public.
      - name: Clone the fleet (public, anonymous, shallow)
        run: |
          set -euo pipefail
          mkdir -p ../fleet && cp -r . ../fleet/dotfiles-core
          while read -r repo; do
            repo="${repo%%#*}"; repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -n "$repo" ] || continue
            git clone --quiet --depth 1 "https://github.com/dotgibson/$repo.git" "../fleet/$repo" \
              || echo "::warning::could not clone $repo — its legs will be absent from this run"
          done < scripts/os-repos.txt

      - name: Derive the matrix from each repo's own caller
        id: derive
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          legs="$(python3 scripts/fleet-bootstrap-matrix.py ../fleet)"
          n="$(printf '%s' "$legs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          # A zero-leg run must be LOUD. Silence here would look exactly like a green sweep,
          # which is the "advisory gate that never runs reads as coverage" failure.
          if [ "$n" -eq 0 ]; then
            echo "::error::derived 0 bootstrap legs — the fleet clone or the caller parse is broken"
            exit 1
          fi
          echo "legs=$legs" >>"$GITHUB_OUTPUT"
          echo "count=$n" >>"$GITHUB_OUTPUT"
          # The postcheck marker is not decoration. A sweep where most legs assert nothing
          # about provisioning still ends in a wall of green ticks, so the coverage gap has
          # to be legible at the TOP of the run, not only in whichever leg you open (#750).
          printf '%s\n' "$legs" | python3 -c 'import json,sys;[print("-",x["name"],"" if x["postcheck"] else "(no postcheck — provisioning not asserted)") for x in json.load(sys.stdin)]' \
            >>"$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: ${{ matrix.leg.name }}
    needs: matrix
    runs-on: ubuntu-latest
    # PER-LEG, from each repo's own caller — a single shared ceiling cannot fit this matrix.
    # Gentoo emerges from SOURCE: its `emerge --sync` alone ran 22 minutes before a package
    # was touched, and the leg was cancelled mid-install at the old flat 45m while still
    # making steady forward progress (#742). Raising that flat number instead would hand
    # every OTHER leg a ceiling far above its real runtime, so a genuine hang on a fast
    # distro would sit there burning runner time.
    #
    # The value rides in via the caller's `with:` block because a job that calls a reusable
    # workflow CANNOT legally carry timeout-minutes — the same constraint scripts/check-modern.sh
    # records as the reason its rule 8 keys on `runs-on:` rather than on every job. The matrix
    # script emits a timeout for every leg (default 45), so this is never empty.
    timeout-minutes: ${{ matrix.leg.timeout }}
    strategy:
      fail-fast: false # one distro's broken mirror must not hide the other seven
      matrix:
        leg: ${{ fromJSON(needs.matrix.outputs.legs) }}
    steps:
      - name: Check out the repo under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotgibson/${{ matrix.leg.repo }}
          persist-credentials: false

      # NO STUBBING AT ALL — that is the entire point. `docker run` rather than a job-level
      # `container:` because scripts/check-modern.sh requires digest-pinned images and this
      # image comes from the matrix; the same reasoning bootstrap-test.yml records.
      #
      # BLIB_SU= for the same reason bootstrap-test.yml sets it: the container runs as root,
      # and Arch/openSUSE/Kali ship chsh without sudo.
      - name: Bootstrap for real
        env:
          IMAGE: ${{ matrix.leg.image }}
          PREP: ${{ matrix.leg.prep }}
          OFFENSIVE: ${{ matrix.leg.offensive }}
          POSTCHECK: ${{ matrix.leg.postcheck }}
        run: |
          set -euo pipefail
          docker run --rm -e PREP -e OFFENSIVE -e POSTCHECK -e BLIB_SU= -v "$PWD:/repo" -w /repo "$IMAGE" sh -euc '
            n=0
            until [ "$n" -ge 5 ]; do
              sh -c "$PREP" && break
              n=$((n+1)); echo "prep attempt $n failed, retrying in $((n*10))s..." >&2; sleep $((n*10))
            done
            [ "$n" -lt 5 ] || { echo "prep failed after 5 attempts" >&2; exit 1; }
            # Pre-seed tpm so the run does not depend on a network clone it does not test.
            mkdir -p "$HOME/.tmux/plugins/tpm"
            ./bootstrap.sh

            # THE FAR-SIDE ASSERTION, AND IT MUST LIVE IN HERE. bootstrap.sh returning 0 is
            # necessary but not sufficient: the bug this class of gate exists for aborted
            # AFTER provision() did its work and BEFORE wire_links, leaving a box carrying
            # the whole stack and not one symlink (dotgibson/dotfiles-Debian#2).
            #
            # It used to sit in a step of its own, one level out — where it could only ever
            # echo, because `docker run --rm` has already destroyed the filesystem it would
            # need to look at by the time that step starts. So the sweep carried a step
            # NAMED for an assertion it did not perform, on the only per-leg check it
            # claimed: the exact "an advisory gate that never runs reads as coverage"
            # failure the header of this workflow warns about (#742).
            #
            # Same two links bootstrap-test.yml asserts on the far side of its stubbed
            # provision(); keep the pair in step. NO SINGLE QUOTES in here — the whole block
            # is inside a single-quoted `sh -euc ...` and one apostrophe closes it.
            for link in "$HOME/.config/zsh/loader.zsh" "$HOME/.gitconfig"; do
              if [ ! -L "$link" ]; then
                echo "MISSING symlink after a full run: $link — provision() may have aborted before wire_links" >&2
                exit 1
              fi
            done
            echo "wiring survived provisioning"

            # THE PROVISIONING ASSERTION, opt-in per repo, and it must live in HERE for the
            # same reason the wiring check above does: docker run --rm has destroyed this
            # filesystem by the time any following step starts. See the header for why this
            # is a far-side presence check rather than --strict.
            #
            # THE REPO SCRIPT OWNS THE TIERING, not this workflow. It knows which tools its
            # own package list promises, so it can hard-fail on those and merely warn on the
            # overlay/cargo/opt-in ones no run guarantees. Core cannot make that distinction
            # for eight distros and does not try: it runs the command and honours the exit.
            #
            # NO SINGLE QUOTES in here, as above. The value arrives through the ENVIRONMENT
            # rather than being interpolated into this block, so a caller string may contain
            # anything without closing the sh -euc quote or injecting into it. This is the
            # same shape PREP already uses; a foreign caller is no more trusted than the
            # bootstrap.sh this job runs unstubbed by design.
            if [ -n "$POSTCHECK" ]; then
              echo ":: postcheck (declared by the repo under test): $POSTCHECK"
              if sh -c "$POSTCHECK"; then
                echo "postcheck passed — the box carries what this repo promises"
              else
                echo "POSTCHECK FAILED: bootstrap.sh returned 0 and the wiring survived, but this box is missing tools its own list promises" >&2
                exit 1
              fi
            else
              echo "NO postcheck declared for this leg — nothing here asserted that any package actually installed"
            fi
          '

      # Reporting only — the assertions themselves ran in the container above, where the
      # filesystem they check still exists. This step reaching at all means the leg passed.
      #
      # IT MUST NOT CLAIM MORE THAN RAN. A leg with no postcheck was asserted on its exit
      # code and its symlinks and nothing else, which is precisely the pass that hid two
      # missing packages behind a green tick (#750). Say so, per leg, rather than printing
      # one sentence that reads identically either way.
      - name: Record the leg in the run summary
        env:
          IMAGE: ${{ matrix.leg.image }}
          POSTCHECK: ${{ matrix.leg.postcheck }}
        run: |
          if [ -n "$POSTCHECK" ]; then
            echo "$IMAGE: bootstrap.sh returned 0 with no stubbing, the wiring survived, and the repo postcheck passed" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "$IMAGE: bootstrap.sh returned 0 with no stubbing and the wiring survived — NO postcheck declared, so nothing asserted the packages arrived" >>"$GITHUB_STEP_SUMMARY"
          fi

  # A red run FILES AN ISSUE; it blocks nothing. See the posture note in the header.
  notify-failure:
    needs: [matrix, bootstrap]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure-call.yml
    with:
      workflow: real-bootstrap
      title: "ci-failure: the weekly real bootstrap is red"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "A genuinely unstubbed `./bootstrap.sh` failed on at least one distro image. This is the only gate that installs anything, so it is the only one that can see a wrong package name, a rotated repo key, a failure branch, or a step invoked by absolute path — check which leg went red before assuming an upstream mirror hiccup. Two failure shapes read differently: an exit 2 is a bootstrap that finished and REPORTED its own half-provisioned state, so the ledger it printed names the tools that did not install and is the place to start; a leg cancelled at its timeout is not a hang unless the log actually stalled — Gentoo builds from source and legitimately takes hours. Read the ledger or the last log lines before blaming a mirror. A third shape reads differently again: a POSTCHECK FAILED line means bootstrap.sh exited 0 and kept its symlinks, but the repo-declared far-side check found tools its own package list promises are not on the box — that is a genuine provisioning gap, not a blip, and the postcheck script names which tools."
