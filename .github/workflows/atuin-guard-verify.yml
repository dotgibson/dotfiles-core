name: atuin-guard-verify

# Does the ONE upstream fact _core_atuin_daemon_guard (zsh/00-tools.zsh) is premised on
# still hold? With the daemon enabled and its socket unreachable, atuin 18.19.0 exits 0,
# prints a history id, writes nothing to stderr and DISCARDS the entry
# (atuinsh/atuin#3561). A persistent precmd hook, a throttled connect(2) on the prompt
# path, and a one-way degrade in every interactive shell across nine repos are justified
# by that fact ALONE — and it has already moved once, in the direction that makes it harder
# to notice (18.16.1 failed loudly). Nothing watched it: atuin is not pinned in
# mise/config.toml, has no renovate.json entry, and /tool-scout's allowed-tools carry no
# Bash, so it can compare version NUMBERS and never measure. This measures, weekly.
#
# ── WHY THIS ONE THING IS NOT PINNED ─────────────────────────────────────────────────
# Everything else the fleet downloads is pinned to a version AND a SHA-256
# (scripts/tool-versions.env, .github/actions/setup-core-tools), and that discipline is not
# being relaxed here — it is INVERTED on purpose, for one job, because the subject of the
# measurement IS "whatever upstream ships now". A pinned atuin would re-measure a version
# whose behaviour is already recorded in zsh/00-tools.zsh: it would prove the thing nobody
# doubts and miss the thing that actually costs history — the NEXT release, arriving
# silently on whichever of eight machines updates first. A pin here is a detector that can
# only confirm the past.
#
# The cost of that inversion is real, and it is bounded structurally rather than by trust:
# this workflow downloads and EXECUTES an unpinned upstream binary, so the job that runs it
# holds nothing worth stealing (see the split below), and the binary runs under `env -i`
# inside scripts/verify-atuin-guard.sh, on an ephemeral runner, with no secret and no write
# scope anywhere in reach.
#
# ── TWO PREMISES, TWO MEASURE/REPORT PAIRS ───────────────────────────────────────────
# The guard rests on two upstream facts, and each gets its own measurement, its own verdict
# and its own issue title (dotgibson/dotfiles-core#402):
#
#   measure  / report             the SILENT-DISCARD premise. Starts no daemon.
#   measure-autostart / report-autostart
#                                 the AUTOSTART SELF-HEALING premise — does atuin start its
#                                 own daemon when the socket is unreachable? The guard stands
#                                 DOWN entirely under ATUIN_DAEMON__AUTOSTART on that
#                                 assumption, and on Alpine and macOS it is the only
#                                 mitigation those machines have. This leg spawns a real
#                                 daemon and owns its teardown.
#
# They are separate jobs rather than a matrix because a matrix cannot give the two legs
# distinct outputs for the two report jobs to file under, and because the spawning leg must
# not be able to hang the leg carrying the fleet's primary safety verdict.
#
# ── THE SECURITY SPLIT, AND WHY IT IS SPLIT AT ALL ───────────────────────────────────
# .github/workflows/claude-routines.yml states this repo's own rule: a job that fetches or
# executes untrusted upstream content must NOT also hold a token, because that is a
# supply-chain path to the secret. It is the same reason freshness-triage is denied
# `update-nvim-plugins.sh --check`, which runs upstream plugin build hooks. This workflow
# is the sharpest case of that rule, so it is obeyed by construction:
#
#   resolve   holds a token (contents: read) and VERIFIES the download — the published
#             checksum, then the GitHub build-provenance attestation. It downloads bytes
#             and hashes them. It never extracts the archive and never runs a byte of it.
#             `gh attestation verify` needs a token even for a public repo — there is no
#             anonymous mode — and that single fact is what forces this job to exist
#             separately at all. The choice was "verify provenance in a token-bearing job
#             that executes nothing" or "execute in a token-bearing job"; only the first is
#             defensible.
#   measure   holds NOTHING. No GH_TOKEN in any step, no App key, no CLAUDE token. It
#             re-downloads the SAME asset anonymously and refuses to continue unless it
#             hashes to the digest `resolve` already attested — so the handoff across the
#             job boundary is a pinned digest, and an asset swapped between the two jobs is
#             caught rather than measured. This and `measure-autostart` are the ONLY jobs
#             that run upstream code, and both hold nothing; `measure-autostart` additionally
#             lets that upstream binary FORK a daemon, which is why its teardown is proven
#             inside the script rather than left to the runner tearing down.
#   report    holds issues: write, and never sees the binary. It consumes exactly one thing:
#             a base64 blob of markdown that `measure` emitted. Base64 because the blob
#             contains upstream-derived TEXT (a version string, an stderr excerpt) — the
#             code does not cross the boundary but the data does, so it crosses as opaque
#             bytes, decoded straight to a file, never through a shell expansion or a
#             workflow expression.
#
# Report-first, like every routine in .claude/: it never mutates the repo, never opens a
# PR, and files findings as a DEDUPLICATED issue with a stable, date-free title.
#
# TIMING: Tuesday 13:00 UTC. The Claude routine ladder in claude-routines.yml ends at 12:00
# and Monday 06:00-10:00 is the mechanical fleet-sweep cluster; 13:00 stays clear of both,
# which is the stagger this repo already documents.

on:
  schedule:
    - cron: "0 13 * * 2" # Tue 13:00 UTC — after the Claude ladder (…12:00) closes
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atuin-guard-verify
  cancel-in-progress: true

env:
  ATUIN_REPO: atuinsh/atuin
  # x86_64 gnu: the runner's own architecture, and the shape the Fedora/Arch/openSUSE/
  # Gentoo half of the fleet installs. The musl half (Alpine) is NOT covered, and the
  # report says so rather than letting a green run imply fleet-wide coverage.
  ASSET: atuin-x86_64-unknown-linux-gnu.tar.gz

jobs:
  # ── 0. the DETECTOR's own self-test, run unconditionally on this weekly schedule. ────
  # scripts/test-core.sh's `atuin` scope drives scripts/verify-atuin-guard.sh against stub
  # binaries: ~44 hermetic scenarios asserting that the detector reports moved/holds/
  # unmeasurable correctly. That block is 197s of a 286s behavioral suite — 68% of it, and
  # the largest single cost on the CI critical path — so ci.yml no longer runs it on every
  # push, only when the detector, zsh/00-tools.zsh or atuin/ actually change.
  #
  # This job is the other half of that trade, and it is what keeps the harness from being
  # merely LESS gated. The measure/measure-autostart jobs below trust the detector to tell a
  # real upstream move from a broken apparatus; a detector whose `unmeasurable` verdict had
  # quietly regressed would file a confident issue saying the premise MOVED when nothing had.
  # So the self-test runs here every week regardless of what changed, on the same schedule as
  # the measurement that depends on it.
  #
  # Hermetic and offline: stubs only, no atuin, no daemon, no network. It deliberately does
  # NOT need `resolve`, and nothing downstream needs it — a red self-test must not suppress
  # the live measurement, it must sit red next to it and say which of the two to believe.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh (the suite's shell legs)
        run: |
          set -euxo pipefail
          # Same flaky third-party apt repos as ci.yml drops before an update (see #422's
          # neighbours): packages.microsoft.com/azure intermittently serve an unsigned
          # InRelease and fail the whole update with exit 100.
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete 2>/dev/null || true
          # `apt-get update`, BOUNDED — a wedged mirror otherwise hangs to the job
          # timeout. Full reasoning at ci.yml's "Install zsh (Linux)" step.
          apt_update=(sudo timeout -k 10 120 apt-get -o Acquire::Retries=3
                      -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update)
          "${apt_update[@]}" || { echo "::warning::apt-get update failed or timed out — retrying once"; "${apt_update[@]}"; }
          sudo apt-get install -y --no-install-recommends zsh
      - name: Premise detector self-test (hermetic stubs)
        run: ./scripts/test-core.sh --scope atuin

  # ── 1. resolve + verify. Token-bearing. Executes nothing it downloaded. ──────────────
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.r.outputs.ok }}
      tag: ${{ steps.r.outputs.tag }}
      digest: ${{ steps.r.outputs.digest }}
      reason: ${{ steps.r.outputs.reason }}
    env:
      # contents: read on a public repo. Used ONLY by `gh attestation verify`, which has no
      # anonymous mode. Nothing in this job executes downloaded code, which is exactly the
      # property that makes holding a token here acceptable under the rule quoted above.
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: r
        name: Resolve the latest atuin release, download it, verify it
        # NEVER exits non-zero for an upstream problem: an unresolvable release, a renamed
        # asset or a bad checksum is a REPORTABLE finding (`unmeasurable`), not a crashed
        # workflow — the same reasoning freshness.yml applies to its `--check` mode, where
        # an intended non-zero is "the report, not a crash". A red run here would page
        # through notify-failure AND file nothing, which is the worst of both.
        run: |
          set -uo pipefail
          # bail() writes a REASON that can contain upstream-derived text (a tag, an asset
          # name, a checksum read out of a downloaded file). $GITHUB_OUTPUT is a line-oriented
          # key=value file, so a value carrying a newline can FORGE further outputs — an
          # attacker-controlled `.sha256` could append `ok=true` after our `ok=false` and make
          # the measure job run an asset whose provenance check never passed. Collapse the
          # value to one line, always. (Truncated too: a reason is a sentence, and an
          # unbounded one from upstream is just another way to stuff the file.)
          bail() {
            reason="$(printf '%s' "$1" | tr -d '\r\n' | cut -c1-500)"
            { echo "ok=false"; echo "reason=$reason"; } >>"$GITHUB_OUTPUT"
            exit 0
          }

          # Resolve via the releases/latest REDIRECT, not the REST API. Deliberate: the
          # unauthenticated API is 60 requests/hour PER IP and Actions runners share egress
          # addresses, so an API call is the one step here that could fail for a reason
          # having nothing to do with atuin. The redirect is a plain fetch of a public page
          # and carries no such budget.
          url="$(curl -sSI -o /dev/null -w '%{url_effective}' --retry 3 --max-time 60 \
                 -L "https://github.com/${ATUIN_REPO}/releases/latest")" \
            || bail "could not resolve the latest atuin release (network)"
          tag="${url##*/tag/}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) bail "the releases/latest redirect did not yield a vX.Y.Z tag (got '$tag') — atuin's release naming may have changed" ;;
          esac

          base="https://github.com/${ATUIN_REPO}/releases/download/${tag}"
          curl -fsSL --retry 3 --max-time 300 -o asset.tgz "${base}/${ASSET}" \
            || bail "could not download ${ASSET} from ${tag} — atuin's release ASSET NAMING may have changed (it ships cargo-dist target-triple names; a rename is a finding, not a crash)"
          curl -fsSL --retry 3 --max-time 60 -o asset.sha256 "${base}/${ASSET}.sha256" \
            || bail "${tag} publishes no ${ASSET}.sha256 — refusing to measure an unverified binary"

          # atuin (cargo-dist) publishes a per-asset `<name>.sha256` as `<64hex> *<name>`.
          # Compare the hex only: the ` *` marker is BSD/GNU-dependent and `sha256sum -c`
          # is fussy about it.
          # Read the FIRST line only, and demand exactly 64 hex characters. The previous
          # `case $want in [0-9a-f]*)` tested only the first CHARACTER, so a multi-line or
          # padded file passed the check and then flowed into a bail reason — see bail()
          # above for why that mattered. Validating the shape here is the primary fix; the
          # sanitising in bail() is the backstop, and both are cheap.
          want="$(head -n 1 <asset.sha256 | cut -d' ' -f1 | tr -d '\r')"
          got="$(sha256sum asset.tgz | cut -d' ' -f1)"
          case "$want" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) bail "the published checksum for ${ASSET} is not a hex digest — refusing to measure" ;;
          esac
          [ "${#want}" -eq 64 ] || bail "the published checksum for ${ASSET} is ${#want} characters, not 64 — refusing to measure an asset whose digest file is not a plain SHA-256"
          [ "$want" = "$got" ] || bail "CHECKSUM MISMATCH on ${ASSET}@${tag} (published $want, downloaded $got). Not measured. Investigate."

          # The real trust anchor. A checksum published beside the artifact by the same
          # account proves the bytes survived the wire; it proves NOTHING about who built
          # them. atuin sets github_attestations in its cargo-dist manifest, so a Sigstore
          # build-provenance bundle ties this exact digest to a workflow run in the upstream
          # repo. Fail CLOSED: no attestation, or a failed verification, means no measurement.
          gh attestation verify asset.tgz --repo "$ATUIN_REPO" \
            || bail "build-provenance attestation FAILED or is absent for ${ASSET}@${tag} — refusing to measure an unattested binary"

          { echo "ok=true"; echo "tag=$tag"; echo "digest=$got"; echo "reason="; } >>"$GITHUB_OUTPUT"
          echo "### atuin \`$tag\` — checksum + provenance verified (\`$got\`)" >>"$GITHUB_STEP_SUMMARY"

  # ── 2. measure. Holds nothing. The ONLY job that runs upstream code. ─────────────────
  measure:
    needs: resolve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout only. No issues: write, no App key, no CLAUDE token.
    outputs:
      verdict: ${{ steps.m.outputs.verdict }}
      report_b64: ${{ steps.m.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # false, and load-bearing here rather than merely conventional: `true` writes the
          # job's token into .git/config, and a later step in this job executes an unpinned
          # upstream binary from a working directory rooted at that checkout.
          persist-credentials: false

      - name: Fetch the verified asset (digest-pinned across the job boundary)
        if: needs.resolve.outputs.ok == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        # NOTE the absence of GH_TOKEN — here and in every step below. This job downloads
        # anonymously, and the only thing it trusts is DIGEST, which the token-bearing job
        # already checked a provenance attestation against.
        run: |
          set -uo pipefail
          curl -fsSL --retry 3 --max-time 300 -o asset.tgz \
            "https://github.com/${ATUIN_REPO}/releases/download/${TAG}/${ASSET}" || exit 0
          got="$(sha256sum asset.tgz | cut -d' ' -f1)"
          if [ "$got" != "$DIGEST" ]; then
            echo "digest drift between jobs: $got != $DIGEST" >&2
            rm -f asset.tgz
            exit 0   # falls through to --unmeasurable below; never a silent measurement
          fi
          mkdir -p at && tar -xzf asset.tgz -C at --strip-components=1
          find at -type f -name atuin -perm -u+x -print -quit >atuin.path

      - id: m
        name: Measure the premise
        env:
          RESOLVE_OK: ${{ needs.resolve.outputs.ok }}
          RESOLVE_REASON: ${{ needs.resolve.outputs.reason }}
        run: |
          set -uo pipefail
          bin="$(cat atuin.path 2>/dev/null || true)"
          # Every path reports through the SCRIPT's one renderer, never by composing prose
          # in YAML — so the wording a human reads cannot drift from the code producing it.
          if [ "$RESOLVE_OK" != "true" ]; then
            ./scripts/verify-atuin-guard.sh --color never \
              --unmeasurable "$RESOLVE_REASON" --report report.md --json >verdict.json
          elif [ -z "$bin" ]; then
            ./scripts/verify-atuin-guard.sh --color never \
              --unmeasurable "the verified tarball contained no executable named 'atuin' — upstream's archive LAYOUT may have changed" \
              --report report.md --json >verdict.json
          else
            ./scripts/verify-atuin-guard.sh --color never \
              --atuin "$PWD/$bin" --report report.md --json >verdict.json
          fi
          vrc=$?
          # rc 1 (`moved`) and rc 3 (`unmeasurable`) are THE REPORT, NOT A CRASH — the
          # freshness.yml precedent — so those must not fail the step. But this step
          # deliberately runs WITHOUT `set -e`, and without this guard ANY other outcome (the
          # verifier segfaulting, a syntax error, an OOM kill) also sailed through to a green
          # job: the summary block at the end returns 0, so notify-failure never fired and a
          # genuinely crashed sweep looked exactly like a quiet week. Allow ONLY the three
          # documented codes; anything else is a crash and must be loud.
          case "$vrc" in
            0 | 1 | 3) ;;
            *) echo "::error::verify-atuin-guard.sh exited $vrc — not one of the documented 0/1/3"; exit 1 ;;
          esac
          # Both artefacts must exist and parse. A verdict read out of a truncated or absent
          # verdict.json would otherwise become an empty `verdict=` output, which the report
          # job treats as "not holds" and files as a finding — an issue about nothing.
          # One line on purpose: this is inside a YAML block scalar, and a continuation line
          # at column 0 would end the block instead of continuing the command.
          v="$(python3 -c 'import json; d=json.load(open("verdict.json")); v=d["verdict"]; assert v in ("holds","moved","unmeasurable"), v; print(v)')" ||
            { echo "::error::verdict.json is missing, truncated, or carries no known verdict"; exit 1; }
          [ -s report.md ] || { echo "::error::report.md was not written"; exit 1; }
          echo "verdict=$v" >>"$GITHUB_OUTPUT"
          # One line, no newlines: safe as a job output, and opaque to anything downstream.
          echo "report_b64=$(base64 -w0 <report.md)" >>"$GITHUB_OUTPUT"
          {
            echo "### atuin guard premise: \`$v\`"
            echo ""
            echo '```json'
            cat verdict.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # ── 3. report. Holds issues: write. Never sees the binary. ───────────────────────────
  report:
    needs: [resolve, measure]
    # `holds` files nothing, deliberately: a bot that opens an issue every week to say
    # nothing changed gets muted, and a muted channel is worse than no channel. The job
    # summary carries the good news.
    if: always() && needs.measure.result == 'success' && needs.measure.outputs.verdict != 'holds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERDICT: ${{ needs.measure.outputs.verdict }}
      REPORT_B64: ${{ needs.measure.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File / update the deduplicated issue
        run: |
          set -euo pipefail
          # Decoded straight to a FILE. Never into a variable, never through an expression:
          # this content derives from an upstream binary's output, and although the code
          # never crossed the job boundary, the data did.
          printf '%s' "$REPORT_B64" | base64 -d >"$RUNNER_TEMP/atuin-guard.md"
          # STABLE, date-free titles — file-routine-issue.sh dedups on an EXACT open-issue
          # title match. Two titles, not one: `moved` and `unmeasurable` need different
          # actions (re-decide the guard vs repair the detector), so they get separate
          # threads instead of interleaving in one.
          if [ "$VERDICT" = "moved" ]; then
            title="atuin-guard-verify: the silent-discard premise has MOVED"
          else
            title="atuin-guard-verify: the premise could not be measured"
          fi
          bash .github/workflows/file-routine-issue.sh "$title" "$RUNNER_TEMP/atuin-guard.md"

  # ── 4. measure-autostart. The OTHER premise. Holds nothing, same as `measure`. ───────
  # A SEPARATE JOB, not a second invocation inside `measure` and not a matrix leg, for two
  # reasons. This one SPAWNS A REAL DAEMON, so it is the leg most able to hang; sharing a job
  # (and therefore a timeout) with the silent-discard measurement would let a wedged daemon
  # here cost the fleet's PRIMARY safety verdict, which nothing about this premise justifies.
  # And a matrix cannot give the two legs distinct job outputs, which the two report jobs
  # below need in order to file under two different titles.
  #
  # It re-downloads independently rather than sharing `measure`'s working directory — jobs do
  # not share a filesystem — and applies the same digest pin, so the same
  # asset-swapped-between-jobs check protects both legs.
  measure-autostart:
    needs: resolve
    if: always()
    runs-on: ubuntu-latest
    # 20, not 15. Four arms each spawn a daemon, wait for it to answer, write, and then prove
    # it stopped; the pathological case is four wedged clients hitting CORE_ATVERIFY_TIMEOUT
    # in turn plus their stop polls. Still far under, but the margin is cheap and a timeout
    # here produces no verdict at all rather than an `unmeasurable` one.
    timeout-minutes: 20
    permissions:
      contents: read # checkout only. No issues: write, no App key, no CLAUDE token.
    outputs:
      verdict: ${{ steps.ma.outputs.verdict }}
      report_b64: ${{ steps.ma.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the verified asset (digest-pinned across the job boundary)
        if: needs.resolve.outputs.ok == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          set -uo pipefail
          curl -fsSL --retry 3 --max-time 300 -o asset.tgz \
            "https://github.com/${ATUIN_REPO}/releases/download/${TAG}/${ASSET}" || exit 0
          got="$(sha256sum asset.tgz | cut -d' ' -f1)"
          if [ "$got" != "$DIGEST" ]; then
            echo "digest drift between jobs: $got != $DIGEST" >&2
            rm -f asset.tgz
            exit 0   # falls through to --unmeasurable below; never a silent measurement
          fi
          mkdir -p at && tar -xzf asset.tgz -C at --strip-components=1
          find at -type f -name atuin -perm -u+x -print -quit >atuin.path

      - id: ma
        name: Measure the autostart self-healing premise
        env:
          RESOLVE_OK: ${{ needs.resolve.outputs.ok }}
          RESOLVE_REASON: ${{ needs.resolve.outputs.reason }}
        run: |
          set -uo pipefail
          bin="$(cat atuin.path 2>/dev/null || true)"
          # --premise autostart on EVERY path, including the two that measure nothing: the
          # forced-unmeasurable renderer emits this premise's prose and scope, so a download
          # failure reported here cannot arrive worded as if it were about silent discard.
          if [ "$RESOLVE_OK" != "true" ]; then
            ./scripts/verify-atuin-guard.sh --premise autostart --color never \
              --unmeasurable "$RESOLVE_REASON" --report report.md --json >verdict.json
          elif [ -z "$bin" ]; then
            ./scripts/verify-atuin-guard.sh --premise autostart --color never \
              --unmeasurable "the verified tarball contained no executable named 'atuin' — upstream's archive LAYOUT may have changed" \
              --report report.md --json >verdict.json
          else
            ./scripts/verify-atuin-guard.sh --premise autostart --color never \
              --atuin "$PWD/$bin" --report report.md --json >verdict.json
          fi
          vrc=$?
          case "$vrc" in
            0 | 1 | 3) ;;
            *) echo "::error::verify-atuin-guard.sh --premise autostart exited $vrc — not one of the documented 0/1/3"; exit 1 ;;
          esac
          # The premise is asserted as well as the verdict. These two legs run the same script
          # with the same flags but one word different, and a copy-paste that dropped
          # `--premise autostart` would otherwise measure silent discard twice and file the
          # result under the autostart title — a confident report about the wrong premise,
          # which is the single failure this whole separate-mode design exists to prevent.
          v="$(python3 -c 'import json; d=json.load(open("verdict.json")); assert d["premise"]=="autostart", d["premise"]; v=d["verdict"]; assert v in ("holds","moved","unmeasurable"), v; print(v)')" ||
            { echo "::error::verdict.json is missing, truncated, carries no known verdict, or is not the autostart premise"; exit 1; }
          [ -s report.md ] || { echo "::error::report.md was not written"; exit 1; }
          echo "verdict=$v" >>"$GITHUB_OUTPUT"
          echo "report_b64=$(base64 -w0 <report.md)" >>"$GITHUB_OUTPUT"
          {
            echo "### atuin autostart self-healing premise: \`$v\`"
            echo ""
            echo '```json'
            cat verdict.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # ── 5. report-autostart. Holds issues: write. Never sees the binary. ─────────────────
  report-autostart:
    needs: [resolve, measure-autostart]
    if: always() && needs.measure-autostart.result == 'success' && needs.measure-autostart.outputs.verdict != 'holds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERDICT: ${{ needs.measure-autostart.outputs.verdict }}
      REPORT_B64: ${{ needs.measure-autostart.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File / update the deduplicated issue
        run: |
          set -euo pipefail
          printf '%s' "$REPORT_B64" | base64 -d >"$RUNNER_TEMP/atuin-autostart.md"
          # DISTINCT FROM THE DISCARD TITLES, both of them. file-routine-issue.sh dedups on an
          # exact open-issue title match, so reusing "the premise could not be measured" would
          # interleave two unrelated premises into one thread — and the reader would act on a
          # report written about the other one. One premise, one verdict, one title.
          if [ "$VERDICT" = "moved" ]; then
            title="atuin-guard-verify: the autostart self-healing premise has MOVED"
          else
            title="atuin-guard-verify: the autostart premise could not be measured"
          fi
          bash .github/workflows/file-routine-issue.sh "$title" "$RUNNER_TEMP/atuin-autostart.md"

  # ── 6. a genuinely crashed sweep still pages a human. ────────────────────────────────
  # Scoped to `schedule` for the freshness.yml reason: `moved` and `unmeasurable` are
  # intended outcomes routed to their own issues, so the only thing that should reach here
  # is the workflow itself breaking — and a manual dispatch that goes red is a human who is
  # already watching the tab.
  notify-failure:
    # selftest is in this list on purpose. A regressed DETECTOR is not routed to the moved/
    # unmeasurable issues — those are verdicts the detector itself produces, and a broken one
    # cannot be trusted to produce them — so its failure is exactly the "the workflow itself
    # is broken, and the guard's justification is going unchecked" case this job reports.
    needs: [selftest, resolve, measure, report, measure-autostart, report-autostart]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure-call.yml
    with:
      workflow: atuin-guard-verify
      title: "ci-failure: atuin-guard-verify is red"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "The weekly re-verification of `_core_atuin_daemon_guard`'s upstream premise crashed. `moved` and `unmeasurable` are routed to their own issues and do NOT come here — so this means the workflow itself is broken, and the guard's justification is going unchecked."
