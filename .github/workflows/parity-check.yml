name: parity-check

# The fleet's two parity gates, both of which need a repo this one does not vendor.
#
#   1. CROSS-SHELL — PARITY.md is the human contract for what "the same on zsh and
#      PowerShell" means; scripts/parity-check.sh fails when an `aligned` capability drifts
#      out of one shell (e.g. the fzf tokyonight palette gets dropped from pwsh).
#   2. DESKTOP-BAR — desktop/PARITY.shared.md is the Zebar ↔ sketchybar contract, rendered
#      between markers into dotfiles-Windows/desktop/PARITY.md and
#      dotfiles-MacBook/sketchybar/PARITY.md; scripts/gen-desktop-parity.sh --check fails
#      when either copy is edited alone. Until #693 those two files were held together by
#      nothing but the sentence "Edit both together", and they drifted 3.5 KB apart.
#
# pwsh and both bars live in separate repos, so — like fleet-drift — this clones them
# (public, anonymous, shallow) and runs the checks.
#
# Read-only: it never pushes. Weekly + on demand; PR-triggered CI can't see the other
# repo's changes, so a scheduled sweep is the right cadence (same as fleet-drift).

on:
  schedule:
    # Mondays 07:00 UTC. Staggered OFF the 06:00 cluster (fleet-drift + freshness) so the
    # fleet-cloning sweeps don't contend: fleet-drift 06:00 → core-integrity 06:30 →
    # parity-check 07:00 (G1 de-confliction).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: parity-check
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone the desktop repos (public, anonymous, shallow)
        run: |
          set -euo pipefail
          # Both gates below read sibling checkouts under --root. dotfiles-Windows serves
          # BOTH: parity-check.sh reads its pwsh sources, gen-desktop-parity.sh its
          # desktop/PARITY.md. dotfiles-MacBook is only the desktop gate's second copy.
          for repo in dotfiles-Windows dotfiles-MacBook; do
            git clone --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/$repo.git" \
              "$RUNNER_TEMP/fleet/$repo"
          done

      - name: Check cross-shell parity
        run: |
          set -o pipefail
          # --strict: in CI the Windows repo IS cloned above, so a missing checkout is a
          # real failure, not a skip. 2>&1 so the failing rows (fail()→stderr) reach the
          # job summary below.
          ./scripts/parity-check.sh --root "$RUNNER_TEMP/fleet" --strict --color never 2>&1 \
            | tee "$RUNNER_TEMP/parity.txt"
        continue-on-error: true
        id: check

      - name: Check desktop-bar parity
        run: |
          set -o pipefail
          # The Zebar ↔ sketchybar contract is authored once in desktop/PARITY.shared.md and
          # rendered into both desktop repos. Before #693 the only thing holding those two
          # copies together was the sentence "Edit both together", and they drifted 3.5 KB
          # apart. --strict for the same reason as above: both repos ARE cloned, so an
          # absent one is a real failure here rather than the environment skip it is locally.
          # --check is LOAD-BEARING: without it the generator runs in WRITE mode, rewrites
          # the throwaway clones, and exits 0 — a gate that can never fail, which is the
          # exact "checked NOTHING and reported green" shape this whole change exists to
          # remove. scripts/test-core.sh pins this flag so it cannot be dropped again.
          ./scripts/gen-desktop-parity.sh --root "$RUNNER_TEMP/fleet" --check --strict --color never 2>&1 \
            | tee "$RUNNER_TEMP/desktop-parity.txt"
        continue-on-error: true
        id: desktop

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Cross-shell parity (PARITY.md aligned rows)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/parity.txt" 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "### Desktop-bar parity (Zebar ↔ sketchybar)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/desktop-parity.txt" 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: steps.check.outcome != 'success' || steps.desktop.outcome != 'success'
        run: |
          # Report EVERY failing gate, not just the first: the two are independent
          # contracts, and a red cross-shell row must not hide a drifted desktop copy.
          rc=0
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "Cross-shell parity — an aligned PARITY.md row is unenforced, or has drifted out of a shell." >&2
            rc=1
          fi
          if [ "${{ steps.desktop.outcome }}" != "success" ]; then
            echo "Desktop-bar parity — a PARITY.md copy no longer matches desktop/PARITY.shared.md; run: make gen-desktop-parity" >&2
            rc=1
          fi
          exit "$rc"

  # Turn a red run into a deduplicated issue (G1).
  notify-failure:
    needs: parity
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure-call.yml
    with:
      workflow: parity-check
      title: "ci-failure: parity-check sweep is red"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "The weekly cross-shell parity sweep failed. An aligned PARITY.md row may be missing from zsh or PowerShell, or may have no check behind it at all — reconcile the two shells or add the needle, or the sweep itself may be broken."
