name: auto-tag (reusable)

# Cut a consumer repo's OWN next release tag when its INSTALLABLE STATE changes on main.
# An OS repo carries two version lines — the Core it vendors (core.lock) and its own
# vX.Y.Z tag. core.lock advances automatically on every sync; this closes the gap for the
# second line so it stops drifting. PATCH-bumps by default; a caller passes bump:
# minor/major for a deliberate release.
# Idempotent: a no-op when HEAD already carries a vX.Y.Z tag (see scripts/auto-tag.sh).
#
# THE CALLER SHAPE THIS FILE USED TO DOCUMENT WAS `paths: ['core/**']`, AND IT WAS WRONG
# (#696). Watching only the vendored subtree means the tag advances when *Core* moves and
# at no other time — so a repo's own work ships only when an unrelated fan-out happens to
# sweep it up, and the version number describes the dependency rather than the repo.
# Measured on dotfiles-Fedora: seven Core syncs, seven releases; six native commits (a
# package-name gate that had never run on any PR, a tracked file removed), zero releases.
# "v1.3.68" meant "68 Core syncs received" — which core.lock already answers, precisely.
# Two repos had independently diverged from the shape below and written down why
# (dotfiles-MacBook, dotfiles-openSUSE); this is that correction, made canonical.
#
# Each consumer repo adds a tiny caller:
#
#   # .github/workflows/auto-tag.yml in an OS repo
#   name: auto-tag
#   on:
#     push:
#       branches: [main]
#       # A DENYLIST, NOT AN ALLOWLIST, on purpose. The default answer is "this changed
#       # what gets installed, so cut a tag", and only what demonstrably does NOT ship is
#       # carved out. An allowlist fails the way the old core/** filter failed: add a new
#       # installable directory, forget to list it, and releases silently stop. The
#       # denylist's failure mode is a spurious patch tag — noisy, not wrong. `!` patterns
#       # are evaluated in order, so these override the `**` above.
#       paths:
#         - '**'
#         - '!**.md'          # docs are never installed. Both markdown forms: `**` spanning
#         - '!**/*.md'        #   separators is not pinned down citably, and repos nest .md
#         - '!LICENSE'
#         - '!.github/**'     # CI plumbing — not wired into $HOME by bootstrap.sh
#         - '!test/**'
#         - '!.editorconfig'  # author-time tooling config
#         - '!.markdownlint.jsonc'
#         - '!.pre-commit-config.yaml'
#         - '!renovate.json'
#     # The third SemVer component, reachable. Without this a repo can ONLY ever patch,
#     # which is what the whole fleet did: `bump` existed here from the start and no caller
#     # had ever passed it. A deliberate minor/major is now Actions → Run workflow → pick.
#     # Safe to press at any time — the reusable no-ops when HEAD is already tagged.
#     workflow_dispatch:
#       inputs:
#         bump:
#           description: 'Which SemVer component to advance'
#           type: choice
#           options: [patch, minor, major]
#           default: patch
#   permissions: { contents: write }      # the tag push needs write
#   concurrency: { group: auto-tag-${{ github.ref }}, cancel-in-progress: false }
#   jobs:
#     tag:
#       uses: dotgibson/dotfiles-core/.github/workflows/auto-tag-call.yml@v6
#       # `inputs` is empty on a push event, so this reads `patch` there and the chosen
#       # component on a dispatch. One caller, both flows.
#       with:
#         bump: ${{ inputs.bump || 'patch' }}
#
# A repo whose releasable surface is genuinely narrower than "everything installable"
# states so in its own caller and says why — dotfiles-Offense watches its second vendored
# subtree (offensive/companion/) alongside its own layer. Narrowing is a decision to write
# down, not a default to inherit.
#
# Runs the SAME scripts/auto-tag.sh the audit shellchecks/tests, so there is one
# definition of the version math. First-party only; tags in CI (no operator round-trip).
# scripts/fleet-release-triggers.sh is the register that keeps the fleet honest about
# which shape each repo actually carries.

on:
  workflow_call:
    inputs:
      bump:
        # Validated against this allowlist at runtime in the `tag` job — workflow_call
        # inputs cannot be `type: choice`, so the type system will not do it for us.
        description: "Which SemVer component to advance. One of: patch, minor, major."
        type: string
        required: false
        default: patch
      release:
        description: "Also create a GitHub Release for the cut tag (auto-generated notes)."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The calling OS repo. fetch-depth 0 brings full history AND all tags (so the
      # latest vX.Y.Z resolves and the new tag is reachable); persisted credentials
      # (checkout default) let the script push the tag.
      - name: Check out the calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # auto-tag.sh pushes the cut tag to the calling repo
          path: osrepo
          fetch-depth: 0
      # dotfiles-core carries the scripts (auto-tag.sh + gen-release-notes.sh); depth 1 is
      # enough (auto-tag reads the OS repo's history via -C, not Core's). Pin the checkout to
      # the SAME major line callers pin this workflow to (@v6) so the script version can't
      # drift from the pinned workflow definition — deterministic between releases, advancing
      # only when v6 moves (the @vN policy; RELEASE-STRATEGY.md).
      - name: Check out dotfiles-core (reference, pinned to v6)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/dotfiles-core
          ref: v6
          path: dotfiles-core
          fetch-depth: 1
      - name: Cut the next release tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }} # gh release create (when release=true) needs a token
          # Caller-supplied values reach the script through the ENVIRONMENT, never spliced
          # into the `run:` body — the same rule notify-web-call.yml states ("a caller-supplied
          # string must not be able to write shell"). This job holds contents:write AND
          # persist-credentials:true, so an interpolated "${{ inputs.bump }}" let a caller
          # close the quote and run arbitrary code with the tag-push token.
          BUMP: ${{ inputs.bump }}
          RELEASE: ${{ inputs.release }}
        # `bump` is a free-form string because workflow_call has no `type: choice` — that is
        # workflow_dispatch-only. So the allowlist is enforced here at runtime: a typo fails
        # loudly with the valid set rather than reaching auto-tag.sh's own arg parser, and
        # env-indirection means even a hostile value is inert data, not code.
        run: |
          case "$BUMP" in
          patch | minor | major) ;;
          *)
            # Do NOT echo the raw value into a workflow command. Shell-quoting does not
            # help here: the runner parses stdout LINE BY LINE, so a multiline value can
            # start a new `::...::` on the next line and forge or suppress annotations.
            # Collapse newlines and drop the command punctuation (% is the escape
            # introducer, : builds the `::` delimiter), then truncate — the same shape
            # atuin-guard-verify.yml uses for upstream-derived text.
            safe="$(printf '%s' "$BUMP" | tr -d '\r\n%:' | cut -c1-40)"
            echo "::error::invalid bump '${safe}' — expected one of: patch, minor, major"
            exit 2
            ;;
          esac
          args=("$GITHUB_WORKSPACE/osrepo" --push --bump "$BUMP")
          # Explicit if, not `[ … ] && args+=(…)`: a run: block is `bash -e`, where a false
          # test as the last statement of an && list exits the step non-zero.
          if [ "$RELEASE" = "true" ]; then args+=(--release); fi
          args+=(--color never)
          ./dotfiles-core/scripts/auto-tag.sh "${args[@]}"
