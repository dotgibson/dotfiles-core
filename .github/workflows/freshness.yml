name: freshness

# Freshness bot for the facts Core records and cannot otherwise re-check. Three kinds:
#
#   • RUNTIME PINS — the zsh-plugin SHAs (zsh/45-plugins.zsh). Pinned so nothing floats;
#     rolled forward here so nothing rots.
#   • VENDORED PINS — nvim.lock, which names the dotgibson/dotfiles-nvim revision this Core
#     carries. The editor's own plugin lockfile is no longer Core's to roll: since #1123 it
#     is authored and tested in that repo, against a real Neovim. What is left here is
#     noticing the PIN has stopped moving, which is a report, not a PR (§7(3)).
#   • RECORDED OBSERVATIONS — scripts/fleet-package-versions.tsv, the distro package
#     versions PORTING-MATRIX.md's footnotes assert. A pin rots by staying still while
#     upstream moves; an observation rots the same way, and until this job existed nothing
#     in Core could tell. That footnote was corrected twice in one day before it was
#     generated from data (#902, #904); generating it made the claim checkable, and this
#     is what actually checks it.
#
# A pinned-and-forgotten plugin can sit on a known-vuln commit indefinitely across every
# machine in the fleet. Renovate (the shared org preset, see renovate.json) watches the github-actions
# ecosystem, not these runtime pins, so they were unmonitored. Weekly (and on demand) this
# rolls the pins forward and OPENS A PR (B10) so the bump is reviewable in one click —
# instead of only a red "you should run make update-plugins" nudge that a human still had
# to action by hand. The updater scripts (--check) stay the source of truth for "is it
# behind"; this just automates the rest.
#
# Why it opens the PR as the fleet GitHub App, not GITHUB_TOKEN: GitHub deliberately does
# NOT run workflows on events created by the default GITHUB_TOKEN (a recursion guard), so a
# GITHUB_TOKEN-authored PR parks its CI at `action_required` until a human clicks "Approve
# and run". Minting a short-lived, repo-scoped App token (actions/create-github-app-token,
# SHA-pinned — same discipline as sync-fanout) and pushing + opening the PR with it makes
# the PR App-authored, so its CI runs automatically. This needs the App INSTALLED on
# dotfiles-core (GITHUB-APP-AUTH.md); until it is, the mint is skipped/fails and we fall
# back to GITHUB_TOKEN (the PR still opens, but its CI needs the manual approval). A fixed
# branch per pin-set makes it idempotent: a second run force-updates the existing branch/PR
# rather than stacking dupes. workflow_dispatch input `mode=check` keeps report-only on demand.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "pr = roll pins forward and open a PR; check = report only"
        type: choice
        default: pr
        options: [pr, check]

permissions:
  contents: read

concurrency:
  # Ref-independent: the bot force-updates fixed automation branches, so runs must
  # never overlap regardless of which ref launched them.
  group: freshness
  cancel-in-progress: true

jobs:
  zsh-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open/update the PR
    env:
      # schedule has no inputs → default to pr; dispatch honours the chosen mode.
      MODE: ${{ github.event.inputs.mode || 'pr' }}
      BRANCH: automation/freshness-zsh-plugins
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Presence flag for the App private key (a secret can't be read in `if:`; an env
      # derived from it can, and never exposes the value). Gates the mint step below.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Mint a token scoped to THIS repo so the PR is opened as the App bot, not
      # GITHUB_TOKEN — the one thing that lets its CI run without a manual approval.
      # continue-on-error: until the App is installed on dotfiles-core this fails and we
      # fall back to GITHUB_TOKEN (PR still opens; its CI then needs "Approve and run").
      - name: Mint a scoped installation token (if the App is installed here)
        id: app
        if: env.MODE == 'pr' && vars.FLEET_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id rather than app-id, which is deprecated at this pin (#831). The variable
          # holds the App's Client ID — a different value from its App ID.
          client-id: ${{ vars.FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # Push the bump branch, open its PR — that is the whole job (#830). Neither
          # `owner:` nor `repositories:` is set, which already scopes the token to THIS
          # repository; these bound the verbs on it. Deliberately NOT workflows: write —
          # a pin bump touches zsh/, never .github/workflows/, and
          # if that ever changes the push fails loudly rather than the token having quietly
          # been able to rewrite CI all along.
          permission-contents: write
          permission-pull-requests: write
      # Check out with the App token when we have one, so the branch push is App-authored
      # too (a GITHUB_TOKEN push would re-gate CI on the PR's `synchronize` updates).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # the bot pushes its branch (git push -f -u origin) before opening the PR
          token: ${{ steps.app.outputs.token || github.token }}
      # check-only path (on demand): --check just git-ls-remotes each pinned upstream.
      - name: Check zsh plugin pins (report only)
        if: env.MODE == 'check'
        run: |
          if ./scripts/update-plugins.sh --check; then
            echo "✅ all zsh plugin pins current" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### ⚠️ zsh plugin pins are behind upstream"; echo ""; \
              echo "Re-run this workflow with mode=pr to roll them forward."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # pr path (default/scheduled): roll the SHAs forward, and if anything moved, open a PR.
      - name: Roll zsh plugin pins forward and open a PR
        if: env.MODE == 'pr'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          ./scripts/update-plugins.sh        # apply mode: rewrites the pinned SHAs in place
          if git diff --quiet -- zsh/45-plugins.zsh; then
            echo "✅ zsh plugin pins already current — no PR needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add zsh/45-plugins.zsh
          git commit -m "chore(deps): roll zsh plugin pins forward (freshness bot)"
          git push -f -u origin "$BRANCH"
          # Idempotent: update the existing PR if one is already open for this branch.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(deps): roll zsh plugin pins forward" \
              --body "Automated by the freshness bot. Pinned zsh-plugin SHAs in \`zsh/45-plugins.zsh\` were behind upstream; this rolls them to current HEAD. Review the diff, let CI run, then merge."
          fi
          echo "📦 opened/updated PR on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

  # Core does not author the editor any more (#1123): nvim/ is a vendored copy of
  # dotgibson/dotfiles-nvim pinned by nvim.lock, and the PLUGIN-pin bump that used to live
  # here moved to that repo, which has a real Neovim to test a bump against. What is left
  # for Core is the other half — noticing that the PIN has stopped moving.
  #
  # REPORT ONLY, no PR, and that is deliberate. NVIM-SPLIT-PROPOSAL.md §7(3) decided Core
  # adopts the editor with a Core release rather than on every nvim release, so a bot that
  # opened a bump PR per release would reimport exactly the churn the extraction removed.
  # The nudge exists so "at Core's pace" cannot decay into "never".
  #
  # Needs no App token (it pushes nothing) and no Neovim (it compares tags), which is why
  # it is a fraction of the job it replaces.
  nvim-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the nvim pin
        id: check
        continue-on-error: true
        run: ./scripts/check-nvim-freshness.sh 2>&1 | tee "$RUNNER_TEMP/nvim-pin.txt"
      - name: Job summary
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "✅ \`nvim.lock\` is current with dotgibson/dotfiles-nvim" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### ⚠️ \`nvim.lock\` is behind dotfiles-nvim"; echo ""; echo '```'; \
              cat "$RUNNER_TEMP/nvim-pin.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Re-assert the verdict the reporting step swallowed with continue-on-error, so the
      # summary is written AND the job is honestly red — fleet-drift.yml's shape.
      - name: Fail on a stale pin
        if: steps.check.outcome != 'success'
        run: |
          echo "nvim.lock is behind dotgibson/dotfiles-nvim — see the job summary." >&2
          exit 1

  # scripts/fleet-package-versions.tsv feeds PORTING-MATRIX.md's generated fleet-version
  # blocks — one per tool, registered in gen-porting-matrix.sh's FV_TOOLS (#1082).
  # gen-porting-matrix.sh never reaches the network (it runs inside an offline
  # audit), so it can only say a row has not been re-checked lately — it cannot check.
  # This is the half that looks. Same shape as the pin jobs above, and for the same reason:
  # a nudge a human has to action by hand is one nobody actions.
  fleet-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      MODE: ${{ github.event.inputs.mode || 'pr' }}
      BRANCH: automation/freshness-fleet-versions
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint a scoped installation token (if the App is installed here)
        id: app
        if: env.MODE == 'pr' && vars.FLEET_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id rather than app-id, which is deprecated at this pin (#831). The variable
          # holds the App's Client ID — a different value from its App ID.
          client-id: ${{ vars.FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # This job rewrites scripts/fleet-package-versions.tsv and the generated block in
          # PORTING-MATRIX.md — never .github/workflows/, so no workflows: write. If that
          # ever changes the push fails loudly rather than the token having quietly been
          # able to rewrite CI all along.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Check recorded fleet versions (report only)
        if: env.MODE == 'check'
        run: |
          if ./scripts/update-fleet-versions.sh --check; then
            echo "✅ every probeable fleet version row is current" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            # 1 = a row is behind (the report, working as intended). 2 = the probe could
            # not be reached, which is an environment failure and must not be filed as a
            # fleet finding — the distinction the updater exits separately for.
            if [ "$rc" = 2 ]; then
              echo "### ❌ the version probe was unreachable — nothing was verified" >> "$GITHUB_STEP_SUMMARY"
            else
              { echo "### ⚠️ a recorded fleet version is behind upstream"; echo ""; \
                echo "Re-run this workflow with mode=pr to roll the rows forward."; } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$rc"
          fi
      # APPLY MODE CANNOT FINISH WITHOUT THE FLEET (#917). The TSV feeds PORTING-MATRIX.md's
      # generated block, so the updater regenerates the matrix straight after writing it —
      # and gen-porting-matrix.sh reads the SIBLING checkouts, defaulting to this repo's
      # parent, which on a runner is empty. The job's first scheduled run probed every row
      # successfully, wrote the TSV, then died on `!! regeneration failed`. (No count here:
      # this comment said "all 16 rows" until #1082 made it 49, which is exactly the class
      # of stale assertion the TSV itself exists to end.)
      #
      # Cloned public, anonymous and shallow, the idiom parity-check.yml already uses. The
      # list comes from scripts/os-repos.txt rather than being spelled here: that file is
      # the one place fleet membership lives, and a second copy in a workflow is the kind
      # that goes stale silently. Two of the nine are role repos the matrix has no column
      # for — cloning them shallow costs nothing and keeps this free of a second registry.
      - name: Clone the fleet (public, anonymous, shallow)
        if: env.MODE == 'pr'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet"
          # One repo that cannot be cloned anonymously — private, renamed, archived — must not
          # abort the loop under `set -e` before the updater's own absent-fleet path gets to
          # run (#933). It is warned by name and skipped; gen-porting-matrix.sh reports a
          # sibling it cannot read as an environment skip, which is the honest answer.
          while IFS= read -r repo; do
            case "$repo" in ''|\#*) continue ;; esac
            git clone --depth 1 --quiet \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/$repo.git" \
              "$RUNNER_TEMP/fleet/$repo" ||
              echo "::warning::could not clone $repo anonymously — its column will be skipped"
          done < scripts/os-repos.txt
          echo "cloned: $(find "$RUNNER_TEMP/fleet" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ')"

      - name: Re-verify fleet versions and open a PR
        if: env.MODE == 'pr'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # Apply mode rewrites confirmed rows (version AND verified date) and regenerates
          # the matrix block. A row it could not confirm keeps its old date, so the
          # staleness notice still names it rather than a failed probe reading as fresh.
          #
          # 3 = the fleet is absent, which the updater exits separately for so that an
          # environment fact stops reading as a defect (#917) — but under `set -e` a bare
          # call reds the step on 3 exactly as it did on 2, so the distinction only exists if
          # the caller branches on it (#933). The check-mode step above already does.
          if ! ./scripts/update-fleet-versions.sh --fleet "$RUNNER_TEMP/fleet"; then
            rc=$?
            if [ "$rc" = 3 ]; then
              echo "### ⚠️ the sibling fleet was unavailable — versions were probed but the matrix could not be regenerated, so nothing was written" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$rc"
          fi
          if git diff --quiet -- scripts/fleet-package-versions.tsv PORTING-MATRIX.md; then
            echo "✅ fleet versions already current — no PR needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add scripts/fleet-package-versions.tsv PORTING-MATRIX.md
          git commit -m "chore(matrix): re-verify fleet package versions (freshness bot)"
          git push -f -u origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(matrix): re-verify fleet package versions" \
              --body "Automated by the freshness bot. Re-read every probeable row in \`scripts/fleet-package-versions.tsv\` from upstream and regenerated PORTING-MATRIX.md's fleet-version blocks.

          A changed version means a distro moved. An unchanged version with a newer \`verified\` date means the row was confirmed — that is the point: it proves somebody looked, so a stable row does not read as stale. Rows the probe could not answer keep their old date and are listed in the run log as needing a human, and a whole TOOL whose project slug answered nothing is called out separately — fifteen \`?\` lines are one wrong name, not fifteen unlucky lanes.

          **Read the \`<probe>\` column before accepting a drift row.** A \`-\` there is deliberate: the Gentoo rows record the newest STABLE-keyworded ebuild and the openSUSE tree-sitter rows come from a differently-named package, so an automated re-read would answer a different question from the one the footnote asks.

          Review the diff, let CI run, then merge.

          No-Issue: routine automated re-verification, nothing filed"
          fi
          echo "📦 opened/updated PR on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

  # Turn a red run into a deduplicated issue (G1). Scheduled-only: a manual `mode=check`
  # run exits non-zero BY DESIGN when pins are behind (that's the report, not a crash), so
  # scoping to schedule avoids paging on that intended signal while still catching a real
  # scheduled-run failure (a crashed updater, a failed push).
  notify-failure:
    needs: [zsh-plugins, nvim-pin, fleet-versions]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure-call.yml
    with:
      workflow: freshness
      title: "ci-failure: freshness bot is red"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "The weekly freshness bot failed on a scheduled run (rolling zsh-plugin SHAs forward, or checking the nvim.lock pin). The updater may have crashed or the push/PR step failed — the pins are not being kept current."
