name: pr-link-check

# A `fix(…)` PR must close an issue, or say in writing why it doesn't.
#
# #446 fixed #420 (starship) and #423 (carapace) and merged green with no closing
# keyword in its body. GitHub linked nothing, both issues stayed OPEN, and days
# later a reader re-derived a 2021 upstream rename to re-confirm a bug that had
# already shipped in v4.12.0. The code was right; the LINK was missing, and no
# check objected. This is that check.
#
# Deliberately its OWN workflow rather than a job in ci.yml, for one reason: it has
# to re-run when the PR BODY changes (`types: edited`), and putting that trigger on
# ci.yml would re-run the whole audit matrix — ubuntu + macOS + alpine + arch + bench —
# every time someone fixes a typo in a description. This job is a checkout and one
# GraphQL query, so it can afford the chatty trigger that makes the escape hatch
# feel instant.
#
# The verdict logic is scripts/ci-pr-link.sh — shellcheck'd and unit-tested in
# scripts/test-core.sh, following the scripts/ci-classify.sh precedent, so the rule
# is testable by hand and can't rot silently inside YAML.

on:
  pull_request:
    # opened/reopened/ready_for_review: first look. edited: the title or body changed —
    # this is the one that matters, because adding `Closes #N` or `No-Issue: …` IS a
    # body edit, and without it a fixed PR would sit red until an unrelated push.
    # synchronize: cheap insurance if a link is established alongside new commits.
    #
    # KNOWN GAP, and why the body is the documented route: GitHub emits NO pull_request
    # activity when an issue is linked or unlinked from the "Development" sidebar. This
    # check counts such a link when it happens to run, but nothing re-triggers it — so a
    # sidebar link leaves a red check red until someone edits the body or re-runs the job,
    # and unlinking after a green run leaves the check stale-green. There is no event to
    # subscribe to; the failure message therefore steers authors to a body keyword and
    # says plainly that the sidebar route needs a manual re-run.
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# Body edits arrive in bursts while someone is typing. Key on the PR number and
# cancel superseded runs so only the latest state is judged.
concurrency:
  group: pr-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link:
    # Drafts are work in progress — the link is expected by the time it is ready for
    # review, not while it is still being written. `ready_for_review` above is what
    # brings a draft into scope the moment it leaves draft.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count issues this PR closes
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # closingIssuesReferences is the SAME thing GitHub itself uses to auto-close
          # on merge, so this asks the question the bug was actually about. It counts
          # both routes — a closing keyword in the body AND a manual link from the
          # "Development" sidebar — which is why the check can't be satisfied by
          # cosmetic text like "Refs #420" that reads like a link but closes nothing.
          # RETRY, because a single attempt is not enough in practice. github.com served
          # sustained 503s during one session here — enough to fail this probe on a PR
          # whose link was demonstrably intact (#499 → #498), and enough to make several
          # unrelated API calls fail alongside it. A transient blip must not reach the
          # verdict logic at all; that path exists for a genuinely unreachable API, not
          # for ordinary flakiness. Backoff is 0s/2s/6s/12s — quadratic, ~20s worst case,
          # well inside the job's 5-minute budget. See #500.
          count=""
          for attempt in 1 2 3 4; do
            # shellcheck disable=SC2016  # $owner/$repo/$number are GRAPHQL variables,
            # bound by the -f/-F flags below. Single quotes are required: letting the
            # shell expand them would send an empty query, and the probe would then
            # report a confident zero for a PR it never actually asked about.
            if count="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$number){
                    closingIssuesReferences(first:20){ totalCount }
                  }
                }
              }' \
              -f owner="$OWNER" -f repo="$REPO" -F number="$NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount' 2>/dev/null)" \
              && [[ "$count" =~ ^[0-9]+$ ]]; then
              break
            fi
            # Require a NUMERIC result, not merely exit 0: gh can succeed while --jq
            # yields empty (a partial GraphQL response with an errors block), and an
            # empty string would otherwise be mistaken for a successful "no links".
            count=""
            printf 'probe attempt %s failed; retrying\n' "$attempt" >&2
            sleep $(((attempt - 1) * (attempt - 1) + attempt - 1))
          done
          # `unknown` is a DISTINCT state, not zero. ci-pr-link.sh gives it its own
          # verdict (probe-failed) so the check never tells an author their linked PR
          # has no link — it still fails, but it says the API was unreachable.
          printf 'linked=%s\n' "${count:-unknown}" | tee -a "$GITHUB_OUTPUT"

      - name: Enforce the link-or-reason rule
        env:
          # Via env, NEVER inlined as ${{ … }} in the run block. A PR title and body
          # are attacker-controlled text; interpolating them straight into the shell
          # is the classic Actions script-injection hole (a title containing
          # backticks or $(…) would execute here). Quoted expansions keep them data.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LINKED: ${{ steps.count.outputs.linked }}
        run: |
          set -uo pipefail
          # Plain redirects to files, then replay — NOT `> >(tee …)`: a process
          # substitution is not guaranteed to have flushed by the time the next
          # command reads the file, which would race the summary against the verdict.
          rc=0
          printf '%s' "$PR_BODY" \
            | ./scripts/ci-pr-link.sh "$PR_TITLE" "$LINKED" >/tmp/verdict 2>/tmp/explain || rc=$?
          cat /tmp/verdict
          cat /tmp/explain >&2
          {
            echo "### pr-link-check: \`$(cut -d= -f2 /tmp/verdict)\`"
            echo
            echo '```text'
            cat /tmp/explain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
