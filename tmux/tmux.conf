# core/tmux/tmux.conf  → symlinked to ~/.config/tmux/tmux.conf
# ══════════════════════════════════════════════════════════════════════════════
# Portable base config + a hand-rolled tokyonight-storm status line.
#
# WHY HAND-ROLLED (was: janoamaral/tokyo-night-tmux): a plugin owns the whole bar
# and fights you the moment you want a custom segment. Rolling it by hand with
# native formats lets the status show what's actually useful to an operator — most
# importantly your VPN/tunnel IP (scripts/tmux-netinfo.sh) — and keeps the palette
# identical to Neovim + starship (tokyonight storm) instead of three near-themes.
#
# LAYERS (load order matters):
#   1. tmux.reset.conf  — the keybinding layer (sourced first; see that file)
#   2. this file        — terminal, options, theme/status, plugins
#   3. os.conf          — per-OS bits (battery, net iface) via @status_right_os
#   4. role.conf        — the Role layer's tmux bits (dotfiles-Offense /
#                         dotfiles-Defense). Last of the config layers, so a role
#                         binding wins over Core's; absent on an OS-only box.
# ══════════════════════════════════════════════════════════════════════════════

# ── 1. Keybinding layer (omerxx-style split) ─────────────────────────────────
source-file ~/.config/tmux/tmux.reset.conf

# =========================================================
# Colours & Terminal
# =========================================================
set -g  default-terminal "tmux-256color"
# Native feature flags supersede the legacy ",*:Tc" truecolor override:
#   RGB        truecolor
#   usstyle    undercurl + coloured underlines (nvim diagnostics)   [>= 3.2]
#   hyperlinks OSC 8 clickable links                                [>= 3.4]
# Newest flag goes LAST: an older tmux stops at the first name it doesn't know,
# so RGB/usstyle still apply even where hyperlinks is unrecognised.
set -ga terminal-features ",*:RGB:usstyle:hyperlinks"

# =========================================================
# Options
# =========================================================
set -g  mouse on
set -g  history-limit 100000
set -g  base-index 1
set -g  pane-base-index 1
set-window-option -g pane-base-index 1
set -g  renumber-windows on
set -g  detach-on-destroy off        # closing a session jumps to another, not exit
set -g  set-clipboard on             # let apps set the system clipboard (OSC 52)
set -g  focus-events on              # nvim autoread / checkhealth
set -sg escape-time 10               # nvim checkhealth
set-option -g set-titles on
set-option -g set-titles-string "#{session_name} · #{pane_current_command}"
set -g cursor-style block

# =========================================================
# tokyonight-storm palette (kept in sync with starship.toml + tmux-netinfo.sh)
# =========================================================
set -g @tn_bg      "#24283b"
set -g @tn_bg_dark "#1f2335"
set -g @tn_bg_hl   "#292e42"
set -g @tn_fg      "#c0caf5"
set -g @tn_fg_dim  "#a9b1d6"
set -g @tn_blue    "#7aa2f7"
set -g @tn_cyan    "#7dcfff"
set -g @tn_green   "#9ece6a"
set -g @tn_magenta "#bb9af7"
set -g @tn_red     "#f7768e"
set -g @tn_yellow  "#e0af68"
set -g @tn_orange  "#ff9e64"
set -g @tn_comment "#565f89"
set -g @tn_black   "#414868"

# rounded pill caps (Nerd Font) — segments "float" on the transparent bar
set -g @cap_l ""
set -g @cap_r ""

# =========================================================
# Pane borders (transparent bg; active = magenta, like nvim's accent)
# =========================================================
set -g pane-border-style        "fg=#{@tn_black},bg=default"
set -g pane-active-border-style "fg=#{@tn_magenta},bg=default"
set -g pane-border-status off

# =========================================================
# Status bar — transparent base: session + right float as pills, windows are flat tabs
# =========================================================
set -g status 2
set -g status-format[1] ""
set -g status-interval 5
set -g status-position top
set -g status-justify centre
# T3: flag windows with unseen output / bells (shown as dots in the tabs below)
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g window-status-activity-style none
set -g window-status-bell-style none
set -g status-style "bg=default,fg=#{@tn_bg_hl}"

# ── LEFT island: session pill (state-colored) · VPN/LAN IP pill (moved here to balance the centered tabs)
#      normal → blue · prefix active → orange · copy/search mode → yellow
set -g status-left-length 60
set -g status-left "\
#[fg=#{@tn_bg_dark},bg=default] #{@cap_l}\
#[bg=#{@tn_bg_dark},fg=#{?client_prefix,#{@tn_orange},#{?pane_in_mode,#{@tn_yellow},#{@tn_blue}}},bold]#S#{?client_prefix, 󰠠,#{?pane_in_mode, 󰆏,  }}\
#[fg=#{@tn_bg_dark},bg=default]#{@cap_r} #(~/.config/tmux/scripts/tmux-netinfo.sh) #{p19:} "

# ── WINDOWS: flat underlined tabs — inactive muted + activity/bell dots · active blue+underline
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@tn_comment},bg=default] #I:#W#{?window_activity_flag,#[fg=#{@tn_yellow}] •,}#{?window_bell_flag,#[fg=#{@tn_red}] •,} "

set -g window-status-current-format "#[fg=#{@tn_blue},bg=default] #[bold,underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰊓,}#[nobold] "

# ── RIGHT island: VPN/LAN IP · cwd (ONLY when focused pane is nvim) · clock · per-OS bits
#    @status_right_os is appended by each OS repo's os.conf (battery, etc.);
#    default empty so boxes without one render cleanly.
set -gq @status_right_os ""
set -g status-right-length 150
set -g status-right "\
#{?#{==:#{pane_current_command},nvim},#[fg=#{@tn_red}#,bg=default#,bold]󰉋 #{p16:#{=16:#{b:pane_current_path}}} ,#{p19:}}\
#[fg=#{@tn_bg_dark},bg=default]#{@cap_l}#[fg=#{@tn_magenta},bg=#{@tn_bg_dark},bold]󰥔 %H:%M#[fg=#{@tn_bg_dark},bg=default]#{@cap_r}\
  #{@status_right_os} "

# message / command-prompt styling
set -g message-style "fg=#{@tn_fg},bg=#{@tn_bg},bold"
set -g mode-style    "fg=#{@tn_fg},bg=#{@tn_bg}"

# =========================================================
# Plugins
# =========================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l cross into nvim
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'                # prefix+u: fzf URLs out of pane (recon-handy)

# tokyo-night-tmux removed — the bar above is hand-rolled.

# ── vim-tmux-navigator ────────────────────────────────────────────────────────
# Keep C-h/j/k/l (the reason this plugin is here) and DROP its fifth mapping.
#
# The plugin also binds C-\ in the ROOT table to `select-pane -l`, forwarding the key
# only when the pane is running vim/fzf. A shell pane is neither, so tmux swallowed C-\
# and zsh never saw it — silently killing `Ctrl+\ → autosuggest-toggle`
# (zsh/40-bindings.zsh), which tmux/scripts/tmux-cheat.sh advertises by name. That is not
# an edge case: every OS repo's zshrc `exec tmux` on login, so the key was dead in
# essentially every shell on every box in the fleet.
#
# Dropping the plugin's side rather than moving zsh's is what the rest of the tree already
# assumes: nvim/lua/gerrrt/plugins/vim-tmux-navigator.lua maps ONLY <C-h/j/k/l> and
# deliberately never mapped <C-\>, so `TmuxNavigatePrevious` was a lazy `cmd` bound to
# nothing. "Previous pane" was half-wired; the autosuggest toggle is documented.
#
# An EMPTY value is the off switch: the plugin's get_tmux_option() returns the default only
# when `show-options -gq` prints nothing, and a defined-but-empty option prints its own name
# — so the value resolves to "" and its `for k in $(echo "")` loop never runs. Verified on
# tmux 3.7c: root C-\ disappears, C-h/j/k/l survive. (The plugin also accepts the literal
# 'null' for older tmux; '' is the modern spelling and needs no compat path.)
#
# MUST stay ABOVE the `run '…/tpm'` at the end of this file — tpm sources the plugin's
# .tmux script, which reads this option at that moment. Set below it and it is a no-op.
set -g @vim_navigator_mapping_prev ''

# ── resurrect + continuum ─────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── tmux-fzf-url ──────────────────────────────────────────────────────────────
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-w 60% -h 40% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ── per-OS bits (netspeed iface + battery → @status_right_os): os/<os>.conf ───
source-file -q ~/.config/tmux/os.conf

# =========================================================
# Pop-ups  (scripts live in core/tmux/scripts → ~/.config/tmux/scripts)
# =========================================================
bind w display-popup -E -w 40% -h 50% "~/.config/tmux/scripts/tmux-menu.sh"
bind T display-popup -EE -w 80% -h 80% "~/.config/tmux/scripts/tmux-scratch.sh"
bind g display-popup -d "#{pane_current_path}" -EE -w 85% -h 85% lazygit
# prefix + a — Claude Code, one persistent session per repo. -EE like lazygit (close on any
# exit); the script attaches to a detached session, so dismissing hides rather than kills.
bind a display-popup -d "#{pane_current_path}" -EE -w 85% -h 85% "~/.config/tmux/scripts/tmux-claude.sh"
# prefix + f — sesh session picker (replaces tmux-sessionizer.sh)
bind f display-popup -E -w 55% -h 65% "~/.config/tmux/scripts/tmux-sesh.sh"
bind ? display-popup -E -w 78% -h 80% "~/.config/tmux/scripts/tmux-cheat.sh"

# ── Role layer (dotfiles-Offense / dotfiles-Defense): role/<role>.conf ────────
# Sourced AFTER the pop-up bindings above, not beside os.conf, and the difference is
# load-bearing. os.conf only ever *sets* options (@status_right_os, @netspeed_iface),
# so it can load early; a role layer BINDS KEYS — dotfiles-Offense binds `prefix + e`
# to its engagement-session popup — and tmux gives the last binding of a key. Sourced
# up beside os.conf, any future Core `bind e` would silently take the key back.
#
# -q so a box with no role repo (every OS-only machine) stays silent rather than
# erroring on a missing file, exactly as os.conf does.
source-file -q ~/.config/tmux/role.conf

# =========================================================
# TPM bootstrap (auto-clone TPM on first run)
# =========================================================
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
